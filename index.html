let imp = null;
function resetImportu() {
  imp = { krok: 1, encja: null, nazwaPliku: '', arkusze: [], arkuszIdx: 0,
          wierszNagl: 0, mapowanie: {}, opcje: { aktualizuj: true, tworzLokalizacje: true } };
}

function importuj() {
  if (!imp) resetImportu();

  /* --- krok 1: co wczytujemy --- */
  if (imp.krok === 1) {
    return {
      tytul: 'Import z pliku', wstecz: true,
      html:
        '<div class="karta"><h2>Skąd wziąć plik</h2><p>Aplikacja czyta <b>.xlsx</b> i <b>.csv</b>. ' +
        'Jeśli masz dane na papierze — w Excelu na telefonie użyj funkcji ' +
        '<b>Wstaw dane z obrazu</b>, zrób zdjęcie tabeli, popraw co trzeba i zapisz plik. ' +
        'Potem wczytaj go tutaj.</p></div>' +
        '<div class="naglowek-sekcji">Co zawiera plik?</div>' +
        '<div class="lista">' +
        Object.entries(Importer.POLA).map(([k, v]) =>
          '<button class="poz" type="button" data-e="' + k + '"><div class="tre">' +
          '<div class="tyt">' + h(v.tytul) + '</div><div class="pod" style="white-space:normal">' +
          h(v.opis) + '</div></div><div class="licz">›</div></button>').join('') +
        '</div>',
      po: () => {
        widok().querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
          imp.encja = b.dataset.e; imp.krok = 2; odswiez();
        });
      }
    };
  }

  const def = Importer.POLA[imp.encja];

  /* --- krok 2: wybór pliku --- */
  if (imp.krok === 2) {
    return {
      tytul: def.tytul, wstecz: true,
      html:
        '<div class="karta"><h2>' + h(def.tytul) + '</h2><p>' + h(def.opis) + '</p></div>' +
        '<button class="b glowny" id="wybierz">Wybierz plik .xlsx lub .csv</button>' +
        '<input type="file" id="plik-imp" accept=".xlsx,.xlsm,.csv,.txt,text/csv" hidden>' +
        '<button class="b" id="wroc-1">← Zmień rodzaj danych</button>' +
        '<div class="karta"><h2>Oczekiwane kolumny</h2><p>' +
        h(def.pola.map(p => p.n + (p.wym ? ' *' : '')).join(' · ')) +
        '<br><br>Nagłówki nie muszą się dokładnie zgadzać — aplikacja spróbuje je rozpoznać, ' +
        'a potem i tak pokaże Ci przypisanie do poprawienia. Gwiazdką oznaczone pola wymagane.</p></div>',
      po: () => {
        $('#wroc-1').onclick = () => { imp.krok = 1; odswiez(); };
        $('#wybierz').onclick = () => $('#plik-imp').click();
        $('#plik-imp').onchange = async e => {
          const f = e.target.files[0];
          if (!f) return;
          toast('Czytam plik…');
          try {
            const wynik = await Importer.czytajPlik(f);
            if (!wynik.arkusze.length || !wynik.arkusze[0].wiersze.length)
              throw new Error('Plik nie zawiera danych.');
            imp.nazwaPliku = f.name;
            imp.arkusze = wynik.arkusze;
            imp.arkuszIdx = 0;
            imp.wierszNagl = Importer.zgadnijWierszNaglowka(wynik.arkusze[0].wiersze);
            imp.mapowanie = Importer.zgadnijMapowanie(naglowki(), imp.encja);
            imp.krok = 3;
            odswiez();
          } catch (err) {
            modal('Nie udało się wczytać', '<p>' + h(err.message) + '</p>' +
              '<p style="margin-top:8px;font-size:13.5px;color:var(--tx2)">' +
              'Jeśli plik pochodzi ze starszego Excela (.xls), otwórz go i zapisz ' +
              'jako .xlsx albo CSV.</p>', [{ tekst: 'Rozumiem' }]);
          }
        };
      }
    };
  }

  const ark = imp.arkusze[imp.arkuszIdx] || { wiersze: [] };

  /* --- krok 3: mapowanie kolumn --- */
  if (imp.krok === 3) {
    const nag = naglowki();
    const przyklad = ark.wiersze[imp.wierszNagl + 1] || [];
    const opcjeKol = i => '<option value="">— pomiń —</option>' +
      nag.map((n, j) => '<option value="' + j + '"' +
        (imp.mapowanie[i] === j ? ' selected' : '') + '>' +
        h((n || ('kolumna ' + (j + 1))).slice(0, 40)) + '</option>').join('');

    return {
      tytul: 'Przypisz kolumny', wstecz: true,
      html:
        '<div class="karta"><h2>' + h(imp.nazwaPliku) + '</h2><p>' +
        h(ark.wiersze.length - imp.wierszNagl - 1) + ' wierszy danych, ' +
        h(nag.length) + ' kolumn.</p></div>' +
        (imp.arkusze.length > 1
          ? polSelectId('ark', 'Arkusz', String(imp.arkuszIdx),
              imp.arkusze.map((a, i) => [String(i), a.nazwa + ' (' + a.wiersze.length + ' w.)']))
          : '') +
        pole('naglRow', 'Który wiersz zawiera nagłówki', imp.wierszNagl + 1, 'number') +
        '<div class="naglowek-sekcji">Przypisanie kolumn</div>' +
        def.pola.map((p, i) =>
          '<label><span class="et">' + h(p.n) + (p.wym ? ' *' : '') +
          (imp.mapowanie[p.k] != null && przyklad[imp.mapowanie[p.k]]
            ? ' — przykład: ' + h(String(przyklad[imp.mapowanie[p.k]]).slice(0, 28)) : '') +
          '</span><select id="map-' + p.k + '">' + opcjeKol(p.k) + '</select></label>').join('') +
        (imp.encja === 'sprzet'
          ? '<label class="ptak"><input type="checkbox" id="o-lok"' +
            (imp.opcje.tworzLokalizacje ? ' checked' : '') +
            '><span class="et">Zakładaj brakujące pomieszczenia</span></label>' : '') +
        (imp.encja !== 'dostawa'
          ? '<label class="ptak" style="margin-top:9px"><input type="checkbox" id="o-akt"' +
            (imp.opcje.aktualizuj ? ' checked' : '') +
            '><span class="et">Aktualizuj pozycje, które już są w bazie</span></label>' : '') +
        (imp.encja === 'dostawa'
          ? '<div class="naglowek-sekcji">Dane dokumentu</div><div class="karta">' +
            pole('dostawca', 'Dostawca', imp.opcje.dostawca) +
            '<div class="rzad">' + pole('nrFaktury', 'Nr faktury / WZ', imp.opcje.nrFaktury) +
            pole('data', 'Data', imp.opcje.data || dzisISO(), 'date') + '</div></div>' : '') +
        '<button class="b glowny" id="dalej" style="margin-top:12px">Sprawdź, co się wczyta</button>' +
        '<button class="b" id="wroc-2">← Inny plik</button>',
      po: () => {
        const ar = $('#f-ark');
        if (ar) ar.onchange = () => {
          imp.arkuszIdx = +ar.value;
          imp.wierszNagl = Importer.zgadnijWierszNaglowka(imp.arkusze[imp.arkuszIdx].wiersze);
          imp.mapowanie = Importer.zgadnijMapowanie(naglowki(), imp.encja);
          odswiez();
        };
        $('#f-naglRow').onchange = e => {
          imp.wierszNagl = Math.max(0, (parseInt(e.target.value, 10) || 1) - 1);
          imp.mapowanie = Importer.zgadnijMapowanie(naglowki(), imp.encja);
          odswiez();
        };
        $('#wroc-2').onclick = () => { imp.krok = 2; odswiez(); };
        $('#dalej').onclick = () => {
          imp.mapowanie = {};
          def.pola.forEach(p => {
            const v = $('#map-' + p.k).value;
            if (v !== '') imp.mapowanie[p.k] = +v;
          });
          const brak = def.pola.filter(p => p.wym && imp.mapowanie[p.k] == null);
          if (brak.length) { toast('Przypisz kolumnę: ' + brak.map(p => p.n).join(', '), 3500); return; }
          const ol = $('#o-lok'), oa = $('#o-akt');
          if (ol) imp.opcje.tworzLokalizacje = ol.checked;
          if (oa) imp.opcje.aktualizuj = oa.checked;
          if (imp.encja === 'dostawa')
            Object.assign(imp.opcje, zbierz(['dostawca', 'nrFaktury', 'data']));
          imp.krok = 4;
          odswiez();
        };
      }
    };
  }

  /* --- krok 4: podgląd i zapis --- */
  const dane = ark.wiersze.slice(imp.wierszNagl + 1);
  const plan = Importer.przygotuj(imp.encja, dane, imp.mapowanie);
  const doZapisu = plan.nowe.length + (imp.opcje.aktualizuj ? plan.aktualizacje.length : 0);

  const podglad = (lista, tytul, klasa) => !lista.length ? '' :
    '<div class="naglowek-sekcji">' + tytul + ' (' + lista.length + ')</div><div class="lista">' +
    lista.slice(0, 12).map(x =>
      '<div class="poz"><div class="tre"><div class="tyt">' +
      h(x.rek.nazwa || x.rek.kod || '—') + '</div><div class="pod">' +
      h(Object.entries(x.rek).filter(([k, v]) => k !== 'nazwa' && v !== '' && v != null)
        .map(([k, v]) => v).join(' · ').slice(0, 70) || '—') +
      '</div></div><div class="licz"><span class="znacz ' + klasa + '">' +
      (klasa === 'ok' ? 'nowy' : 'zmiana') + '</span></div></div>').join('') +
    (lista.length > 12 ? '<div class="poz"><div class="tre"><div class="pod">…i jeszcze ' +
      (lista.length - 12) + '</div></div></div>' : '') + '</div>';

  return {
    tytul: 'Podgląd importu', wstecz: true,
    html:
      '<div class="stat">' +
        '<div><b style="color:var(--ok)">' + plan.nowe.length + '</b><span>nowych</span></div>' +
        '<div><b>' + plan.aktualizacje.length + '</b><span>istniejących</span></div>' +
        '<div><b style="color:' + (plan.bledy.length ? 'var(--zle)' : 'var(--tx2)') + '">' +
          plan.bledy.length + '</b><span>pominiętych</span></div>' +
      '</div>' +
      (imp.encja === 'dostawa'
        ? '<div class="alert ok"><div><b>Powstanie jeden dokument przyjęcia</b>' +
          plan.nowe.length + ' pozycji' +
          (imp.opcje.dostawca ? ', dostawca: ' + h(imp.opcje.dostawca) : '') +
          '. Produkty nieznane z katalogu dopiszą się same.</div></div>'
        : (!imp.opcje.aktualizuj && plan.aktualizacje.length
          ? '<div class="alert uw"><div><b>' + plan.aktualizacje.length +
            ' pozycji zostanie pominiętych</b>Są już w bazie, a aktualizacja jest wyłączona.</div></div>'
          : '')) +
      podglad(plan.nowe, 'Do dodania', 'ok') +
      (imp.opcje.aktualizuj ? podglad(plan.aktualizacje, 'Do aktualizacji', 'uw') : '') +
      (plan.bledy.length
        ? '<div class="naglowek-sekcji">Pominięte wiersze</div><div class="lista">' +
          plan.bledy.slice(0, 10).map(b =>
            '<div class="poz"><div class="tre"><div class="tyt">Wiersz ' + b.nr + '</div>' +
            '<div class="pod">' + h(b.powod) + ' · ' + h(b.podglad.slice(0, 44)) +
            '</div></div></div>').join('') + '</div>' : '') +
      '<button class="b glowny" id="zapisz-imp" ' + (doZapisu ? '' : 'disabled') + '>' +
        (doZapisu ? 'Wczytaj ' + doZapisu + ' pozycji' : 'Nie ma czego wczytać') + '</button>' +
      '<button class="b" id="wroc-3">← Popraw przypisanie</button>',
    po: () => {
      $('#wroc-3').onclick = () => { imp.krok = 3; odswiez(); };
      $('#zapisz-imp').onclick = async () => {
        const b = $('#zapisz-imp');
        b.disabled = true; b.textContent = 'Wczytuję…';
        try {
          const w = await Importer.wykonaj(imp.encja, plan, imp.opcje);
          const cel = imp.encja === 'sprzet' ? '#/sprzet'
                    : imp.encja === 'lokalizacje' ? '#/lokalizacje'
                    : imp.encja === 'dostawa' ? '#/stany?f=dok' : '#/stany?f=katalog';
          resetImportu();
          toast('Wczytano: ' + w.dodane + ' nowych, ' + w.zmienione + ' zmienionych', 4000);
          location.hash = cel;
        } catch (e) {
          toast('Błąd zapisu: ' + e.message, 5000);
          b.disabled = false; b.textContent = 'Spróbuj ponownie';
        }
      };
    }
  };
}

function naglowki() {
  const ark = imp.arkusze[imp.arkuszIdx];
  if (!ark) return [];
  return (ark.wiersze[imp.wierszNagl] || []).map((x, i) =>
    String(x || '').trim() || ('kolumna ' + (i + 1)));
}

/* ==================================================================
   pola formularzy
   ================================================================== */
/* Pola liczbowe robimy jako type="text" z klawiaturą numeryczną.
   Natywne input[type=number] odrzuca przecinek, a polska klawiatura
   podaje właśnie przecinek — wpisana kwota przepadałaby bez śladu. */
function pole(id, etykieta, wart, typ, podp) {
  const liczba = typ === 'number';
  return '<label><span class="et">' + h(etykieta) + '</span>' +
    '<input id="f-' + id + '" type="' + (liczba ? 'text' : (typ || 'text')) + '"' +
    (liczba ? ' inputmode="decimal" data-num="1"' : '') +
    ' value="' + h(wart == null ? '' : wart) + '"' +
    (podp ? ' placeholder="' + h(podp) + '"' : '') + '></label>';
}

/* '18,50' i '1 200' -> 1200 ; puste -> null */
function naLiczbe(v) {
  if (v == null) return null;
  const s = String(v).replace(/\s| /g, '').replace(',', '.').trim();
  if (s === '') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function poleObszar(id, etykieta, wart) {
  return '<label><span class="et">' + h(etykieta) + '</span>' +
    '<textarea id="f-' + id + '">' + h(wart == null ? '' : wart) + '</textarea></label>';
}
function polSelect(id, etykieta, wart, opcje, etykiety) {
  return '<label><span class="et">' + h(etykieta) + '</span><select id="f-' + id + '">' +
    opcje.map(o => '<option value="' + h(o) + '"' + (o === wart ? ' selected' : '') + '>' +
      h(etykiety ? etykiety[o] : o) + '</option>').join('') + '</select></label>';
}
function polSelectId(id, etykieta, wart, pary) {
  return '<label><span class="et">' + h(etykieta) + '</span><select id="f-' + id + '">' +
    pary.map(([v, n]) => '<option value="' + h(v) + '"' + (v === wart ? ' selected' : '') + '>' +
      h(n) + '</option>').join('') + '</select></label>';
}
function zbierz(pola) {
  const o = {};
  pola.forEach(p => {
    const e = $('#f-' + p);
    if (!e) return;
    o[p] = (e.dataset && e.dataset.num) ? naLiczbe(e.value)
         : (typeof e.value === 'string' ? e.value.trim() : e.value);
  });
  return o;
}

/* ==================================================================
   ROUTER
   ================================================================== */
const TRASY = [
  [/^\/?$|^\/pulpit$/, () => pulpit()],
  [/^\/stany$/, p => stany(p)],
  [/^\/produkt\/(.+)$/, (p, m) => produkt(Object.assign({ id: m[1] }, p))],
  [/^\/dokument\/nowy\/(\w+)$/, (p, m) => dokument({ id: 'nowy', typ: m[1] })],
  [/^\/dokument\/(.+)$/, (p, m) => dokument({ id: m[1] })],
  [/^\/sprzet$/, p => sprzetLista(p)],
  [/^\/sprzet\/(.+)$/, (p, m) => sprzet(Object.assign({ id: m[1] }, p))],
  [/^\/lokalizacje$/, p => lokalizacje(p)],
  [/^\/lokalizacja\/(.+)$/, (p, m) => lokalizacja(Object.assign({ id: m[1] }, p))],
  [/^\/spis$/, p => spis(p)],
  [/^\/skanuj$/, () => skanuj()],
  [/^\/import$/, () => importuj()],
  [/^\/notatki$/, () => notatki()],
  [/^\/przenoszenie$/, () => przenoszenie()],
  [/^\/zgloszenia$/, () => zgloszenia()],
  [/^\/przekazania$/, () => przekazania()],
  [/^\/przekazanie\/nowe$/, p => przekazanieNowe(p)],
  [/^\/przekazanie\/(.+)$/, (p, m) => przekazanie({ id: m[1] })],
  [/^\/zamowienia$/, () => partie()],
  [/^\/zamowienia\/import$/, () => zamImport()],
  [/^\/partia\/(.+)$/, (p, m) => partia({ id: m[1] })],
  [/^\/zamowienie\/(.+)$/, (p, m) => zamowienie({ id: m[1] })],
  [/^\/eksport$/, () => eksport()],
  [/^\/ustawienia$/, () => ustawienia()],
  [/^\/opis$/, () => opis()],
  [/^\/testy$/, () => testy()],
  [/^\/wiecej$/, () => wiecej()]
];

const TAB_TRASY = { pulpit: 'pulpit', stany: 'magazyn', produkt: 'magazyn',
  dokument: 'magazyn', sprzet: 'sprzet', wiecej: 'wiecej',
  zamowienia: 'zam', partia: 'zam', zamowienie: 'zam',
  przekazania: 'sprzet', przekazanie: 'sprzet',
  przenoszenie: 'sprzet', zgloszenia: 'sprzet', notatki: 'pulpit' };

function rozbij() {
  const raw = location.hash.replace(/^#/, '') || '/pulpit';
  const [sciezka, qs] = raw.split('?');
  const param = {};
  new URLSearchParams(qs || '').forEach((v, k) => { param[k] = v; });
  return { sciezka, param };
}

let ostatniaSciezka = '';

function rysuj() {
  const { sciezka, param } = rozbij();
  let ekran = null;
  for (const [re, fn] of TRASY) {
    const m = sciezka.match(re);
    if (m) { ekran = fn(param, m); break; }
  }
  if (!ekran) ekran = { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiego ekranu.') };

  $('#tytul').textContent = ekran.tytul || 'Magazyn';
  $('#wstecz').hidden = !ekran.wstecz;
  $('#akcja').hidden = !ekran.akcja;
  if (ekran.akcja) {
    $('#akcja').textContent = ekran.akcja.tekst;
    $('#akcja').onclick = ekran.akcja.fn;
  }

  widok().innerHTML = ekran.html || '';
  if (sciezka !== ostatniaSciezka) { widok().scrollTop = 0; scrollTo(0, 0); }
  ostatniaSciezka = sciezka;

  const tab = ekran.tab || TAB_TRASY[sciezka.split('/')[1]] || '';
  document.querySelectorAll('#dol a').forEach(a =>
    a.classList.toggle('akt', a.dataset.tab === tab));

  if (ekran.po) ekran.po();
}

function odswiez() { rysuj(); }

global.UI = { rysuj, odswiez, toast, modal, zamknijModal, potwierdz, h };

})(window);

</script>
<script>
/* ===== js/app.js ===== */
/* ------------------------------------------------------------------
   app.js — uruchomienie aplikacji i obsługa aktualizacji.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

/* Numer wersji — podbijany przy każdym wydaniu.
   Widać go w Ustawieniach, dzięki czemu da się sprawdzić,
   czy podmiana pliku na hostingu faktycznie doszła do telefonu. */
const WERSJA = '17';
const DATA_WERSJI = '2026-08-18';
global.WERSJA_APP = WERSJA + ' (' + DATA_WERSJI + ')';

function blad(tekst, szczegol) {
  document.getElementById('widok').innerHTML =
    '<div class="alert zle"><div><b>' + tekst + '</b>' +
    (szczegol ? String(szczegol).replace(/[<>]/g, '') : '') + '</div></div>' +
    '<div class="karta"><h2>Co można zrobić</h2><p>' +
    'Najczęstsza przyczyna to tryb incognito albo zablokowany zapis danych stron. ' +
    'Otwórz aplikację w zwykłym oknie przeglądarki i sprawdź, czy w ustawieniach ' +
    'witryny nie są zablokowane pliki cookie i dane.</p></div>';
}

/* ---------- pasek „jest nowa wersja” ---------- */
function pokazPasekAktualizacji(nowaWersja) {
  if (document.getElementById('pasek-akt')) return;
  const d = document.createElement('div');
  d.id = 'pasek-akt';
  d.innerHTML = '<span>Jest wersja ' + String(nowaWersja).replace(/[<>]/g, '') + '.</span>' +
                '<button type="button">Odśwież teraz</button>';
  document.body.appendChild(d);
  d.querySelector('button').onclick = () => location.reload();
}

/* Wersję sprawdzamy sami, pobierając index.html z pominięciem pamięci podręcznej
   i czytając znacznik <meta name="wersja">. Dzięki temu service worker może być
   stały — nie trzeba go podmieniać przy każdym wydaniu. */
async function pobierzWersjeZSerwera() {
  const odp = await fetch('./index.html?w=' + Date.now(), { cache: 'no-store' });
  if (!odp.ok) throw new Error('HTTP ' + odp.status);
  const tekst = await odp.text();
  const m = tekst.match(/<meta\s+name="wersja"\s+content="([^"]*)"/i);
  return m ? m[1] : null;
}

async function sprawdzWersje(pokazuj) {
  try {
    const zdalna = await pobierzWersjeZSerwera();
    if (zdalna && zdalna !== WERSJA) {
      if (pokazuj !== false) pokazPasekAktualizacji(zdalna);
      return zdalna;
    }
  } catch (e) { /* brak sieci — trudno, sprawdzimy następnym razem */ }
  return null;
}

async function obsluzServiceWorker() {
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('sw.js'); }
    catch (e) { /* brak pracy offline, ale aplikacja działa */ }
  }

  sprawdzWersje();
  setInterval(() => sprawdzWersje(), 60 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) sprawdzWersje();
  });
  global.sprawdzAktualizacje = async () => !!(await sprawdzWersje());
}

async function start() {
  try {
    await DB.start();
  } catch (e) {
    blad('Nie udało się otworzyć bazy danych', e.message);
    return;
  }

  UI.rysuj();
  addEventListener('hashchange', UI.rysuj);

  document.getElementById('wstecz').onclick = () => history.back();

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const m = document.getElementById('modal');
    if (!m.hidden) UI.zamknijModal();
    else Skaner.zamknij();
  });

  /* silnik skanera przygotowujemy w tle, żeby pierwsze użycie było natychmiastowe */
  Skaner.przygotuj().catch(() => {});

  obsluzServiceWorker();

  /* ostrzeżenie przy wychodzeniu z niezapisanego dokumentu */
  addEventListener('beforeunload', e => {
    if (location.hash.includes('/dokument/nowy')) { e.preventDefault(); e.returnValue = ''; }
  });
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', start);
else start();

})(window);

</script>
</body>
