<script>
/* ===== js/zamowienia.js ===== */
/* ------------------------------------------------------------------
   zamowienia.js — kompletacja zamówień wczytanych z arkusza.

   Układ pliku: jedno zamówienie w wierszu, artykuły w kolumnach,
   w komórkach ilości. Kolumny opisowe (miasto, ulica, punkt, kierowca,
   uwagi) wskazuje się raz — aplikacja zapamiętuje układ dla plików
   o takich samych nagłówkach.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

const ROLE = [
  { k: 'artykul',  n: 'Artykuł (ilość)' },
  { k: 'nr',       n: 'Numer zamówienia', hasla: ['nr zamowienia', 'numer zamowienia', 'zamowienie', 'nr zam', 'id', 'lp', 'numer'] },
  { k: 'miasto',   n: 'Miasto',          hasla: ['miasto', 'miejscowosc', 'lokalizacja', 'city'] },
  { k: 'ulica',    n: 'Ulica',           hasla: ['ulica', 'adres', 'ul', 'street'] },
  { k: 'punkt',    n: 'Punkt',           hasla: ['punkt', 'sklep', 'placowka', 'oddzial', 'filia', 'odbiorca', 'klient'] },
  { k: 'kierowca', n: 'Kierowca',        hasla: ['kierowca', 'trasa', 'kurier', 'driver', 'auto', 'samochod'] },
  { k: 'info',     n: 'Informacja (tekst)', hasla: ['uwagi', 'notatka', 'komentarz', 'opis', 'info', 'telefon', 'godziny', 'kontakt', 'osoba'] },
  { k: 'pomin',    n: 'Pomiń kolumnę' }
];

const uprosc = s => Importer.uprosc(s);

/* ---------- rozpoznanie ról kolumn ---------- */
function zgadnijRole(naglowki) {
  const role = {};
  const zajete = new Set();
  for (const r of ROLE) {
    if (!r.hasla) continue;
    const wiele = r.k === 'info';          // informacji może być kilka
    naglowki.forEach((nag, i) => {
      if (zajete.has(i)) return;
      if (role[i]) return;
      const u = uprosc(nag);
      if (!u) return;
      const trafia = r.hasla.some(h => {
        const hu = uprosc(h);
        return u === hu || u.startsWith(hu + ' ') || u.endsWith(' ' + hu) ||
               (hu.length >= 5 && u.includes(hu));
      });
      if (!trafia) return;
      role[i] = r.k;
      if (!wiele) zajete.add(i);
    });
  }
  naglowki.forEach((nag, i) => {
    if (role[i]) return;
    role[i] = uprosc(nag) ? 'artykul' : 'pomin';
  });
  return role;
}

/* podpis układu — pozwala zapamiętać ustawienia dla powtarzalnego pliku */
function sygnatura(naglowki) {
  return naglowki.map(uprosc).join('|').slice(0, 400);
}
function zapamietanyUklad(naglowki) {
  const u = (DB.D.ust.ukladyZam || {})[sygnatura(naglowki)];
  return u ? u.role : null;
}
async function zapamietajUklad(naglowki, role) {
  const wszystkie = Object.assign({}, DB.D.ust.ukladyZam || {});
  wszystkie[sygnatura(naglowki)] = { role, kiedy: DB.teraz() };
  const klucze = Object.keys(wszystkie);
  if (klucze.length > 12) delete wszystkie[klucze[0]];
  await DB.ustaw('ukladyZam', wszystkie);
}

/* ---------- punkty z listy własnej ----------
   W plikach zamówień miasta bywają pisane różnie („Warszawa", „warszawa",
   „W-wa") i przez to powielają się w filtrach. Dlatego wyznacznikiem wiersza
   jest punkt: jeśli pasuje do punktu z listy w aplikacji, miasto, ulicę
   i kierowcę bierzemy z definicji punktu, a nie z arkusza. */
function indeksPunktow() {
  const m = new Map();
  const dodaj = (k, l) => { const u = uprosc(k); if (u && !m.has(u)) m.set(u, l); };
  DB.lokalizacje().forEach(l => { dodaj(l.kod, l); dodaj(l.nazwa, l); });
  return m;
}

function dopasujPunkt(z, idx) {
  const l = idx.get(uprosc(z.punkt)) || (z.punkt ? null : idx.get(uprosc(z.miasto)));
  if (!l) return null;
  z.punktId = l.id;
  z.punkt = l.nazwa || l.kod || z.punkt;
  if (l.miasto) z.miasto = l.miasto;
  if (l.ulica) z.ulica = l.ulica;
  if (l.kierowca) z.kierowca = l.kierowca;
  return l;
}

/* ---------- budowa zamówień z arkusza ---------- */
function przygotuj(wiersze, wierszNagl, role) {
  const naglowki = (wiersze[wierszNagl] || []).map(x => String(x || '').trim());
  const kolArt  = [];
  const kolInfo = [];
  const kolRola = {};
  naglowki.forEach((n, i) => {
    const r = role[i] || 'pomin';
    if (r === 'artykul') kolArt.push({ kol: i, nazwa: n || ('kolumna ' + (i + 1)) });
    else if (r === 'info') kolInfo.push({ kol: i, nazwa: n || ('kolumna ' + (i + 1)) });
    else if (r !== 'pomin') kolRola[r] = i;
  });

  const zam = [];
  const puste = [];
  const idxPunkt = indeksPunktow();
  const obce = new Map();          // punkty z pliku, których nie ma na liście
  let dopasowanych = 0;
  for (let w = wierszNagl + 1; w < wiersze.length; w++) {
    const r = wiersze[w] || [];
    if (!r.some(c => String(c || '').trim() !== '')) continue;

    const pozycje = [];
    for (const a of kolArt) {
      const il = Importer.naLiczbe(r[a.kol]);
      if (il == null || il === 0) continue;
      pozycje.push({ kol: a.kol, nazwa: a.nazwa, ilosc: il, ok: false });
    }
    const z = {
      lp: zam.length + 1,
      nr: String(r[kolRola.nr] != null ? r[kolRola.nr] : '').trim() || String(zam.length + 1),
      miasto:   String(r[kolRola.miasto]   != null ? r[kolRola.miasto]   : '').trim(),
      ulica:    String(r[kolRola.ulica]    != null ? r[kolRola.ulica]    : '').trim(),
      punkt:    String(r[kolRola.punkt]    != null ? r[kolRola.punkt]    : '').trim(),
      kierowca: String(r[kolRola.kierowca] != null ? r[kolRola.kierowca] : '').trim(),
      info: kolInfo.map(c => ({ n: c.nazwa, v: String(r[c.kol] == null ? '' : r[c.kol]).trim() }))
                   .filter(x => x.v),
      pozycje,
      status: 'nowe'
    };
    if (dopasujPunkt(z, idxPunkt)) dopasowanych++;
    else {
      const nazwa = z.punkt || z.miasto;
      if (nazwa) obce.set(nazwa, (obce.get(nazwa) || 0) + 1);
    }
    if (!pozycje.length) puste.push(z.nr);
    zam.push(z);
  }
  return { zamowienia: zam, artykuly: kolArt, informacje: kolInfo, naglowki,
           bezPozycji: puste, dopasowanych,
           obcePunkty: [...obce.entries()].map(([nazwa, ile]) => ({ nazwa, ile }))
                        .sort((a, b) => b.ile - a.ile) };
}

/* ---------- dopasowanie artykułów do katalogu ---------- */
function dopasujArtykuly(artykuly) {
  return artykuly.map(a => {
    const u = uprosc(a.nazwa);
    const p = DB.produkty().find(x => uprosc(x.nazwa) === u) ||
              DB.produkty().find(x => x.ean && x.ean === a.nazwa);
    return Object.assign({}, a, { produktId: p ? p.id : null, produkt: p || null });
  });
}

/* ---------- zapis partii ---------- */
async function zapiszPartie(dane, opcje) {
  opcje = opcje || {};
  const artykuly = dopasujArtykuly(dane.artykuly);

  /* brakujące artykuły dopisujemy do katalogu, żeby stan mógł się zdejmować */
  if (opcje.tworzProdukty) {
    for (const a of artykuly) {
      if (a.produktId) continue;
      const p = await DB.zapisz('produkty', { nazwa: a.nazwa, jm: 'szt' }, false);
      a.produktId = p.id;
    }
  }
  const mapaKol = new Map(artykuly.map(a => [a.kol, a.produktId]));

  const partia = await DB.zapisz('partie', {
    nazwa: opcje.nazwa || ('Partia z ' + new Date().toLocaleDateString('pl-PL')),
    plik: opcje.plik || '',
    data: new Date().toISOString().slice(0, 10),
    naglowki: dane.naglowki,
    artykuly: artykuly.map(a => ({ kol: a.kol, nazwa: a.nazwa, produktId: a.produktId })),
    informacje: dane.informacje,
    zdejmujStan: opcje.zdejmujStan !== false,
    ileZamowien: dane.zamowienia.length
  }, false);

  dane.zamowienia.forEach(z => {
    z.partiaId = partia.id;
    z.pozycje = z.pozycje.map(p => Object.assign({}, p, { produktId: mapaKol.get(p.kol) || null }));
  });
  await DB.zapiszWiele('zamowienia', dane.zamowienia);
  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + dane.zamowienia.length);
  return partia;
}

/* ---------- status ---------- */
function przeliczStatus(z) {
  const n = z.pozycje.length;
  const ok = z.pozycje.filter(p => p.ok).length;
  z.status = n === 0 ? 'puste' : ok === 0 ? 'nowe' : ok < n ? 'czesciowo' : 'gotowe';
  return z.status;
}
const ETYKIETY_STATUSU = { nowe: 'nowe', czesciowo: 'w toku', gotowe: 'gotowe', puste: 'bez pozycji' };

/* ---------- kontrola stanu ----------
   Odhaczona pozycja w zamówieniu, które nie jest jeszcze gotowe, to rezerwacja:
   towar jest już przypisany, ale dokument wydania powstanie dopiero przy
   zamknięciu zamówienia. Dostępne = stan magazynowy minus rezerwacje. */
function rezerwacje() {
  const m = new Map();
  for (const z of DB.zamowienia()) {
    if (z.status === 'gotowe') continue;      // te mają już swój dokument w stanach
    const p = partiaZam(z);
    if (p && p.zdejmujStan === false) continue;
    for (const poz of z.pozycje)
      if (poz.ok && poz.produktId)
        m.set(poz.produktId, (m.get(poz.produktId) || 0) + poz.ilosc);
  }
  return m;
}

function dostepne() {
  const s = DB.stany(), r = rezerwacje(), m = new Map();
  for (const id of new Set([...s.keys(), ...r.keys()]))
    m.set(id, (s.get(id) || 0) - (r.get(id) || 0));
  return m;
}

const nazwaProduktu = id => {
  const p = DB.D.produkty.find(x => x.id === id);
  return p ? p.nazwa : '(nieznany)';
};

/* Licznik braków. Pobiera pozycje z mapy dostępności; gdy czegoś nie starcza,
   i tak schodzi poniżej zera — dzięki temu niedobory z wielu zamówień sumują się
   i „przyjmij brakujące” dopisuje tyle, żeby starczyło na wszystko naraz. */
function licznikBrakow(dost) {
  const start = new Map(dost);
  const zabl = new Map();
  return {
    wez(p) {
      if (!p.produktId) return true;          // spoza katalogu — bez kontroli stanu
      const masz = dost.get(p.produktId) || 0;
      dost.set(p.produktId, masz - p.ilosc);
      if (masz >= p.ilosc) return true;
      const b = zabl.get(p.produktId) || { potrzeba: 0 };
      b.potrzeba += p.ilosc;
      zabl.set(p.produktId, b);
      return false;
    },
    braki() {
      return [...zabl.entries()].map(([id, b]) => ({
        produktId: id, nazwa: nazwaProduktu(id), potrzeba: b.potrzeba,
        masz: Math.max(0, start.get(id) || 0),
        brakuje: Math.max(0, -(dost.get(id) || 0))
      })).filter(b => b.brakuje > 0);
    }
  };
}

/* wygodny skrót dla pojedynczego dokumentu */
function zabraknie(pozycje, dost) {
  const l = licznikBrakow(dost);
  pozycje.forEach(p => l.wez(p));
  return l.braki();
}

/* jeden dokument przyjęcia uzupełniający wszystkie braki naraz */
async function przyjmijBrakujace(braki, opis) {
  const scalone = new Map();
  braki.forEach(b => scalone.set(b.produktId,
    Math.max(scalone.get(b.produktId) || 0, b.brakuje)));
  const pozycje = [...scalone.entries()].map(([produktId, ilosc]) => ({ produktId, ilosc }));
  if (!pozycje.length) return null;
  return DB.zapisz('dokumenty', {
    typ: 'PZ', numer: DB.nastepnyNumer('PZ'),
    data: new Date().toISOString().slice(0, 10),
    dostawca: '', nrFaktury: '',
    uwagi: opis || 'uzupełnienie stanu przed wydaniem',
    pozycje
  }, false);
}

/* ---------- odhaczanie ---------- */
function kontrolaWlaczona(z) {
  const p = partiaZam(z);
  return !(p && p.zdejmujStan === false);
}

async function przelacz(z, indeks) {
  const p = z.pozycje[indeks];
  if (!p) return { ok: false };
  if (!p.ok && kontrolaWlaczona(z)) {
    const braki = zabraknie([p], dostepne());
    if (braki.length) return { ok: false, braki };
  }
  p.ok = !p.ok;
  p.kiedy = p.ok ? DB.teraz() : null;
  await pozmianie(z);
  return { ok: true };
}

/* Odhacza to, co się mieści w stanie, i zwraca listę pozycji, których zabrakło. */
async function odhaczWszystko(z, wartosc) {
  const w = wartosc !== false;
  if (!w) {
    z.pozycje.forEach(p => { p.ok = false; p.kiedy = null; });
    await pozmianie(z);
    return { ok: true, braki: [] };
  }
  const kontrola = kontrolaWlaczona(z);
  const licznik = licznikBrakow(dostepne());
  for (const p of z.pozycje) {
    if (p.ok) continue;
    if (kontrola && !licznik.wez(p)) continue;
    p.ok = true;
    p.kiedy = DB.teraz();
  }
  await pozmianie(z);
  const braki = kontrola ? licznik.braki() : [];
  return { ok: !braki.length, braki };
}

async function pozmianie(z) {
  przeliczStatus(z);
  /* dokument wydania istnieje dokładnie wtedy, gdy zamówienie jest gotowe */
  if (z.status === 'gotowe') await utworzWydanie(z);
  else await cofnijWydanie(z);
  z.kto = DB.D.ust.osoba || '';
  z.kiedy = DB.teraz();
  await DB.zapisz('zamowienia', z, false);
  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + 1);
}

/* ---------- powiązanie z magazynem ---------- */
function partiaZam(z) { return DB.D.partie.find(p => p.id === z.partiaId); }

/* Buduje dokument wydania, ale go nie zapisuje — dzięki temu przy odhaczaniu
   zbiorczym wszystkie dokumenty lecą do bazy w jednej transakcji.
   `numerator` pozwala nadać kolejne numery bez ponownego skanowania bazy. */
function budujWydanie(z, numerator) {
  if (z.dokumentId) return null;
  const partia = partiaZam(z);
  if (partia && partia.zdejmujStan === false) return null;
  const pozycje = z.pozycje
    .filter(p => p.ok && p.produktId)
    .map(p => ({ produktId: p.produktId, ilosc: p.ilosc }));
  if (!pozycje.length) return null;
  const d = {
    id: DB.uuid(), utw: DB.teraz(),
    typ: 'RW',
    numer: numerator ? numerator() : DB.nastepnyNumer('RW'),
    data: new Date().toISOString().slice(0, 10),
    lokalizacjaId: z.punktId || null,
    odbiorca: [z.miasto, z.punkt].filter(Boolean).join(' / ') || ('zamówienie ' + z.nr),
    osoba: z.kierowca || DB.D.ust.osoba || '',
    uwagi: 'zamówienie ' + z.nr + (partia ? ' · ' + partia.nazwa : ''),
    zamowienieId: z.id,
    pozycje
  };
  z.dokumentId = d.id;
  return d;
}

/* kolejne numery RW bez odpytywania bazy przy każdym dokumencie */
function numeratorRW() {
  const wzor = DB.nastepnyNumer('RW');
  const m = wzor.match(/^(.*\/)(\d+)$/);
  const pas = m ? m[1] : wzor;
  let n = m ? parseInt(m[2], 10) : 1;
  const dl = m ? m[2].length : 4;
  return () => pas + String(n++).padStart(dl, '0');
}

async function utworzWydanie(z) {
  const d = budujWydanie(z, null);
  if (d) await DB.zapisz('dokumenty', d, false);
}

async function cofnijWydanie(z) {
  if (!z.dokumentId) return;
  await DB.usun('dokumenty', z.dokumentId);
  z.dokumentId = null;
}

/* ---------- odhaczanie zbiorcze ---------- */
async function odhaczWiele(lista, wartosc) {
  const w = wartosc !== false;
  const numer = numeratorRW();
  const noweDok = [];
  const doKasacji = [];
  const licznik = licznikBrakow(dostepne());
  let pominiete = 0;

  for (const z of lista) {
    if (!w) {
      z.pozycje.forEach(p => { p.ok = false; p.kiedy = null; });
    } else {
      const kontrola = kontrolaWlaczona(z);
      let cos = false;
      for (const p of z.pozycje) {
        if (p.ok) continue;
        if (kontrola && !licznik.wez(p)) continue;
        p.ok = true; p.kiedy = DB.teraz(); cos = true;
      }
      if (!cos && z.pozycje.some(p => !p.ok)) pominiete++;
    }
    przeliczStatus(z);
    if (z.status === 'gotowe') {
      const d = budujWydanie(z, numer);
      if (d) noweDok.push(d);
    } else if (z.dokumentId) {
      const stary = DB.D.dokumenty.find(x => x.id === z.dokumentId);
      if (stary) { stary.usuniety = true; stary.zm = DB.teraz(); doKasacji.push(stary); }
      z.dokumentId = null;
    }
    z.kto = DB.D.ust.osoba || '';
    z.kiedy = DB.teraz();
  }

  if (noweDok.length) await DB.zapiszWiele('dokumenty', noweDok);
  if (doKasacji.length) await DB.zapiszWiele('dokumenty', doKasacji);
  await DB.zapiszWiele('zamowienia', lista);
  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + lista.length);
  return { zamowien: lista.length, dokumentow: noweDok.length,
           cofnietych: doKasacji.length, braki: w ? licznik.braki() : [], pominiete };
}

/* ---------- filtrowanie ---------- */
function zamowieniaPartii(partiaId) {
  return DB.zamowienia().filter(z => z.partiaId === partiaId)
    .sort((a, b) => (a.lp || 0) - (b.lp || 0));
}

function wartosciFiltra(lista, pole) {
  const s = new Set();
  lista.forEach(z => { if (z[pole]) s.add(z[pole]); });
  return [...s].sort((a, b) => a.localeCompare(b, 'pl'));
}

function filtruj(lista, f) {
  return lista.filter(z =>
    (!f.kierowca || z.kierowca === f.kierowca) &&
    (!f.miasto || z.miasto === f.miasto) &&
    (!f.status || z.status === f.status ||
      (f.status === 'niegotowe' && z.status !== 'gotowe')) &&
    (!f.szukaj || [z.nr, z.miasto, z.ulica, z.punkt, z.kierowca]
      .some(x => Importer.uprosc(x).includes(Importer.uprosc(f.szukaj)))));
}

function podsumowanie(lista) {
  const s = { zamowien: lista.length, gotowe: 0, pozycji: 0, odhaczone: 0, sztuk: 0, sztukOk: 0 };
  lista.forEach(z => {
    if (z.status === 'gotowe') s.gotowe++;
    z.pozycje.forEach(p => {
      s.pozycji++; s.sztuk += p.ilosc;
      if (p.ok) { s.odhaczone++; s.sztukOk += p.ilosc; }
    });
  });
  return s;
}

/* ---------- eksport ---------- */
function arkusze(partia, lista) {
  const art = partia.artykuly || [];
  const info = partia.informacje || [];

  /* 1. układ jak w pliku wejściowym — odhaczone komórki na zielono */
  const kolumny = [
    { n: 'Nr zamówienia', t: 'txt', w: 15 }, { n: 'Miasto', t: 'txt', w: 18 },
    { n: 'Ulica', t: 'txt', w: 24 }, { n: 'Punkt', t: 'txt', w: 22 },
    { n: 'Kierowca', t: 'txt', w: 16 }, { n: 'Status', t: 'txt', w: 12 },
    { n: 'Odhaczono', t: 'txt', w: 12 }, { n: 'Kto', t: 'txt', w: 16 },
    { n: 'Kiedy', t: 'czas', w: 17 },
    ...info.map(i => ({ n: i.nazwa, t: 'txt', w: 22 })),
    ...art.map(a => ({ n: a.nazwa, t: 'int', w: 12 }))
  ];
  const stalych = 9 + info.length;

  const wiersze = lista.map(z => {
    const mapa = new Map(z.pozycje.map(p => [p.kol, p]));
    return [
      z.nr, z.miasto, z.ulica, z.punkt, z.kierowca,
      ETYKIETY_STATUSU[z.status] || z.status,
      z.pozycje.filter(p => p.ok).length + ' / ' + z.pozycje.length,
      z.kto || '', z.kiedy ? new Date(z.kiedy) : null,
      ...info.map(i => (z.info.find(x => x.n === i.nazwa) || {}).v || ''),
      ...art.map(a => { const p = mapa.get(a.kol); return p ? p.ilosc : null; })
    ];
  });

  const szerokie = {
    nazwa: 'Zamówienia',
    kolumny, wiersze,
    podswietl: (w, i) => lista[i] && lista[i].status !== 'gotowe',
    zielone: (w, ri, ci) => {
      if (ci < stalych) return false;
      const z = lista[ri];
      if (!z) return false;
      const a = art[ci - stalych];
      if (!a) return false;
      const p = z.pozycje.find(x => x.kol === a.kol);
      return !!(p && p.ok);
    },
    sumy: art.map((_, i) => stalych + i)
  };

  /* 2. płaska lista pozycji */
  const pozycje = [];
  lista.forEach(z => z.pozycje.forEach(p => pozycje.push([
    z.nr, z.miasto, z.ulica, z.punkt, z.kierowca, p.nazwa, p.ilosc,
    p.ok ? 'TAK' : 'nie', p.kiedy ? new Date(p.kiedy) : null, z.kto || ''
  ])));
  const plaska = {
    nazwa: 'Pozycje',
    kolumny: [
      { n: 'Nr zamówienia', t: 'txt', w: 15 }, { n: 'Miasto', t: 'txt', w: 18 },
      { n: 'Ulica', t: 'txt', w: 24 }, { n: 'Punkt', t: 'txt', w: 22 },
      { n: 'Kierowca', t: 'txt', w: 16 }, { n: 'Artykuł', t: 'txt', w: 30 },
      { n: 'Ilość', t: 'int', w: 9 }, { n: 'Wydane', t: 'txt', w: 10 },
      { n: 'Kiedy', t: 'czas', w: 17 }, { n: 'Kto', t: 'txt', w: 16 }
    ],
    wiersze: pozycje,
    podswietl: w => w[7] !== 'TAK',
    zielone: (w, ri, ci) => ci === 7 && w[7] === 'TAK',
    sumy: [6]
  };

  /* 3. podsumowanie wg kierowców i miast */
  const grupy = new Map();
  lista.forEach(z => {
    const kier = z.kierowca || '(bez kierowcy)';
    const miasto = z.miasto || '(bez miasta)';
    const k = kier + ' \u2022 ' + miasto;
    if (!grupy.has(k)) grupy.set(k, { kier, miasto, zam: 0, gotowe: 0,
                                      sztuk: 0, sztukOk: 0, punkty: new Set() });
    const g = grupy.get(k);
    g.zam++;
    if (z.status === 'gotowe') g.gotowe++;
    if (z.punkt) g.punkty.add(z.punkt);
    z.pozycje.forEach(p => { g.sztuk += p.ilosc; if (p.ok) g.sztukOk += p.ilosc; });
  });
  const zbiorcze = {
    nazwa: 'Wg kierowców',
    kolumny: [
      { n: 'Kierowca', t: 'txt', w: 20 }, { n: 'Miasto', t: 'txt', w: 20 },
      { n: 'Punktów', t: 'int', w: 10 }, { n: 'Zamówień', t: 'int', w: 11 },
      { n: 'Gotowych', t: 'int', w: 11 }, { n: 'Sztuk', t: 'int', w: 10 },
      { n: 'Sztuk wydanych', t: 'int', w: 14 }
    ],
    wiersze: [...grupy.values()]
      .map(g => [g.kier, g.miasto, g.punkty.size, g.zam, g.gotowe, g.sztuk, g.sztukOk])
      .sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'pl') ||
                      String(a[1]).localeCompare(String(b[1]), 'pl')),
    podswietl: w => w[4] < w[3],
    sumy: [2, 3, 4, 5, 6]
  };

  /* 4. zbiorczo ile czego wydać */
  const wgArt = new Map();
  lista.forEach(z => z.pozycje.forEach(p => {
    if (!wgArt.has(p.nazwa)) wgArt.set(p.nazwa, { szt: 0, ok: 0, zam: 0 });
    const a = wgArt.get(p.nazwa);
    a.szt += p.ilosc; a.zam++;
    if (p.ok) a.ok += p.ilosc;
  }));
  const wgArtykulow = {
    nazwa: 'Wg artykułów',
    kolumny: [
      { n: 'Artykuł', t: 'txt', w: 34 }, { n: 'Zamówień', t: 'int', w: 11 },
      { n: 'Sztuk łącznie', t: 'int', w: 13 }, { n: 'Sztuk wydanych', t: 'int', w: 14 },
      { n: 'Zostało', t: 'int', w: 11 }
    ],
    wiersze: [...wgArt.entries()]
      .map(([n, a]) => [n, a.zam, a.szt, a.ok, a.szt - a.ok])
      .sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'pl')),
    podswietl: w => w[4] > 0,
    sumy: [1, 2, 3, 4]
  };

  return [szerokie, plaska, zbiorcze, wgArtykulow];
}

global.Zam = {
  ROLE, zgadnijRole, zapamietanyUklad, zapamietajUklad, przygotuj, dopasujArtykuly,
  indeksPunktow, dopasujPunkt,
  zapiszPartie, przeliczStatus, ETYKIETY_STATUSU, przelacz, odhaczWszystko, pozmianie,
  zamowieniaPartii, wartosciFiltra, filtruj, podsumowanie, arkusze, partiaZam,
  utworzWydanie, cofnijWydanie, odhaczWiele, budujWydanie, numeratorRW,
  rezerwacje, dostepne, zabraknie, licznikBrakow, przyjmijBrakujace, nazwaProduktu
};

<script>
/* ===== js/przekazania.js ===== */
/* ------------------------------------------------------------------
   przekazania.js — wydawanie środków trwałych na punkty
   i wysyłka potwierdzenia mailem.

   Edge na Androidzie nie pozwala załączyć pliku do maila prosto ze strony,
   ale odnośnik mailto: działa bez przeszkód. Potwierdzenie idzie więc
   jako gotowa treść maila, a nie jako załącznik.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

/* ---------- numeracja ---------- */
function nastepnyNumer() {
  const rok = new Date().getFullYear();
  const pas = 'PRZ/' + rok + '/';
  let max = 0;
  for (const p of DB.D.przekazania) {
    if (!p.nr || !p.nr.startsWith(pas)) continue;
    const n = parseInt(p.nr.slice(pas.length), 10);
    if (n > max) max = n;
  }
  return pas + String(max + 1).padStart(4, '0');
}

/* ---------- zapis ---------- */
async function zapisz(dane) {
  const p = await DB.zapisz('przekazania', {
    nr: dane.nr || nastepnyNumer(),
    data: dane.data || new Date().toISOString().slice(0, 10),
    lokalizacjaId: dane.lokalizacjaId,
    osoba: dane.osoba || '',
    email: dane.email || '',
    kto: dane.kto || DB.D.ust.osoba || '',
    uwagi: dane.uwagi || '',
    pozycje: dane.pozycje.slice(),
    demo: !!dane.demo
  }, false);

  for (const sprzetId of p.pozycje)
    await DB.przenies(sprzetId, p.lokalizacjaId, p.kto, 'przekazanie ' + p.nr);

  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + 1);
  return p;
}

const sprzetyPrzekazania = p =>
  (p.pozycje || []).map(id => DB.D.sprzet.find(s => s.id === id)).filter(Boolean);

/* ---------- treść potwierdzenia ---------- */
function opisSprzetu(s) {
  const dod = [s.producent, s.model].filter(Boolean).join(' ');
  return (s.nrInw || '?') + ' — ' + (s.nazwa || '') +
         (dod ? ' (' + dod + ')' : '') +
         (s.nrSer ? ', nr ser. ' + s.nrSer : '');
}

function trescMaila(p) {
  const lok = Eksport.nazwaLok(p.lokalizacjaId) || '—';
  const lista = sprzetyPrzekazania(p);
  const L = [];
  L.push('POTWIERDZENIE PRZEKAZANIA ' + p.nr);
  L.push('');
  L.push('Data: ' + new Date(p.data).toLocaleDateString('pl-PL'));
  L.push('Punkt: ' + lok);
  if (p.osoba) L.push('Odbierający: ' + p.osoba);
  if (p.kto) L.push('Przekazał: ' + p.kto);
  L.push('');
  L.push('Przekazane środki (' + lista.length + '):');
  lista.forEach((s, i) => L.push((i + 1) + '. ' + opisSprzetu(s) + ' — 1 szt.'));
  if (p.uwagi) { L.push(''); L.push('Uwagi: ' + p.uwagi); }
  L.push('');
  L.push('--');
  L.push(DB.D.ust.firma || 'Ewidencja wyposażenia');
  return L.join('\n');
}

/* potwierdzenie wydania materiałów (dokument RW) */
function trescMailaRW(d) {
  const lok = Eksport.nazwaLok(d.lokalizacjaId) || d.odbiorca || '—';
  const L = [];
  L.push('POTWIERDZENIE WYDANIA ' + (d.numer || ''));
  L.push('');
  L.push('Data: ' + new Date(d.data).toLocaleDateString('pl-PL'));
  L.push('Punkt: ' + lok);
  if (d.osoba) L.push('Odbierający: ' + d.osoba);
  if (DB.D.ust.osoba) L.push('Wydał: ' + DB.D.ust.osoba);
  L.push('');
  L.push('Wydane pozycje (' + (d.pozycje || []).length + '):');
  (d.pozycje || []).forEach((poz, i) => {
    const pr = DB.D.produkty.find(x => x.id === poz.produktId) || {};
    L.push((i + 1) + '. ' + (pr.nazwa || '(pozycja usunięta)') +
           ' — ' + poz.ilosc + ' ' + (pr.jm || 'szt'));
  });
  if (d.uwagi) { L.push(''); L.push('Uwagi: ' + d.uwagi); }
  L.push('');
  L.push('--');
  L.push(DB.D.ust.firma || 'Magazyn');
  return L.join('\n');
}

/* ---------- wysyłka ----------
   Systemowe okno maila ma ograniczoną długość adresu, więc bardzo długie
   listy skracamy i dopisujemy, gdzie szukać pełnej. */
const LIMIT_TRESCI = 1600;

function przytnij(tresc) {
  if (tresc.length <= LIMIT_TRESCI) return { tresc, skrocone: false };
  const ciete = tresc.slice(0, LIMIT_TRESCI).split('\n').slice(0, -1).join('\n');
  return {
    tresc: ciete + '\n…\n\n(lista skrócona — pełne zestawienie w wydruku PDF)',
    skrocone: true
  };
}

function adresMailto(adres, temat, tresc) {
  return 'mailto:' + encodeURIComponent(adres || '') +
         '?subject=' + encodeURIComponent(temat) +
         '&body=' + encodeURIComponent(tresc);
}

function wyslij(adres, temat, tresc) {
  const p = przytnij(tresc);
  global.location.href = adresMailto(adres, temat, p.tresc);
  return p.skrocone;
}

async function doSchowka(tekst) {
  try { await navigator.clipboard.writeText(tekst); return true; }
  catch (e) { return false; }
}

/* ---------- wydruk ---------- */
function drukuj(p) {
  const lista = sprzetyPrzekazania(p);
  Wydruk.protokol('Protokół przekazania ' + p.nr,
    [['Data', new Date(p.data).toLocaleDateString('pl-PL')],
     ['Punkt', Eksport.nazwaLok(p.lokalizacjaId) || '—'],
     ['Odbierający', p.osoba || '—'],
     ['Przekazał', p.kto || '—'],
     ['Firma', DB.D.ust.firma || '—'],
     ['Uwagi', p.uwagi || '—']],
    [{ tytul: 'Przekazane środki trwałe',
       kolumny: ['Lp', 'Nr inwentarzowy', 'Nazwa', 'Producent / model', 'Nr seryjny', 'Ilość'],
       wiersze: lista.map(s => [s.nrInw || '', s.nazwa || '',
                                [s.producent, s.model].filter(Boolean).join(' '),
                                s.nrSer || '', '1 szt.']) }],
    ['Przekazujący', 'Przyjmujący']);
}

/* ---------- arkusz do Excela ---------- */
function arkusz() {
  const wiersze = [];
  DB.przekazania()
    .slice()
    .sort((a, b) => (b.data || '').localeCompare(a.data || ''))
    .forEach(p => {
      const lok = Eksport.nazwaLok(p.lokalizacjaId);
      sprzetyPrzekazania(p).forEach(s => wiersze.push([
        p.nr, new Date(p.data), lok, p.osoba || '', p.kto || '',
        s.nrInw || '', s.nazwa || '',
        [s.producent, s.model].filter(Boolean).join(' '), s.nrSer || '', 1, p.uwagi || ''
      ]));
    });
  return {
    nazwa: 'Przekazania',
    kolumny: [
      { n: 'Nr przekazania', t: 'txt', w: 16 }, { n: 'Data', t: 'data', w: 12 },
      { n: 'Punkt', t: 'txt', w: 26 }, { n: 'Odbierający', t: 'txt', w: 20 },
      { n: 'Przekazał', t: 'txt', w: 20 }, { n: 'Nr inwentarzowy', t: 'txt', w: 18 },
      { n: 'Nazwa', t: 'txt', w: 28 }, { n: 'Producent / model', t: 'txt', w: 24 },
      { n: 'Nr seryjny', t: 'txt', w: 20 }, { n: 'Ilość', t: 'int', w: 8 },
      { n: 'Uwagi', t: 'txt', w: 24 }
    ],
    wiersze, sumy: [9]
  };
}

global.Przek = {
  nastepnyNumer, zapisz, sprzetyPrzekazania, opisSprzetu,
  trescMaila, trescMailaRW, wyslij, doSchowka, drukuj, arkusz, adresMailto
};

})(window);

</script>
<script>
/* ===== js/przenoszenie.js ===== */
/* ------------------------------------------------------------------
   przenoszenie.js — szybkie zapisywanie fizycznych przenosin.

   Zamysł: moment, w którym da się cokolwiek zapisać, to chwila podnoszenia
   rzeczy — nie chwila jej odkładania. Dlatego skanujesz sprzęt w momencie
   zabrania, a miejsce docelowe podajesz kiedykolwiek później.
   Do tego czasu sprzęt jest „w drodze” i widać go na pulpicie.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

/* ---------- rozpoznanie kodu ----------
   Etykiety pochodzą z firmowego systemu, więc skanowany kod bardzo często
   nie jest jeszcze w tej aplikacji. Zakładamy wtedy pozycję od ręki —
   z kodem jako numerem — a nazwę uzupełnia się później, na spokojnie.
   Blokowanie skanu komunikatem „to nie jest kod sprzętu” byłoby
   dokładnie tym tarciem, przez które nikt by tego nie używał. */
async function sprzetZKodu(kod) {
  const k = String(kod).trim();
  if (!k) return { blad: 'pusty kod' };
  const t = DB.poKodzie(k);

  if (t.rodzaj === 'sprzet') return { sprzet: t.obiekt, nowy: false };
  if (t.rodzaj === 'lokalizacja')
    return { blad: 'To kod pomieszczenia: ' + (t.obiekt.nazwa || t.obiekt.kod) };
  if (t.rodzaj === 'produkt')
    return { blad: 'To kod produktu z magazynu: ' + t.obiekt.nazwa };

  const nowy = await DB.zapisz('sprzet', {
    nrInw: k, kodKresk: k, nazwa: '', status: 'uzywany',
    lokalizacjaId: null, doUzupelnienia: true
  }, false);
  return { sprzet: nowy, nowy: true };
}

/* ---------- zabranie ---------- */
async function zabierzKod(kod) {
  const r = await sprzetZKodu(kod);
  if (r.blad) return r;
  const w = await zabierz(r.sprzet.id);
  return Object.assign({}, r, w);
}

async function zabierz(sprzetId) {
  const s = DB.sprzety().find(x => x.id === sprzetId);
  if (!s) return null;
  if (s.wDrodze) return { juz: true, sprzet: s };
  s.wDrodze = {
    zId: s.lokalizacjaId || null,
    kiedy: DB.teraz(),
    kto: DB.D.ust.osoba || ''
  };
  await DB.zapisz('sprzet', s, false);
  return { sprzet: s };
}

async function anuluj(sprzetId) {
  const s = DB.sprzety().find(x => x.id === sprzetId);
  if (!s || !s.wDrodze) return;
  delete s.wDrodze;
  await DB.zapisz('sprzet', s, false);
}

const wDrodze = () => DB.sprzety()
  .filter(s => s.wDrodze)
  .sort((a, b) => (a.wDrodze.kiedy || '').localeCompare(b.wDrodze.kiedy || ''));

/* ---------- odłożenie ---------- */
async function odloz(lokalizacjaId, sprzetIds) {
  const lista = (sprzetIds
    ? sprzetIds.map(id => DB.sprzety().find(s => s.id === id)).filter(Boolean)
    : wDrodze());
  const powstale = [];

  for (const s of lista) {
    /* lokalizacja przez cały czas transportu zostaje ta wyjściowa,
       więc wystarczy zdjąć znacznik i wykonać zwykłe przeniesienie */
    delete s.wDrodze;
    await DB.zapisz('sprzet', s, false);
    const r = await DB.przenies(s.id, lokalizacjaId,
      DB.D.ust.osoba || '', 'przeniesienie fizyczne');
    if (r) powstale.push(r);
  }
  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + lista.length);
  return { przeniesione: lista.length, ruchy: powstale };
}

/* ---------- zgłaszanie ---------- */
const niezgloszone = () => DB.D.ruchy
  .filter(r => !r.usuniety && !r.zgloszony)
  .sort((a, b) => (a.data || '').localeCompare(b.data || ''));

function opisRuchu(r) {
  const s = DB.D.sprzet.find(x => x.id === r.sprzetId) || {};
  const skad = r.zId ? Eksport.nazwaLok(r.zId) : 'brak przypisania';
  return {
    kiedy: r.data,
    sprzet: (s.nrInw ? s.nrInw + ' — ' : '') + (s.nazwa || '(usunięty)'),
    skad, dokad: Eksport.nazwaLok(r.doId) || '—',
    powod: r.powod || ''
  };
}

function trescPodsumowania(ruchy) {
  const L = [];
  const od = ruchy.length ? new Date(ruchy[0].data) : new Date();
  L.push('PRZEMIESZCZENIA SPRZĘTU DO WPROWADZENIA');
  L.push('');
  L.push('Okres: od ' + od.toLocaleDateString('pl-PL') +
         ' do ' + new Date().toLocaleDateString('pl-PL'));
  L.push('Zgłasza: ' + (DB.D.ust.osoba || '—'));
  L.push('');
  L.push('Poniższe środki zostały przeniesione fizycznie.');
  L.push('Proszę o wprowadzenie zmian w systemie ewidencji.');
  L.push('');

  /* grupujemy po dniach — czyta się to znacznie lepiej niż płaska lista */
  const dni = new Map();
  ruchy.forEach(r => {
    const o = opisRuchu(r);
    const d = new Date(o.kiedy).toLocaleDateString('pl-PL');
    if (!dni.has(d)) dni.set(d, []);
    dni.get(d).push(o);
  });

  let lp = 0;
  for (const [dzien, lista] of dni) {
    L.push(dzien + ':');
    lista.forEach(o => {
      lp++;
      L.push('  ' + lp + '. ' + o.sprzet);
      L.push('     ' + o.skad + '  →  ' + o.dokad);
    });
    L.push('');
  }
  const forma = lp === 1 ? 'przemieszczenie'
    : (lp % 10 >= 2 && lp % 10 <= 4 && !(lp % 100 >= 12 && lp % 100 <= 14))
      ? 'przemieszczenia' : 'przemieszczeń';
  L.push('Razem: ' + lp + ' ' + forma + '.');
  L.push('');
  L.push('--');
  L.push(DB.D.ust.firma || 'Ewidencja wyposażenia');
  return L.join('\n');
}

async function oznaczZgloszone(ruchy) {
  ruchy.forEach(r => { r.zgloszony = DB.teraz(); });
  await DB.zapiszWiele('ruchy', ruchy);
  await DB.ustaw('ostatnieZgloszenie', DB.teraz());
}

async function cofnijZgloszenie(ruchy) {
  ruchy.forEach(r => { delete r.zgloszony; });
  await DB.zapiszWiele('ruchy', ruchy);
}

/* ---------- podpowiedzi ---------- */
/* ostatnio używane miejsca docelowe — najczęstszy wybór jest zwykle świeży */
function ostatnieCele(ile) {
  const kolejnosc = [];
  DB.D.ruchy.slice().reverse().forEach(r => {
    if (r.usuniety || !r.doId) return;
    if (!kolejnosc.includes(r.doId)) kolejnosc.push(r.doId);
  });
  const zywe = new Set(DB.lokalizacje().map(l => l.id));
  return kolejnosc.filter(id => zywe.has(id)).slice(0, ile || 4);
}

const doUzupelnienia = () => DB.sprzety().filter(s => s.doUzupelnienia);

global.Przen = {
  sprzetZKodu, zabierzKod, zabierz, anuluj, wDrodze, odloz, doUzupelnienia,
  niezgloszone, opisRuchu, trescPodsumowania, oznaczZgloszone, cofnijZgloszenie,
  ostatnieCele
};

})(window);

</script>

function dzien(minusDni) {
  const d = new Date();
  d.setDate(d.getDate() - minusDni);
  return d.toISOString().slice(0, 10);
}

async function wypelnij() {
  /* bez tych dwóch pól wydruki i maile wyglądają na niedokończone */
  if (!DB.D.ust.firma) await DB.ustaw('firma', 'Firma testowa');
  if (!DB.D.ust.osoba) await DB.ustaw('osoba', 'Jan Testowy');

  const lok = [];
  for (const [kod, nazwa, bud, pie, os, punkt, miasto, ulica, kierowca] of LOK)

      kodKresk: kod, email: punkt && os ? kod.toLowerCase() + '@przyklad.pl' : '',
      demo: true
    }, false));

  const prod = [];
  for (const [nazwa, ean, jm, min, kat, dost] of PROD)
    prod.push(await DB.zapisz('produkty', {
      nazwa, ean, jm, stanMin: min, kategoria: kat, dostawca: dost, demo: true
    }, false));

  /* dwie dostawy — druga świeższa, żeby było co pokazać w historii */
  await DB.zapisz('dokumenty', {
    typ: 'PZ', numer: DB.nastepnyNumer('PZ'), data: dzien(21),
    dostawca: 'Biuro-Serwis sp. z o.o.', nrFaktury: 'FV/1042/2026', demo: true,
    pozycje: prod.slice(0, 8).map((p, i) => ({ produktId: p.id, ilosc: [60, 20, 400, 200, 30, 50, 40, 6][i] }))
  }, false);
  await DB.zapisz('dokumenty', {
    typ: 'PZ', numer: DB.nastepnyNumer('PZ'), data: dzien(5),
    dostawca: 'Czyścioch', nrFaktury: 'FV/77/2026', demo: true,
    pozycje: prod.slice(10).map(p => ({ produktId: p.id, ilosc: 24 }))
  }, false);

  /* wydania na dwa punkty */
  await DB.zapisz('dokumenty', {
    typ: 'RW', numer: DB.nastepnyNumer('RW'), data: dzien(12),
    lokalizacjaId: lok[1].id, osoba: 'Anna Kowalska', demo: true,
    pozycje: [{ produktId: prod[0].id, ilosc: 12 }, { produktId: prod[2].id, ilosc: 60 }]
  }, false);
  await DB.zapisz('dokumenty', {
    typ: 'RW', numer: DB.nastepnyNumer('RW'), data: dzien(3),
    lokalizacjaId: lok[2].id, osoba: 'Jan Nowak', demo: true,
    pozycje: [{ produktId: prod[0].id, ilosc: 10 }, { produktId: prod[5].id, ilosc: 45 }]
  }, false);

  const sprz = [];
  for (const [nazwa, typ, prodc, model, sn, iLok] of SPRZ) {
    const nr = DB.nastepnyNrInw();
    sprz.push(await DB.zapisz('sprzet', {
      nrInw: nr, kodKresk: nr, nazwa, typ, producent: prodc, model, nrSer: sn,
      lokalizacjaId: lok[iLok].id, osoba: lok[iLok].osoba || '',
      status: 'uzywany', dataZakupu: dzien(400),
      gwarancjaDo: dzien(-200), demo: true
    }, false));
  }
  /* jeden sprzęt po gwarancji i jeden w naprawie — żeby filtry miały co pokazać */
  sprz[8].gwarancjaDo = dzien(30);
  await DB.zapisz('sprzet', sprz[8], false);
  sprz[9].status = 'naprawa';
  await DB.zapisz('sprzet', sprz[9], false);

  /* przekazanie dwóch sztuk na punkt */
  await Przek.zapisz({
    lokalizacjaId: lok[3].id, osoba: 'Ewa Wiśniewska',
    email: 'p-waw@przyklad.pl', uwagi: 'wyposażenie nowego stanowiska',
    pozycje: [sprz[0].id, sprz[2].id],      // oba stoją gdzie indziej, więc oba się przeniosą
    demo: true
  });

  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + 30);
  return { lokalizacje: lok.length, produkty: prod.length, sprzet: sprz.length };
}

function ilePróbnych() {
  const s = ['produkty', 'lokalizacje', 'dokumenty', 'sprzet', 'partie', 'zamowienia', 'przekazania'];
  return s.reduce((n, k) => n + DB.D[k].filter(x => x.demo && !x.usuniety).length, 0);
}

async function usun() {
  const s = ['produkty', 'lokalizacje', 'dokumenty', 'sprzet', 'partie', 'zamowienia', 'przekazania'];
  let n = 0;
  for (const k of s) {
    const doUsuniecia = DB.D[k].filter(x => x.demo && !x.usuniety);
    doUsuniecia.forEach(x => { x.usuniety = true; });
    if (doUsuniecia.length) { await DB.zapiszWiele(k, doUsuniecia); n += doUsuniecia.length; }
  }
  /* ruchy powstałe przy przekazaniach danych próbnych */
  const idSprz = new Set(DB.D.sprzet.filter(x => x.demo).map(x => x.id));
  const ruchy = DB.D.ruchy.filter(r => idSprz.has(r.sprzetId) && !r.usuniety);
  ruchy.forEach(r => { r.usuniety = true; });
  if (ruchy.length) await DB.zapiszWiele('ruchy', ruchy);
  return n;
}

global.Diag = { raport, wypelnij, usun, ilePróbnych };

<script>
/* ===== js/ui.js ===== */
/* ------------------------------------------------------------------
   ui.js — ekrany aplikacji i nawigacja.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

const $ = s => document.querySelector(s);
const widok = () => $('#widok');

/* ---------- drobiazgi ---------- */
function h(s) {
  return String(s == null ? '' : s)
    .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(t, ms) {
  const e = $('#toast');
  e.textContent = t;
  e.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => e.classList.remove('on'), ms || 2600);
}
const liczba = n => (Number(n) || 0).toLocaleString('pl-PL');

/* 1 sztuka, 2 sztuki, 5 sztuk — bez tego aplikacja brzmi jak formularz */
function odmiana(n, formy) {
  n = Math.abs(Number(n) || 0);
  if (n === 1) return formy[0];
  const d = n % 10, s = n % 100;
  return (d >= 2 && d <= 4 && !(s >= 12 && s <= 14)) ? formy[1] : formy[2];
}
const zOdmiana = (n, formy) => liczba(n) + ' ' + odmiana(n, formy);
const SZT = ['sztuka', 'sztuki', 'sztuk'];
const PRZEM = ['przemieszczenie', 'przemieszczenia', 'przemieszczeń'];
const zl = n => (Number(n) || 0).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';
function dataPL(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleDateString('pl-PL');
}
function dataGodzPL(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
}
const dzisISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
};
function bezOgonkow(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l');
}
const pasuje = (tekst, fraza) => bezOgonkow(tekst).includes(bezOgonkow(fraza));

/* ---------- modal ---------- */
function modal(tytul, tresc, przyciski) {
  const m = $('#modal');
  $('#modal-tytul').textContent = tytul;
  $('#modal-tresc').innerHTML = tresc;
  const p = $('#modal-przyciski');
  p.innerHTML = '';
  (przyciski || []).forEach(b => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'b ' + (b.klasa || '');
    el.textContent = b.tekst;
    el.onclick = () => { if (b.akcja) b.akcja(); if (b.zamknij !== false) zamknijModal(); };
    p.appendChild(el);
  });
  m.hidden = false;
  document.body.classList.add('bez-scrolla');
  m.querySelector('.modal-tlo').onclick = zamknijModal;
  return m;
}
function zamknijModal() {
  $('#modal').hidden = true;
  document.body.classList.remove('bez-scrolla');
}
function potwierdz(tytul, tekst, etykieta) {
  return new Promise(res => {
    modal(tytul, '<p>' + h(tekst) + '</p>', [
      { tekst: 'Anuluj', akcja: () => res(false) },
      { tekst: etykieta || 'Tak', klasa: 'glowny', akcja: () => res(true) }
    ]);
  });
}

/* ---------- zdjęcia ---------- */
function zZdjecia(plik, maks) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, (maks || 900) / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = rej;
      im.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(plik);
  });
}

/* ==================================================================
   PULPIT
   ================================================================== */
function pulpit() {
  const braki = DB.braki();
  const kopia = DB.kopiaPotrzebna();
  const liczbaProd = DB.produkty().length;
  const liczbaSpr = DB.sprzety().length;
  const liczbaLok = DB.lokalizacje().length;

  const wdr = Przen.wDrodze();
  const niezg = Przen.niezgloszone();

  let a = '';
  const notDoRozl = DB.notatki().filter(n => !n.zrobiona).length;
  if (kopia) {
    const powod = kopia === 'nigdy' ? 'Nie masz jeszcze żadnej kopii zapasowej.'
      : kopia === 'operacje' ? 'Od ostatniej kopii wprowadziłeś ' + (DB.D.ust.operacjiOdKopii || 0) + ' zmian.'
      : 'Ostatnia kopia: ' + dataPL(DB.D.ust.ostatniaKopia) + '.';
    a += '<div class="alert zle"><div><b>Zrób kopię zapasową</b>' + h(powod) +
         ' Dane siedzą wyłącznie w tym telefonie. <a href="#/eksport">Zrób kopię →</a></div></div>';
  }
  if (braki.length) {
    a += '<div class="alert uw"><div><b>' + braki.length +
         ' pozycji poniżej stanu minimalnego</b>' +
         h(braki.slice(0, 3).map(b => b.produkt.nazwa).join(', ')) +
         (braki.length > 3 ? ' i ' + (braki.length - 3) + ' więcej' : '') +
         '. <a href="#/stany?f=braki">Zobacz listę →</a></div></div>';
  }
  if (wdr.length) {
    a += '<div class="alert uw"><div><b>' + zOdmiana(wdr.length, SZT) + ' w drodze</b>' +
         h(wdr.slice(0, 3).map(s => s.nazwa || s.nrInw).join(', ')) +
         (wdr.length > 3 ? ' i więcej' : '') +
         '. <a href="#/przenoszenie">Wskaż, gdzie trafiły →</a></div></div>';
  }
  if (niezg.length) {
    a += '<div class="karta"><h2>Do zgłoszenia</h2><p>' + zOdmiana(niezg.length, PRZEM) +
         ' czeka na przekazanie osobom prowadzącym ewidencję.</p>' +
         '<a class="b" href="#/zgloszenia" style="margin:10px 0 0">✉ Zobacz podsumowanie</a></div>';
  }
  if (!liczbaProd && !liczbaSpr) {
    a += '<div class="alert ok"><div><b>Zacznij od danych podstawowych</b>' +
         'Dodaj pomieszczenia i punkty, potem produkty albo sprzęt. ' +
         'Możesz też wczytać dane z kopii zapasowej w Ustawieniach.</div></div>';
  }

  return {
    tytul: DB.D.ust.firma || 'Magazyn',
    tab: 'pulpit',
    html:
      a +
      '<div class="karta karta-notatka">' +
        '<h2>✎ Szybka notatka</h2>' +
        '<div class="notatka-rzad">' +
          '<textarea id="szybka-n" rows="1" placeholder="np. wydałem 3 ryzy papieru do księgowości"></textarea>' +
          '<button type="button" class="b maly glowny" id="szybka-zapisz">Zapisz</button>' +
        '</div>' +
        '<p style="margin-top:8px;font-size:13px">' +
          (notDoRozl
            ? zOdmiana(notDoRozl, ['notatka czeka', 'notatki czekają', 'notatek czeka']) +
              ' na rozliczenie — <a href="#/notatki">otwórz listę →</a>'
            : 'Dyktuj mikrofonem klawiatury. Dokument zrobisz później — ' +
              '<a href="#/notatki">wszystkie notatki →</a>') +
        '</p>' +
      '</div>' +
      '<div class="stat">' +
        '<div><b>' + liczba(liczbaProd) + '</b><span>produktów</span></div>' +
        '<div><b>' + liczba(liczbaSpr) + '</b><span>sztuk sprzętu</span></div>' +
        '<div><b>' + liczba(liczbaLok) + '</b><span>pomieszczeń</span></div>' +
      '</div>' +
      '<div class="kafle">' +
        kafel('#/dokument/nowy/RW', '↑', 'Wydanie', 'Wydaj materiały na punkt', true) +
        kafel('#/dokument/nowy/PZ', '↓', 'Dostawa', 'Przyjmij dostawę na magazyn', true) +
        kafel('#/przenoszenie', '⇄', 'Przenoszę sprzęt', 'Zeskanuj, gdy coś zabierasz', true) +
        kafel('#/zamowienia', '☑', 'Zamówienia', 'Kompletacja z pliku') +
        kafel('#/stany', '▦', 'Stany', 'Co i ile jest na magazynie') +
        kafel('#/eksport', '⤓', 'Excel i kopia', 'Raport i kopia zapasowa') +
      '</div>',
    po: () => {
      const pole = $('#szybka-n');
      if (!pole) return;
      const zapisz = async () => {
        const t = pole.value.trim();
        if (!t) { pole.focus(); return; }
        await DB.zapisz('notatki', { tekst: t, kto: DB.D.ust.osoba || '' });
        pole.value = '';
        toast('Notatka zapisana');
        odswiez();
      };
      $('#szybka-zapisz').onclick = zapisz;
      /* Enter zapisuje, Shift+Enter robi nowy wiersz */
      pole.onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); zapisz(); }
      };
      /* pole rośnie razem z treścią, ale nie zabiera ekranu, gdy jest puste */
      const dopasuj = () => {
        pole.style.height = 'auto';
        pole.style.height = Math.min(pole.scrollHeight, 140) + 'px';
      };
      pole.oninput = dopasuj;
      dopasuj();
    }
  };
}
function kafel(href, ikn, tyt, opis, mocny) {
  return '<a class="kafel' + (mocny ? ' mocny' : '') + '" href="' + href + '">' +
    '<span class="ikn">' + ikn + '</span>' + h(tyt) + '<small>' + h(opis) + '</small></a>';
}

/* ==================================================================
   MAGAZYN: stany, katalog, dokumenty
   ================================================================== */
function stany(param) {
  const filtr = param.f || 'stany';
  const st = DB.stany();

  const zakladki = '<div class="filtry">' +
    ['stany|Stany', 'braki|Do zamówienia', 'dok|Dokumenty', 'katalog|Katalog']
      .map(x => {
        const [k, n] = x.split('|');
        return '<button type="button" data-f="' + k + '"' +
          (filtr === k ? ' class="akt"' : '') + '>' + n +
          (k === 'braki' && DB.braki().length ? ' (' + DB.braki().length + ')' : '') +
          '</button>';
      }).join('') + '</div>';

  let tresc = '';

  if (filtr === 'stany' || filtr === 'braki') {
    const braki = filtr === 'braki';
    let lista = DB.produkty().map(p => ({
      p, stan: st.get(p.id) || 0, min: Number(p.stanMin) || 0
    }));
    if (braki) lista = lista.filter(x => x.min > 0 && x.stan < x.min);
    lista.sort((a, b) => braki ? (b.min - b.stan) - (a.min - a.stan)
                               : a.p.nazwa.localeCompare(b.p.nazwa, 'pl'));

    tresc = '<div class="szukaj"><input id="q" type="search" placeholder="Szukaj produktu lub EAN" autocomplete="off"></div>' +
      (braki && lista.length
        ? '<button class="b" id="lista-zakupow">Zrób listę zakupową (wydruk)</button>' : '') +
      '<div class="lista" id="wyniki">' + wierszeStanow(lista) + '</div>' +
      (lista.length ? '' : pusto(braki ? '✓' : '▦',
        braki ? 'Żadna pozycja nie jest poniżej minimum.'
              : 'Brak produktów w katalogu. Dodaj pierwszy produkt.')) +
      '<button class="b glowny" id="nowy-produkt">+ Nowy produkt</button>';

    return { tytul: braki ? 'Do zamówienia' : 'Stany magazynowe', tab: 'magazyn',
      html: zakladki + tresc, po: () => {
        const q = $('#q');
        q.oninput = () => {
          const f = q.value.trim();
          const w = f ? lista.filter(x => pasuje(x.p.nazwa, f) ||
            (x.p.ean || '').includes(f) || pasuje(x.p.indeks, f)) : lista;
          $('#wyniki').innerHTML = wierszeStanow(w);
          podepnijPozycje();
        };
        podepnijPozycje();
        $('#nowy-produkt').onclick = () => location.hash = '#/produkt/nowy';
        const lz = $('#lista-zakupow');
        if (lz) lz.onclick = drukujListeZakupow;
        podepnijFiltry();
      } };
  }

  if (filtr === 'katalog') {
    const lista = DB.produkty().sort((a, b) => a.nazwa.localeCompare(b.nazwa, 'pl'));
    tresc = '<div class="szukaj"><input id="q" type="search" placeholder="Szukaj w katalogu" autocomplete="off"></div>' +
      '<div class="lista" id="wyniki">' + wierszeKatalogu(lista) + '</div>' +
      (lista.length ? '' : pusto('▦', 'Katalog jest pusty.')) +
      '<button class="b glowny" id="nowy-produkt">+ Nowy produkt</button>';
    return { tytul: 'Katalog produktów', tab: 'magazyn', html: zakladki + tresc, po: () => {
      const q = $('#q');
      q.oninput = () => {
        const f = q.value.trim();
        $('#wyniki').innerHTML = wierszeKatalogu(
          f ? lista.filter(p => pasuje(p.nazwa, f) || (p.ean || '').includes(f) ||
                                pasuje(p.indeks, f)) : lista);
        podepnijPozycje();
      };
      podepnijPozycje();
      $('#nowy-produkt').onclick = () => location.hash = '#/produkt/nowy';
      podepnijFiltry();
    } };
  }

  /* dokumenty */
  const dok = DB.dokumenty().sort((a, b) => (b.data || '').localeCompare(a.data || '') ||
                                            (b.utw || '').localeCompare(a.utw || ''));
  tresc =
    '<div class="przyciski">' +
      '<a class="b glowny" href="#/dokument/nowy/PZ">+ Dostawa</a>' +
      '<a class="b glowny" href="#/dokument/nowy/RW">+ Wydanie</a>' +
    '</div>' +
    '<a class="b" href="#/dokument/nowy/KOR">+ Korekta stanu</a>' +
    (dok.length ? '<div class="lista">' + dok.map(d => {
      const ile = (d.pozycje || []).reduce((s, p) => s + (Number(p.ilosc) || 0), 0);
      const strona = d.typ === 'PZ' ? (d.dostawca || '—')
                   : d.typ === 'RW' ? (Eksport.nazwaLok(d.lokalizacjaId) || '—')
                   : (d.powod || 'korekta');
      return '<a class="poz" href="#/dokument/' + d.id + '"><div class="tre">' +
        '<div class="tyt">' + h(d.numer) + ' <span class="znacz ' +
          (d.typ === 'PZ' ? 'ok' : d.typ === 'RW' ? '' : 'uw') + '">' + d.typ + '</span></div>' +
        '<div class="pod">' + h(dataPL(d.data)) + ' · ' + h(strona) + '</div></div>' +
        '<div class="licz">' + liczba(ile) + '<small>' + (d.pozycje || []).length + ' poz.</small></div></a>';
    }).join('') + '</div>' : pusto('▤', 'Brak dokumentów. Zacznij od przyjęcia dostawy.'));

  return { tytul: 'Dokumenty', tab: 'magazyn', html: zakladki + tresc, po: podepnijFiltry };
}

function wierszeStanow(lista) {
  if (!lista.length) return '';
  return lista.map(x => {
    const brak = x.min > 0 && x.stan < x.min;
    return '<a class="poz' + (brak ? ' brak' : '') + '" href="#/produkt/' + x.p.id + '">' +
      '<div class="tre"><div class="tyt">' + h(x.p.nazwa) + '</div>' +
      '<div class="pod">' + (x.p.indeks ? h(x.p.indeks) + ' · ' : (x.p.ean ? h(x.p.ean) + ' · ' : '')) +
        (x.p.kategoria ? h(x.p.kategoria) + ' · ' : '') +
        (x.min ? 'min. ' + liczba(x.min) : 'bez minimum') +
        (brak ? ' · brakuje ' + liczba(x.min - x.stan) : '') + '</div></div>' +
      '<div class="licz">' + liczba(x.stan) + '<small>' + h(x.p.jm || 'szt') + '</small></div></a>';
  }).join('');
}
function wierszeKatalogu(lista) {
  return lista.map(p => '<a class="poz" href="#/produkt/' + p.id + '">' +
    '<div class="tre"><div class="tyt">' + h(p.nazwa) + '</div>' +
    '<div class="pod">' + [p.ean, p.indeks].filter(Boolean).map(h).join(' · ') +
      (!p.ean && !p.indeks ? 'bez kodów' : '') +
      (p.dostawca ? ' · ' + h(p.dostawca) : '') + '</div></div>' +
    '<div class="licz"><small>' + h(p.jm || 'szt') + '</small></div></a>').join('');
}
function pusto(ikn, tekst) {
  return '<div class="pusto"><span class="duzy">' + ikn + '</span>' + h(tekst) + '</div>';
}
function podepnijPozycje() { /* linki obsługuje router przez hash */ }
function podepnijFiltry() {
  widok().querySelectorAll('.filtry button[data-f]').forEach(b => {
    b.onclick = () => location.hash = '#/stany?f=' + b.dataset.f;
  });
}

/* ==================================================================
   PRODUKT — formularz
   ================================================================== */
function produkt(param) {
  const nowy = param.id === 'nowy';
  const p = nowy ? { jm: 'szt' } : DB.produkty().find(x => x.id === param.id);
  if (!p) return { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiego produktu.') };

  const st = nowy ? 0 : (DB.stany().get(p.id) || 0);
  const ruch = nowy ? [] : historiaProduktu(p.id);

  return {
    tytul: nowy ? 'Nowy produkt' : p.nazwa,
    wstecz: true,
    html:
      (nowy ? '' : '<div class="karta"><h2>Stan bieżący</h2><p style="font-size:26px;' +
        'font-weight:700;color:var(--tx)">' + liczba(st) + ' ' + h(p.jm || 'szt') + '</p></div>') +
      '<div class="karta">' +
      '<div class="zkodem">' +
        pole('ean', 'Kod kreskowy (EAN)', p.ean, 'text', 'z opakowania, np. 5901234567890') +
        '<button type="button" class="b maly" id="skan">⌗</button>' +
      '</div>' +
      '<div class="zkodem">' +
        pole('indeks', 'Indeks / nr katalogowy', p.indeks, 'text', 'producenta, np. QWE-1312') +
        '<button type="button" class="b maly" id="skan-ind">⌗</button>' +
      '</div>' +
      pole('nazwa', 'Nazwa produktu *', p.nazwa, 'text', 'np. Papier A4 80g') +
      '<div class="rzad">' + pole('kategoria', 'Kategoria', p.kategoria) +
        polSelect('jm', 'Jednostka', p.jm || 'szt',
          ['szt', 'opak', 'ryza', 'kpl', 'rolka', 'karton', 'litr', 'kg']) + '</div>' +
      '<div class="rzad">' + pole('wOpak', 'Sztuk w opakowaniu', p.wOpak, 'number') +
        pole('stanMin', 'Stan minimalny', p.stanMin, 'number') + '</div>' +
      pole('dostawca', 'Domyślny dostawca', p.dostawca) +
      poleObszar('uwagi', 'Uwagi', p.uwagi) +
      '</div>' +
      '<button class="b glowny" id="zapisz">Zapisz</button>' +
      (nowy ? '' : '<button class="b" id="popraw-stan">Ustaw stan ręcznie</button>' +
                   '<button class="b zly" id="usun">Usuń produkt</button>') +
      (ruch.length ? '<div class="naglowek-sekcji">Historia</div><div class="lista">' +
        ruch.map(r => '<a class="poz" href="#/dokument/' + r.dokId + '"><div class="tre">' +
          '<div class="tyt">' + h(r.numer) + '</div><div class="pod">' + h(dataPL(r.data)) +
          (r.strona ? ' · ' + h(r.strona) : '') + '</div></div>' +
          '<div class="licz" style="color:' + (r.ile > 0 ? 'var(--ok)' : 'var(--zle)') + '">' +
          (r.ile > 0 ? '+' : '') + liczba(r.ile) + '</div></a>').join('') + '</div>' : ''),
    po: () => {
      $('#skan').onclick = async () => {
        const k = await Skaner.jedenKod({ tytul: 'Zeskanuj kod kreskowy z opakowania' });
        if (k) { $('#f-ean').value = k; toast('EAN: ' + k); }
      };
      $('#skan-ind').onclick = async () => {
        const k = await Skaner.jedenKod({ tytul: 'Zeskanuj indeks producenta',
          podpowiedz: 'Niektórzy dostawcy drukują indeks osobnym kodem Code 128.' });
        if (k) { $('#f-indeks').value = k; toast('Indeks: ' + k); }
      };
      $('#zapisz').onclick = async () => {
        const dane = zbierz(['ean', 'indeks', 'nazwa', 'kategoria', 'jm', 'wOpak',
                             'stanMin', 'dostawca', 'uwagi']);
        if (!dane.nazwa) { toast('Podaj nazwę produktu'); return; }
        const kol = DB.produkty().find(x => x.id !== p.id &&
          ((dane.ean && x.ean === dane.ean) || (dane.indeks && x.indeks === dane.indeks)));
        if (kol) { toast('Ten kod ma już produkt: ' + kol.nazwa, 4000); return; }
        await DB.zapisz('produkty', Object.assign(p, dane));
        toast('Zapisano');
        history.back();
      };
      const ps = $('#popraw-stan');
      if (ps) ps.onclick = () => ustawStan(p);
      const u = $('#usun');
      if (u) u.onclick = async () => {
        const uzyty = DB.dokumenty().some(d => (d.pozycje || []).some(x => x.produktId === p.id));
        const ok = await potwierdz('Usunąć produkt?',
          uzyty ? 'Produkt występuje w dokumentach. Zniknie z katalogu i ze stanów, ale dokumenty zostaną nienaruszone.'
                : 'Produkt zostanie usunięty z katalogu.', 'Usuń');
        if (!ok) return;
        await DB.usun('produkty', p.id);
        toast('Usunięto');
        location.hash = '#/stany?f=katalog';
      };
    }
  };
}

/* Ręczne ustawienie stanu. Nie nadpisujemy liczby — dopisujemy dokument
   korekty na różnicę, żeby stan dało się rozłożyć na dokumenty tak samo
   jak każdy inny. */
function ustawStan(p) {
  const obecny = DB.stany().get(p.id) || 0;
  const pierwszy = !DB.dokumenty().some(d => (d.pozycje || []).some(x => x.produktId === p.id));
  const jm = p.jm || 'szt';

  modal('Ustaw stan: ' + p.nazwa,
    '<p style="margin-bottom:12px">Stan wyliczony z dokumentów: <b>' +
      liczba(obecny) + ' ' + h(jm) + '</b></p>' +
    '<label><span class="et">Ile jest faktycznie (' + h(jm) + ')</span>' +
      '<input id="m-stan" type="text" inputmode="decimal" value="' +
      h(obecny) + '"></label>' +
    '<label><span class="et">Powód</span><input id="m-powod" type="text" value="' +
      (pierwszy ? 'stan początkowy' : 'spis z natury') + '"></label>' +
    '<p style="font-size:13px;color:var(--tx2)">Powstanie dokument korekty na różnicę. ' +
      'Nic nie zostanie nadpisane — historia zostaje.</p>',
    [{ tekst: 'Anuluj' },
     { tekst: 'Zapisz', klasa: 'glowny', zamknij: false, akcja: async () => {
        const nowy = naLiczbe($('#m-stan').value);
        if (nowy == null || nowy < 0) { toast('Podaj liczbę nie mniejszą od zera'); return; }
        const roznica = nowy - obecny;
        if (!roznica) { zamknijModal(); toast('Stan już się zgadza'); return; }

        /* zejście w dół nie może wyprowadzić poniżej tego, co już zarezerwowano */
        if (roznica < 0) {
          const rez = Zam.rezerwacje().get(p.id) || 0;
          if (nowy < rez) {
            zamknijModal();
            toast('Nie można zejść poniżej ' + liczba(rez) +
                  ' — tyle jest już odhaczone w zamówieniach', 5000);
            return;
          }
        }
        await DB.zapisz('dokumenty', {
          typ: 'KOR',
          numer: DB.nastepnyNumer('KOR'),
          data: dzisISO(),
          powod: $('#m-powod').value.trim() || 'korekta stanu',
          osoba: DB.D.ust.osoba || '',
          uwagi: 'ustawienie stanu z ' + liczba(obecny) + ' na ' + liczba(nowy),
          pozycje: [{ produktId: p.id, ilosc: roznica }]
        });
        zamknijModal();
        toast((roznica > 0 ? 'Dodano ' : 'Zdjęto ') + liczba(Math.abs(roznica)) + ' ' + jm, 3500);
        odswiez();
      } }]);
  setTimeout(() => { const i = $('#m-stan'); if (i) { i.focus(); i.select(); } }, 60);
}

function historiaProduktu(pid) {
  const out = [];
  DB.dokumenty().forEach(d => {
    (d.pozycje || []).forEach(p => {
      if (p.produktId !== pid) return;
      const znak = d.typ === 'RW' ? -1 : 1;
      out.push({
        dokId: d.id, numer: d.numer, data: d.data,
        ile: (Number(p.ilosc) || 0) * znak,
        strona: d.typ === 'PZ' ? d.dostawca : d.typ === 'RW'
                ? Eksport.nazwaLok(d.lokalizacjaId) : d.powod
      });
    });
  });
  return out.sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 40);
}

/* ==================================================================
   DOKUMENT — kreator dostawy / wydania / korekty
   ================================================================== */
let roboczy = null;

const OPIS_TYPU = {
  PZ: { tytul: 'Dostawa', nowy: 'Nowa dostawa', zapisz: 'Zapisz dostawę', opis: 'przyjęcie na magazyn' },
  RW: { tytul: 'Wydanie', nowy: 'Nowe wydanie', zapisz: 'Zapisz wydanie', opis: 'wydanie na punkt' },
  KOR: { tytul: 'Korekta', nowy: 'Nowa korekta', zapisz: 'Zapisz korektę', opis: 'poprawa stanu' }
};

function dokument(param) {
  const nowy = param.id === 'nowy';
  const typ = nowy ? (param.typ || 'PZ') : null;

  if (nowy) {
    if (!roboczy || roboczy.typ !== typ || roboczy.id) {
      roboczy = { typ, numer: DB.nastepnyNumer(typ), data: dzisISO(), pozycje: [] };
    }
    return edytorDokumentu(roboczy, true);
  }

  const d = DB.dokumenty().find(x => x.id === param.id);
  if (!d) return { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiego dokumentu.') };
  return podgladDokumentu(d);
}

function edytorDokumentu(d, nowy) {
  const o = OPIS_TYPU[d.typ];
  const punkty = DB.lokalizacje().sort((a, b) =>
    Eksport.nazwaLok(a.id).localeCompare(Eksport.nazwaLok(b.id), 'pl'));

  const naglowek =
    '<div class="karta">' +
    '<div class="rzad">' + pole('numer', 'Numer', d.numer) + pole('data', 'Data', d.data, 'date') + '</div>' +
    (d.typ === 'PZ'
      ? pole('dostawca', 'Dostawca', d.dostawca, 'text', 'np. Biuro-Serwis sp. z o.o.') +
        pole('nrFaktury', 'Nr faktury / WZ', d.nrFaktury)
      : d.typ === 'RW'
      ? (punkty.length
          ? polSelectId('lokalizacjaId', 'Punkt / pomieszczenie *', d.lokalizacjaId,
              [['', '— wybierz —']].concat(punkty.map(l => [l.id, Eksport.nazwaLok(l.id)])))
          : '<div class="alert uw"><div><b>Brak pomieszczeń</b>Dodaj najpierw pomieszczenie lub punkt. ' +
            '<a href="#/lokalizacja/nowa">Dodaj →</a></div></div>') +
        pole('osoba', 'Osoba odbierająca', d.osoba)
      : pole('powod', 'Powód korekty', d.powod, 'text', 'np. spis z natury, stłuczka')) +
    poleObszar('uwagi', 'Uwagi', d.uwagi) +
    '</div>';

  const pozycje = d.pozycje.length
    ? '<div class="lista" id="pozycje">' + d.pozycje.map((p, i) => {
        const pr = DB.produkty().find(x => x.id === p.produktId) || { nazwa: '(usunięty)' };
        const pod = pr.ean || (pr.kategoria || 'bez kodu EAN');
        return '<button class="poz" type="button" data-i="' + i + '"><div class="tre">' +
          '<div class="tyt">' + h(pr.nazwa) + '</div><div class="pod">' + h(pod) +
          '</div></div><div class="licz">' + (d.typ === 'KOR' && p.ilosc > 0 ? '+' : '') +
          liczba(p.ilosc) + '<small>' + h(pr.jm || 'szt') + '</small></div></button>';
      }).join('') + '</div>'
    : pusto('＋', 'Dodaj pierwszą pozycję — najszybciej skanerem.');

  const suma = d.pozycje.reduce((s, p) => s + (Number(p.ilosc) || 0), 0);

  return {
    tytul: nowy ? o.nowy : (o.tytul + ' ' + (d.numer || '')),
    wstecz: true,
    html: naglowek +
      '<div class="naglowek-sekcji"><span>Pozycje (' + d.pozycje.length + ')</span>' +
        (suma ? '<span>razem ' + liczba(suma) + '</span>' : '') +
      '</div>' +
      pozycje +
      '<div class="przyciski">' +
        '<button class="b glowny" id="skanuj-poz">⌗ Skanuj pozycję</button>' +
        '<button class="b" id="dodaj-poz">+ Z listy</button>' +
      '</div>' +
      '<button class="b glowny" id="zapisz-dok" style="margin-top:6px">' + o.zapisz + '</button>' +
      (nowy ? '<button class="b zly" id="porzuc">Porzuć</button>' : ''),
    po: () => {
      const zapiszNaglowek = () => {
        Object.assign(d, zbierz(['numer', 'data', 'dostawca', 'nrFaktury',
          'lokalizacjaId', 'osoba', 'powod', 'uwagi']));
      };
      widok().querySelectorAll('.karta input,.karta select,.karta textarea')
        .forEach(i => i.onchange = zapiszNaglowek);

      widok().querySelectorAll('#pozycje .poz').forEach(b => {
        b.onclick = () => { zapiszNaglowek(); edytujPozycje(d, +b.dataset.i); };
      });
      $('#skanuj-poz').onclick = () => { zapiszNaglowek(); skanujPozycje(d); };
      $('#dodaj-poz').onclick = () => { zapiszNaglowek(); wybierzProdukt(d); };
      $('#zapisz-dok').onclick = async () => {
        zapiszNaglowek();
        if (!d.pozycje.length) { toast('Dokument nie ma żadnej pozycji'); return; }
        if (d.typ === 'RW' && !d.lokalizacjaId) { toast('Wybierz punkt docelowy'); return; }
        /* wydać można tylko to, co jest — z uwzględnieniem towaru już
           zarezerwowanego przez odhaczone pozycje zamówień */
        if (d.typ === 'RW' || d.typ === 'KOR') {
          const dost = Zam.dostepne();
          const sprawdzane = d.typ === 'KOR'
            ? d.pozycje.filter(p => Number(p.ilosc) < 0)
                       .map(p => ({ produktId: p.produktId, ilosc: -Number(p.ilosc) }))
            : d.pozycje.map(p => ({ produktId: p.produktId, ilosc: Number(p.ilosc) || 0 }));
          const braki = Zam.zabraknie(sprawdzane, dost);
          if (braki.length) {
            pokazBraki(braki, d.typ === 'KOR' ? 'uzupełnienie przed korektą'
                                              : 'uzupełnienie przed wydaniem ' + d.numer,
              () => { odswiez(); toast('Stan uzupełniony — zapisz dokument ponownie', 4000); });
            return;
          }
        }
        const zNotatki = d.zNotatki;
        delete d.zNotatki;
        await DB.zapisz('dokumenty', d);
        if (zNotatki) {
          const n = DB.notatki().find(x => x.id === zNotatki);
          if (n) { n.zrobiona = DB.teraz(); await DB.zapisz('notatki', n, false); }
        }
        roboczy = null;
        toast(OPIS_TYPU[d.typ].tytul + ' ' + d.numer + ' zapisana');
        location.hash = '#/stany?f=dok';
      };
      const pz = $('#porzuc');
      if (pz) pz.onclick = async () => {
        if (d.pozycje.length && !(await potwierdz('Porzucić dokument?',
          'Wprowadzone pozycje przepadną.', 'Porzuć'))) return;
        roboczy = null;
        location.hash = '#/stany?f=dok';
      };
    }
  };
}

async function skanujPozycje(d) {
  await Skaner.otworz({
    tytul: 'Skanuj produkty',
    podpowiedz: 'Skanuj kolejne produkty — okno zostaje otwarte.',
    onKod: kod => {
      const p = DB.produkty().find(x => x.ean === kod);
      if (p) { Skaner.info('Dodaję: ' + p.nazwa); pytajOIlosc(d, p, null, true); }
      else { Skaner.zamknij(); nowyProduktZKodu(d, kod); }
    }
  });
}

function pytajOIlosc(d, produkt, indeks, wSkanerze) {
  const ist = indeks != null ? d.pozycje[indeks] : d.pozycje.find(x => x.produktId === produkt.id);
  const start = ist ? ist.ilosc : (d.typ === 'KOR' ? '' : 1);

  modal(produkt.nazwa,
    '<label><span class="et">Ilość (' + h(produkt.jm || 'szt') + ')' +
      (d.typ === 'KOR' ? ' — ujemna zmniejsza stan' : '') + '</span>' +
      '<input id="m-ilosc" type="text" inputmode="decimal" value="' +
      h(start) + '" autofocus></label>' +
    (produkt.wOpak ? '<p style="font-size:13px;color:var(--tx2)">W opakowaniu: ' +
      h(produkt.wOpak) + ' ' + h(produkt.jm || 'szt') + '</p>' : ''),
    [
      ist ? { tekst: 'Usuń pozycję', klasa: 'zly', akcja: () => {
        const i = indeks != null ? indeks : d.pozycje.indexOf(ist);
        d.pozycje.splice(i, 1);
        odswiez();
      } } : { tekst: 'Anuluj' },
      { tekst: 'Zapisz', klasa: 'glowny', akcja: () => {
        const il = naLiczbe($('#m-ilosc').value);
        if (il == null || (d.typ !== 'KOR' && il <= 0)) { toast('Podaj poprawną ilość'); return; }
        if (ist) ist.ilosc = il;
        else d.pozycje.push({ produktId: produkt.id, ilosc: il });
        if (wSkanerze) { toast(produkt.nazwa + ': ' + il); Skaner.info('Dodano ' + il + ' × ' + produkt.nazwa); }
        else odswiez();
      } }
    ]);
  setTimeout(() => { const i = $('#m-ilosc'); if (i) { i.focus(); i.select(); } }, 60);
}

function edytujPozycje(d, i) {
  const p = d.pozycje[i];
  const produkt = DB.produkty().find(x => x.id === p.produktId) || { nazwa: '(usunięty produkt)', jm: 'szt' };
  pytajOIlosc(d, produkt, i, false);
}

function wybierzProdukt(d) {
  const lista = DB.produkty().sort((a, b) => a.nazwa.localeCompare(b.nazwa, 'pl'));
  modal('Wybierz produkt',
    '<div class="szukaj"><input id="m-q" type="search" placeholder="Szukaj" autocomplete="off"></div>' +
    '<div class="lista" id="m-lista" style="max-height:46dvh;overflow:auto">' +
      wierszeWyboru(lista) + '</div>' +
    (lista.length ? '' : '<p style="color:var(--tx2);font-size:14px">Katalog jest pusty.</p>'),
    [{ tekst: 'Nowy produkt', akcja: () => nowyProduktZKodu(d, '') }, { tekst: 'Zamknij' }]);

  const odswiezListe = f => {
    const w = f ? lista.filter(p => pasuje(p.nazwa, f) || (p.ean || '').includes(f) ||
                                    pasuje(p.indeks, f)) : lista;
    $('#m-lista').innerHTML = wierszeWyboru(w);
    podepnijWybor(d, w);
  };
  $('#m-q').oninput = e => odswiezListe(e.target.value.trim());
  podepnijWybor(d, lista);
}
function wierszeWyboru(lista) {
  return lista.map((p, i) => '<button class="poz" type="button" data-i="' + i + '">' +
    '<div class="tre"><div class="tyt">' + h(p.nazwa) + '</div>' +
    '<div class="pod">' + ([p.ean, p.indeks].filter(Boolean).map(h).join(' · ') || 'bez kodów') +
    '</div></div></button>').join('');
}
function podepnijWybor(d, lista) {
  document.querySelectorAll('#m-lista .poz').forEach(b => {
    b.onclick = () => { zamknijModal(); pytajOIlosc(d, lista[+b.dataset.i], null, false); };
  });
}

function nowyProduktZKodu(d, kod) {
  modal('Nowy produkt',
    (kod ? '<p style="font-size:13.5px;color:var(--tx2);margin-bottom:10px">Kod <b>' + h(kod) +
      '</b> nie jest jeszcze w katalogu.</p>' : '') +

function sprzetLista(param) {
  const filtr = param.f || '';
  let lista = DB.sprzety();
  if (filtr && filtr !== 'wszystko') lista = lista.filter(s => (s.status || 'uzywany') === filtr);
  lista.sort((a, b) => (a.nazwa || '').localeCompare(b.nazwa || '', 'pl'));

  const doUzup = DB.sprzety().filter(s => s.doUzupelnienia).length;
  if (filtr === 'uzupelnij') lista = DB.sprzety().filter(s => s.doUzupelnienia);
  const statusy = ['wszystko|Wszystkie',
                   ...(doUzup ? ['uzupelnij|Do uzupełnienia (' + doUzup + ')'] : []),
                   'uzywany|W użyciu', 'magazyn|W magazynie',
                   'naprawa|W naprawie', 'wycofany|Wycofane'];

  return {
    tytul: 'Sprzęt i wyposażenie', tab: 'sprzet',
    html:
      '<div class="filtry">' + statusy.map(x => {
        const [k, n] = x.split('|');
        return '<button type="button" data-s="' + k + '"' +
          ((filtr || 'wszystko') === k ? ' class="akt"' : '') + '>' + n + '</button>';
      }).join('') + '</div>' +
      '<div class="szukaj"><input id="q" type="search" placeholder="Szukaj: nazwa, nr inwentarzowy, seryjny, pokój" autocomplete="off"></div>' +
      '<div class="przyciski">' +
        '<button class="b glowny" id="skanuj">⌗ Skanuj sprzęt</button>' +
        '<button class="b" id="nowy">+ Dodaj</button>' +
      '</div>' +
      '<a class="b" href="#/przekazania">→ Wydawanie na punkty</a>' +
      '<div class="lista" id="wyniki">' + wierszeSprzetu(lista) + '</div>' +
      (lista.length ? '' : pusto('▣', 'Brak sprzętu na liście.')),
    po: () => {
      const q = $('#q');
      q.oninput = () => {
        const f = q.value.trim();
        const w = f ? lista.filter(s => pasuje(s.nazwa, f) || pasuje(s.nrInw, f) ||
          pasuje(s.nrSer, f) || pasuje(s.model, f) ||
          pasuje(Eksport.nazwaLok(s.lokalizacjaId), f)) : lista;
        $('#wyniki').innerHTML = wierszeSprzetu(w);
      };
      $('#nowy').onclick = () => location.hash = '#/sprzet/nowy';
      $('#skanuj').onclick = async () => {
        const k = await Skaner.jedenKod({ tytul: 'Zeskanuj etykietę sprzętu' });
        if (!k) return;
        const t = DB.poKodzie(k);
        if (t.rodzaj === 'sprzet') location.hash = '#/sprzet/' + t.obiekt.id;
        else if (t.rodzaj === 'lokalizacja') location.hash = '#/lokalizacja/' + t.obiekt.id;
        else { toast('Nieznany kod: ' + k); location.hash = '#/sprzet/nowy?kod=' + encodeURIComponent(k); }
      };
      widok().querySelectorAll('.filtry button[data-s]').forEach(b => {
        b.onclick = () => location.hash = '#/sprzet?f=' + b.dataset.s;
      });
    }
  };
}
function wierszeSprzetu(lista) {
  return lista.map(s => {
    const st = s.status || 'uzywany';
    const kl = st === 'uzywany' ? 'ok' : st === 'naprawa' ? 'uw'
             : (st === 'wycofany' || st === 'zlikwidowany') ? 'zle' : '';
    return '<a class="poz" href="#/sprzet/' + s.id + '"><div class="tre">' +
      '<div class="tyt">' + h(s.nazwa || s.nrInw || '(bez nazwy)') +
      (s.doUzupelnienia ? ' <span class="znacz uw">uzupełnij</span>' : '') +
      (s.wDrodze ? ' <span class="znacz uw">w drodze</span>' : '') +
      (st !== 'uzywany' ? ' <span class="znacz ' + kl + '">' +
        h(Eksport.STATUSY[st] || st) + '</span>' : '') + '</div>' +
      '<div class="pod">' + h(s.nrInw || '') +
      (s.lokalizacjaId ? ' · ' + h(Eksport.nazwaLok(s.lokalizacjaId)) : ' · bez pomieszczenia') +
      '</div></div></a>';
  }).join('');
}

          (x.kodKresk === dane.kodKresk || x.nrInw === dane.kodKresk));
        if (kol) { toast('Ten kod ma już: ' + kol.nazwa, 4000); return; }

        Object.assign(s, dane);
        const nowaLok = s.lokalizacjaId;
        s.lokalizacjaId = staraLok;
        await DB.zapisz('sprzet', s);
        if (nowaLok !== staraLok) await DB.przenies(s.id, nowaLok || null, '', 'zmiana w karcie sprzętu');

        Wydruk.protokol('Protokół przekazania sprzętu',

           ['Osoba odpowiedzialna', s.osoba || '—']],

        toast('Usunięto');
        location.hash = '#/sprzet';
      };

  };

function lokalizacje(param) {
  const filtr = (param && param.f) || '';
  const wszystkie = DB.lokalizacje().sort((a, b) =>
    Eksport.nazwaLok(a.id).localeCompare(Eksport.nazwaLok(b.id), 'pl'));
  const punktow = wszystkie.filter(l => l.punkt).length;
  const lista = filtr === 'punkty' ? wszystkie.filter(l => l.punkt)
              : filtr === 'pokoje' ? wszystkie.filter(l => !l.punkt)
              : wszystkie;
  const ile = new Map();
  DB.sprzety().forEach(s => ile.set(s.lokalizacjaId, (ile.get(s.lokalizacjaId) || 0) + 1));

  const wiersze = l =>
    '<a class="poz" href="#/lokalizacja/' + l.id + '"><div class="tre">' +
    '<div class="tyt">' + h(l.nazwa || l.kod) +
    (l.punkt ? ' <span class="znacz ok">punkt</span>' : '') + '</div>' +
    '<div class="pod">' +
    [l.miasto, l.ulica, l.budynek, l.pietro, l.kod].filter(Boolean).map(h).join(' · ') +
    (l.kierowca ? ' · 🚚 ' + h(l.kierowca) : '') +
    (l.osoba ? ' · ' + h(l.osoba) : '') + '</div></div>' +
    '<div class="licz">' + (ile.get(l.id) || 0) + '<small>szt.</small></div></a>';

  const zakl = [['', 'Wszystkie (' + wszystkie.length + ')'],
                ['punkty', 'Punkty (' + punktow + ')'],
                ['pokoje', 'Pomieszczenia (' + (wszystkie.length - punktow) + ')']];

  return {
    tytul: 'Pomieszczenia i punkty', wstecz: true,
    html:
      '<div class="filtry">' + zakl.map(([k, n]) =>
        '<button type="button" data-f="' + k + '"' + (filtr === k ? ' class="akt"' : '') +
        '>' + n + '</button>').join('') + '</div>' +
      (wszystkie.length > 8
        ? '<div class="szukaj"><input id="ql" type="search" autocomplete="off" ' +
          'placeholder="Szukaj: nazwa, kod, miasto, kierowca"></div>' : '') +
      (lista.length
        ? '<div class="lista" id="wyniki-l">' + lista.map(wiersze).join('') + '</div>'
        : pusto('▢', filtr ? 'Nic tu nie ma — sprawdź inną zakładkę.'
                           : 'Brak pomieszczeń. Dodaj pierwsze — to podstawa całej ewidencji.')) +
      '<button class="b glowny" id="nowa">+ Nowe pomieszczenie / punkt</button>' +
      '<a class="b" href="#/import">⤒ Wczytaj listę punktów z Excela</a>',
    po: () => {
      $('#nowa').onclick = () => location.hash = '#/lokalizacja/nowa';
      widok().querySelectorAll('.filtry button[data-f]').forEach(b => {
        b.onclick = () => location.hash = '#/lokalizacje' + (b.dataset.f ? '?f=' + b.dataset.f : '');
      });
      const q = $('#ql');
      if (q && $('#wyniki-l')) q.oninput = () => {
        const f = q.value.trim();
        const w = f ? lista.filter(l => pasuje(l.nazwa, f) || pasuje(l.kod, f) ||
          pasuje(l.miasto, f) || pasuje(l.ulica, f) || pasuje(l.kierowca, f)) : lista;
        $('#wyniki-l').innerHTML = w.map(wiersze).join('');
      };
    }
  };
}
