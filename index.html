<style>
/* ------------------------------------------------------------------
   Magazyn — style. Mobile first, jasny i ciemny motyw z systemu.
   ------------------------------------------------------------------ */
:root{
  --bg:#f2f4f7; --pow:#ffffff; --pow2:#eef1f6; --linia:#dde2ea;
  --tx:#161a20; --tx2:#5d6673; --akc:#2f5597; --akc-tx:#ffffff;
  --ok:#1a7f37; --zle:#c0392b; --uw:#b06000;
  --ok-tlo:#e6f4ea; --zle-tlo:#fdeceb; --uw-tlo:#fdf3e2;
  --cien:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116; --pow:#171b22; --pow2:#1e232c; --linia:#2a3038;
    --tx:#e7eaf0; --tx2:#98a2b3; --akc:#5b8def; --akc-tx:#0b1220;
    --ok:#4ec97a; --zle:#ff7b6b; --uw:#e5a03a;
    --ok-tlo:#10291a; --zle-tlo:#2c1512; --uw-tlo:#2a2010;
    --cien:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;
}
body.bez-scrolla{overflow:hidden}

/* ---------- układ ---------- */
#ekran{display:flex;flex-direction:column;min-height:100dvh}
#gora{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:var(--akc);color:#fff;box-shadow:var(--cien);
}
#gora h1{flex:1;margin:0;font-size:18px;font-weight:650;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gora button{
  background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:9px;
  font:inherit;font-size:15px;font-weight:600;padding:7px 12px;cursor:pointer;flex:none;
}
#gora button:active{background:rgba(255,255,255,.3)}
#wstecz{font-size:19px;padding:5px 12px}

#widok{flex:1;padding:12px 12px 88px;max-width:760px;width:100%;margin:0 auto}

#dol{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--pow);border-top:1px solid var(--linia);
  padding-bottom:env(safe-area-inset-bottom);
}
#dol a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 1px 8px;font-size:10.5px;font-weight:600;
  color:var(--tx2);text-decoration:none;text-align:center;
  white-space:nowrap;overflow:hidden;
}
#dol a .ikn{font-size:19px;line-height:1}
#dol a.akt{color:var(--akc)}

/* ---------- elementy ---------- */
.karta{background:var(--pow);border:1px solid var(--linia);border-radius:var(--r);
  padding:14px;margin-bottom:10px;box-shadow:var(--cien)}
.karta h2{margin:0 0 8px;font-size:15px;font-weight:650}
.karta p{margin:0;color:var(--tx2);font-size:14px}

.kafle{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kafel{
  display:flex;flex-direction:column;gap:5px;background:var(--pow);
  border:1px solid var(--linia);border-radius:var(--r);padding:15px 13px;
  text-decoration:none;color:var(--tx);box-shadow:var(--cien);
  font-size:14.5px;font-weight:600;min-height:86px;justify-content:center;
}
.kafel .ikn{font-size:23px;line-height:1}
.kafel small{display:block;font-weight:400;color:var(--tx2);font-size:12.5px;line-height:1.3}
.kafel:active{background:var(--pow2)}
.kafel.mocny{background:var(--akc);border-color:var(--akc);color:#fff}
.kafel.mocny small{color:rgba(255,255,255,.85)}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--pow);border:1px solid var(--linia);border-radius:12px;
  padding:11px 8px;text-align:center;box-shadow:var(--cien)}
.stat b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--tx2)}

.alert{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:14px;
  border:1px solid transparent;display:flex;gap:10px;align-items:flex-start}
.alert.uw{background:var(--uw-tlo);border-color:var(--uw);color:var(--uw)}
.alert.zle{background:var(--zle-tlo);border-color:var(--zle);color:var(--zle)}
.alert.ok{background:var(--ok-tlo);border-color:var(--ok);color:var(--ok)}
.alert b{display:block;margin-bottom:2px}
.alert a{color:inherit;font-weight:700}

/* listy */
.lista{background:var(--pow);border:1px solid var(--linia);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--cien);margin-bottom:10px}
.poz{display:flex;align-items:center;gap:11px;padding:12px 13px;
  border-bottom:1px solid var(--linia);text-decoration:none;color:inherit;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;
  font:inherit;text-align:left;cursor:pointer}
.poz:last-child{border-bottom:0}
.poz:active{background:var(--pow2)}
.poz .tre{flex:1;min-width:0}
.poz .tyt{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poz .pod{font-size:12.5px;color:var(--tx2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poz .licz{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
  text-align:right;flex:none;min-width:56px}
.poz .licz small{display:block;font-weight:400;font-size:11px;color:var(--tx2)}
.poz.brak .licz{color:var(--zle)}
.znacz{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  font-weight:700;background:var(--pow2);color:var(--tx2);vertical-align:middle}
.znacz.zle{background:var(--zle-tlo);color:var(--zle)}
.znacz.ok{background:var(--ok-tlo);color:var(--ok)}
.znacz.uw{background:var(--uw-tlo);color:var(--uw)}

.pusto{text-align:center;color:var(--tx2);font-size:14px;padding:34px 18px;line-height:1.6}
.pusto .duzy{font-size:34px;display:block;margin-bottom:8px;opacity:.4}

/* formularze */
label{display:block;margin-bottom:11px}
label .et{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:4px}
input,select,textarea{
  width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:11px;
  border:1px solid var(--linia);background:var(--pow);color:var(--tx);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--akc);outline-offset:-1px;border-color:var(--akc)}
textarea{min-height:76px;resize:vertical}
.rzad{display:flex;gap:9px}
.rzad>*{flex:1;min-width:0}
.zkodem{display:flex;gap:8px;align-items:flex-end}
.zkodem>label{flex:1;margin-bottom:0}
.zkodem>button{flex:none}
label.ptak{display:flex;align-items:center;gap:10px;padding:11px 12px;
  border:1px solid var(--linia);border-radius:11px;background:var(--pow)}
label.ptak input{width:20px;height:20px;flex:none}
label.ptak .et{margin:0;font-size:14.5px;color:var(--tx);font-weight:500}

button.b,a.b{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:inherit;font-size:15px;font-weight:650;padding:13px 16px;border-radius:12px;
  border:1px solid var(--linia);background:var(--pow);color:var(--tx);
  cursor:pointer;text-decoration:none;width:100%;margin-bottom:9px;
}
button.b.glowny,a.b.glowny{background:var(--akc);border-color:var(--akc);color:#fff}
button.b.zly,a.b.zly{background:var(--zle-tlo);border-color:var(--zle);color:var(--zle)}
button.b.maly{width:auto;padding:9px 13px;font-size:14px;margin:0}
button.b:active,a.b:active{opacity:.75}
button.b:disabled{opacity:.45;cursor:default}
.przyciski{display:flex;gap:9px}
.przyciski>*{flex:1;margin-bottom:9px}

.szukaj{position:relative;margin-bottom:10px}
.szukaj input{padding-left:38px}
.szukaj::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--tx2);font-size:19px;pointer-events:none}

.filtry{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filtry button{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 13px;
  border-radius:99px;border:1px solid var(--linia);background:var(--pow);color:var(--tx2);cursor:pointer}
.filtry button.akt{background:var(--akc);border-color:var(--akc);color:#fff}

.naglowek-sekcji{display:flex;align-items:center;justify-content:space-between;
  margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.4px}

.zdjecie{width:100%;border-radius:12px;margin-bottom:10px;display:block}
.qr-podglad{width:130px;height:130px;margin:0 auto 10px;display:block;background:#fff;
  border-radius:8px;padding:6px}

/* skaner */
.skaner{position:fixed;inset:0;z-index:80;background:#000;display:none;
  flex-direction:column;color:#fff}
.skaner.on{display:flex}
.skaner-pasek{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:#000}
.skaner-pasek button{background:rgba(255,255,255,.15);border:0;color:#fff;
  font-size:18px;border-radius:9px;padding:7px 13px;cursor:pointer}
.skaner-pasek .skaner-latarka.wl{background:#f5c518;color:#000}
.skaner-tytul{flex:1;font-weight:650;font-size:16px}
.skaner-scena{flex:1;position:relative;overflow:hidden}
.skaner-scena video{width:100%;height:100%;object-fit:cover}
.skaner-ramka{position:absolute;left:8%;right:8%;top:50%;height:150px;
  transform:translateY(-50%);border:2px solid rgba(255,255,255,.9);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.skaner-info{padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
  background:#000;font-size:14.5px;text-align:center;min-height:56px}

/* modal */
.modal{position:fixed;inset:0;z-index:88;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.modal-tlo{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal-okno{position:relative;background:var(--pow);border-radius:18px 18px 0 0;
  width:100%;max-width:520px;max-height:86dvh;overflow:auto;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:560px){
  .modal{align-items:center}
  .modal-okno{border-radius:18px;max-height:80dvh}
}
.modal-okno h2{margin:0 0 12px;font-size:17px;font-weight:650}
#modal-przyciski{display:flex;gap:9px;margin-top:14px}
#modal-przyciski>*{flex:1;margin:0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);
  transform:translate(-50%,20px);z-index:95;background:#111827;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;
  max-width:88vw;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* szybka notatka na pulpicie */
.karta-notatka h2{margin-bottom:9px}
.notatka-rzad{display:flex;gap:8px;align-items:flex-start}
.notatka-rzad textarea{flex:1;min-height:46px;padding:11px 12px;resize:none;overflow:hidden}
.notatka-rzad button{flex:none;align-self:stretch}
.karta-notatka p a{color:var(--akc);font-weight:600}

/* pasek aktualizacji */
#pasek-akt{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 66px);
  z-index:60;display:flex;align-items:center;gap:10px;background:var(--akc);color:#fff;
  padding:11px 12px 11px 15px;border-radius:13px;font-size:14px;font-weight:600;
  box-shadow:0 6px 18px rgba(16,24,40,.28)}
#pasek-akt span{flex:1}
#pasek-akt button{flex:none;background:#fff;color:var(--akc);border:0;border-radius:9px;
  font:inherit;font-size:14px;font-weight:700;padding:9px 13px;cursor:pointer}

/* wydruk */
#wydruk{position:fixed;inset:0;z-index:100;background:#fff;color:#000;overflow:auto;
  padding-bottom:40px}
.wydruk-pasek{position:sticky;top:0;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:#111827;color:#fff}
.wydruk-pasek span{flex:1;font-weight:650;font-size:15px}
.wydruk-pasek button{background:rgba(255,255,255,.18);border:0;color:#fff;
  font:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:9px 13px;cursor:pointer}
.wydruk-pasek button.glowny{background:#fff;color:#111827}
.wydruk-tresc{padding:10px;overflow:hidden}
.wydruk-skala{transform-origin:top left}
.wydruk-uwaga{background:#fef3c7;color:#7c4a03;font-size:12.5px;padding:8px 12px;
  text-align:center;border-bottom:1px solid #f0d68a}
body.tryb-wydruku #ekran{display:none}
@media print{
  .no-print{display:none !important}
  #wydruk{position:static;padding:0}
  .wydruk-tresc{padding:0;height:auto !important;overflow:visible}
  .wydruk-skala{transform:none !important}
  body{background:#fff}
}

<script>
/* Rejestr błędów. Musi ruszyć przed resztą kodu, żeby złapać także błędy
   powstałe przy ładowaniu. Trzymamy go w localStorage, bo ma działać nawet
   wtedy, gdy zawiedzie główna baza danych. */
window.BLEDY = [];
(function () {
  var KLUCZ = 'magazyn-bledy';
  try {
    var stare = localStorage.getItem(KLUCZ);
    if (stare) window.BLEDY = JSON.parse(stare).slice(-20);
  } catch (e) {}
  function zapisz(w) {
    try {
      window.BLEDY.push(w);
      while (window.BLEDY.length > 20) window.BLEDY.shift();
      localStorage.setItem(KLUCZ, JSON.stringify(window.BLEDY));
    } catch (e) {}
  }
  function stos(x) {
    return (x && x.stack) ? String(x.stack).split('\n').slice(0, 3).join(' | ') : '';
  }
  addEventListener('error', function (e) {
    zapisz({
      kiedy: new Date().toISOString(),
      rodzaj: e.target && e.target.src ? 'ladowanie' : 'blad',
      tekst: String(e.message || (e.target && e.target.src) || e.type),
      miejsce: (String(e.filename || '').split('/').pop() || '') + (e.lineno ? ':' + e.lineno : ''),
      stos: stos(e.error),
      ekran: location.hash || '#/'
    });
  }, true);
  addEventListener('unhandledrejection', function (e) {
    zapisz({
      kiedy: new Date().toISOString(),
      rodzaj: 'obietnica',
      tekst: String((e.reason && e.reason.message) || e.reason),
      stos: stos(e.reason),
      ekran: location.hash || '#/'
    });
  });
  window.wyczyscBledy = function () {
    window.BLEDY = [];
    try { localStorage.removeItem(KLUCZ); } catch (e) {}
  };
})();
</script>

/* ------------------------------------------------------------------
   xlsx.js — zapis plików Excel bez zewnętrznych bibliotek.
   Buduje archiwum ZIP (bez kompresji) z plikami XML formatu XLSX.

(function (global) {
'use strict';

/* ---------- CRC32 ---------- */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

    lv.setUint32(22, rozmiar, true);
    lv.setUint16(26, nazwa.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nazwa, 30);
    lokalne.push(lh, p.dane);

    const ch = new Uint8Array(46 + nazwa.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, rozmiar, true);
    cv.setUint32(24, rozmiar, true);
    cv.setUint16(28, nazwa.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nazwa, 46);
    centralne.push(ch);

    offset += lh.length + rozmiar;
  }

  const dlCentral = centralne.reduce((s, c) => s + c.length, 0);
  const koniec = new Uint8Array(22);
  const kv = new DataView(koniec.buffer);
  kv.setUint32(0, 0x06054b50, true);
  kv.setUint16(8, pliki.length, true);
  kv.setUint16(10, pliki.length, true);
  kv.setUint32(12, dlCentral, true);
  kv.setUint32(16, offset, true);

  return new Blob([...lokalne, ...centralne, koniec],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---------- pomocnicze ---------- */
const enc = new TextEncoder();
const bin = s => enc.encode(s);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]))
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}
function kolLitera(n) {                     // 0 -> A, 26 -> AA
  let s = '';
  n++;
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }
  return s;
}
function serialData(d) {                    // Date -> numer seryjny Excela
  if (!(d instanceof Date) || isNaN(d)) return null;
  const dni = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30);
  const ulamek = (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400;
  return dni / 86400000 + ulamek;
}

/* ---------- style ---------- */
/* indeksy cellXfs:
   0 zwykły · 1 nagłówek · 2 data · 3 kwota · 4 liczba całkowita
   5 ostrzeżenie(tekst) · 6 ostrzeżenie(liczba) · 7 ostrzeżenie(kwota)
   8 pogrubiony · 9 pogrubiona liczba · 10 pogrubiona kwota · 11 data+godzina */
const STYLE_XML =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3">
<numFmt numFmtId="164" formatCode="dd\\.mm\\.yyyy"/>
<numFmt numFmtId="165" formatCode="#,##0.00"/>
<numFmt numFmtId="166" formatCode="dd\\.mm\\.yyyy\\ hh:mm"/>
</numFmts>
<fonts count="3">
<font><sz val="11"/><name val="Calibri"/></font>

</fonts>
<fills count="5">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF2F5597"/><bgColor indexed="64"/></patternFill></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFFFD5D5"/><bgColor indexed="64"/></patternFill></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFD4EDDA"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="2">
<border><left/><right/><top/><bottom/><diagonal/></border>
<border><left/><right/><top/><bottom style="thin"><color rgb="FF9BB5DE"/></bottom><diagonal/></border>
</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="15">

<xf numFmtId="0"   fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="1"   fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0"   fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1"/>
<xf numFmtId="1"   fontId="0" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFill="1"/>
<xf numFmtId="165" fontId="0" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFill="1"/>
<xf numFmtId="0"   fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="1"   fontId="2" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>
<xf numFmtId="165" fontId="2" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>
<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0"   fontId="0" fillId="4" borderId="0" xfId="0" applyFill="1"/>
<xf numFmtId="1"   fontId="0" fillId="4" borderId="0" xfId="0" applyNumberFormat="1" applyFill="1"/>

const ST = { ZWYKLY: 0, NAGL: 1, DATA: 2, KWOTA: 3, LICZBA: 4,
             OSTRZ: 5, OSTRZ_L: 6, OSTRZ_K: 7,
             POGR: 8, POGR_L: 9, POGR_K: 10, DATAGODZ: 11,
             OK: 12, OK_L: 13, OK_K: 14 };

/* typ kolumny -> styl: zwykły / ostrzeżenie / podsumowanie / potwierdzenie */
const TYPY = {
  txt:  [ST.ZWYKLY, ST.OSTRZ,   ST.POGR,   ST.OK],
  int:  [ST.LICZBA, ST.OSTRZ_L, ST.POGR_L, ST.OK_L],
  zl:   [ST.KWOTA,  ST.OSTRZ_K, ST.POGR_K, ST.OK_K],
  data: [ST.DATA,   ST.DATA,    ST.DATA,   ST.DATA],
  czas: [ST.DATAGODZ, ST.DATAGODZ, ST.DATAGODZ, ST.DATAGODZ]
};

/* ---------- budowa arkusza ---------- */
function arkuszXml(a) {
  const kol = a.kolumny;
  const W = [];

  W.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  W.push('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">');
  W.push('<sheetViews><sheetView workbookViewId="0">' +
    '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
    '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/>' +
    '</sheetView></sheetViews>');
  W.push('<sheetFormatPr defaultRowHeight="15"/>');

  W.push('<cols>');
  kol.forEach((c, i) => W.push('<col min="' + (i + 1) + '" max="' + (i + 1) +
    '" width="' + (c.w || 14) + '" customWidth="1"/>'));
  W.push('</cols>');

  W.push('<sheetData>');

  // nagłówek
  W.push('<row r="1" ht="28" customHeight="1">');
  kol.forEach((c, i) => W.push('<c r="' + kolLitera(i) + '1" s="' + ST.NAGL +
    '" t="inlineStr"><is><t xml:space="preserve">' + esc(c.n) + '</t></is></c>'));
  W.push('</row>');

  // dane
  const wiersze = a.wiersze || [];
  wiersze.forEach((w, ri) => {
    const nr = ri + 2;
    const alarm = a.podswietl ? !!a.podswietl(w, ri) : false;
    W.push('<row r="' + nr + '">');
    kol.forEach((c, ci) => {
      const v = w[ci];
      if (v === null || v === undefined || v === '') return;
      const typ = TYPY[c.t || 'txt'] || TYPY.txt;
      const s = (a.zielone && a.zielone(w, ri, ci)) ? typ[3] : (alarm ? typ[1] : typ[0]);
      const ref = kolLitera(ci) + nr;
      if (c.t === 'data' || c.t === 'czas') {
        const d = (v instanceof Date) ? v : new Date(v);
        const n = serialData(d);
        if (n === null) return;
        W.push('<c r="' + ref + '" s="' + s + '"><v>' + n + '</v></c>');
      } else if (c.t === 'int' || c.t === 'zl') {
        const n = Number(v);
        if (!isFinite(n)) return;
        W.push('<c r="' + ref + '" s="' + s + '"><v>' + n + '</v></c>');
      } else {
        W.push('<c r="' + ref + '" s="' + s + '" t="inlineStr"><is><t xml:space="preserve">' +
          esc(v) + '</t></is></c>');
      }
    });
    W.push('</row>');
  });

  // wiersz sum
  if (a.sumy && a.sumy.length && wiersze.length) {
    const nr = wiersze.length + 2;
    W.push('<row r="' + nr + '">');
    kol.forEach((c, ci) => {
      const ref = kolLitera(ci) + nr;
      if (ci === 0) {
        W.push('<c r="' + ref + '" s="' + ST.POGR + '" t="inlineStr">' +
          '<is><t>RAZEM</t></is></c>');
      } else if (a.sumy.includes(ci)) {
        const typ = TYPY[c.t || 'txt'] || TYPY.txt;
        const zakres = kolLitera(ci) + '2:' + kolLitera(ci) + (nr - 1);
        W.push('<c r="' + ref + '" s="' + typ[2] + '"><f>SUM(' + zakres + ')</f></c>');
      }
    });
    W.push('</row>');
  }

  W.push('</sheetData>');
  if (wiersze.length)
    W.push('<autoFilter ref="A1:' + kolLitera(kol.length - 1) + (wiersze.length + 1) + '"/>');
  W.push('<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>');
  W.push('</worksheet>');
  return W.join('');
}

/* ---------- złożenie skoroszytu ---------- */
function zbuduj(arkusze, meta) {
  meta = meta || {};
  const n = arkusze.length;
  const pliki = [];

  let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>';
  for (let i = 1; i <= n; i++)
    ct += '<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  ct += '</Types>';
  pliki.push({ nazwa: '[Content_Types].xml', dane: bin(ct) });

  pliki.push({ nazwa: '_rels/.rels', dane: bin(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    '</Relationships>') });

  const teraz = (meta.data || new Date()).toISOString().replace(/\.\d+Z$/, 'Z');
  pliki.push({ nazwa: 'docProps/core.xml', dane: bin(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
    '<dc:title>' + esc(meta.tytul || 'Raport magazynowy') + '</dc:title>' +
    '<dc:creator>' + esc(meta.autor || 'Magazyn') + '</dc:creator>' +
    '<cp:lastModifiedBy>' + esc(meta.autor || 'Magazyn') + '</cp:lastModifiedBy>' +
    '<dcterms:created xsi:type="dcterms:W3CDTF">' + teraz + '</dcterms:created>' +
    '<dcterms:modified xsi:type="dcterms:W3CDTF">' + teraz + '</dcterms:modified>' +
    '</cp:coreProperties>') });

  let wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  arkusze.forEach((a, i) => {
    const nazwa = String(a.nazwa).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);
    wb += '<sheet name="' + esc(nazwa) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
  });
  wb += '</sheets></workbook>';
  pliki.push({ nazwa: 'xl/workbook.xml', dane: bin(wb) });

  let rel = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  arkusze.forEach((a, i) => {
    rel += '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
  });
  rel += '<Relationship Id="rId' + (n + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  rel += '</Relationships>';
  pliki.push({ nazwa: 'xl/_rels/workbook.xml.rels', dane: bin(rel) });

  pliki.push({ nazwa: 'xl/styles.xml', dane: bin(STYLE_XML) });

  arkusze.forEach((a, i) =>
    pliki.push({ nazwa: 'xl/worksheets/sheet' + (i + 1) + '.xml', dane: bin(arkuszXml(a)) }));

  return zip(pliki);
}

global.XLS = { zbuduj, zip, crc32 };

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/db.js ===== */
/* ------------------------------------------------------------------
   db.js — baza danych w telefonie (IndexedDB) + model danych.
   Całość mieści się w pamięci (do kilku tysięcy rekordów), IndexedDB
   służy jako trwały zapis. Każdy rekord ma UUID i znaczniki czasu,
   żeby dało się w przyszłości dołożyć synchronizację między urządzeniami.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

const NAZWA_BAZY = 'magazyn';
const WERSJA = 4;

const STORY = {
  produkty:    { idx: ['ean', 'indeks'] },
  lokalizacje: { idx: ['kodKresk'] },
  dokumenty:   { idx: ['typ', 'data'] },
  sprzet:      { idx: ['kodKresk', 'nrInw', 'lokalizacjaId'] },
  ruchy:       { idx: ['sprzetId'] },
  spisy:       { idx: [] },
  partie:      { idx: [] },
  zamowienia:  { idx: ['partiaId', 'kierowca', 'miasto', 'status'] },
  przekazania: { idx: ['lokalizacjaId'] },
  notatki:     { idx: [] },
  ustawienia:  { idx: [], klucz: 'k' }
};

let baza = null;

/* dane w pamięci */
const D = {
  produkty: [], lokalizacje: [], dokumenty: [], sprzet: [], ruchy: [], spisy: [],
  partie: [], zamowienia: [], przekazania: [], notatki: [],
  ust: {}
};

const USTAWIENIA_DOMYSLNE = {
  firma: '',
  prefiksInw: 'INW',
  przypomnijPoDniach: 7,
  przypomnijPoOperacjach: 50,
  ostatniaKopia: null,
  operacjiOdKopii: 0
};

/* ---------- narzędzia ---------- */
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
const teraz = () => new Date().toISOString();

/* ---------- otwarcie ---------- */
function otworz() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(NAZWA_BAZY, WERSJA);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      for (const [n, cfg] of Object.entries(STORY)) {
        if (db.objectStoreNames.contains(n)) continue;
        const s = db.createObjectStore(n, { keyPath: cfg.klucz || 'id' });
        (cfg.idx || []).forEach(i => s.createIndex(i, i, { unique: false }));
      }
    };
    r.onsuccess = e => { baza = e.target.result; res(baza); };
    r.onerror = () => rej(r.error || new Error('Nie udało się otworzyć bazy danych'));
  });
}

function wszystko(store) {
  return new Promise((res, rej) => {
    const t = baza.transaction(store, 'readonly');
    const q = t.objectStore(store).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
}

function zapiszSurowo(store, obiekty) {
  return new Promise((res, rej) => {
    const t = baza.transaction(store, 'readwrite');
    const s = t.objectStore(store);
    (Array.isArray(obiekty) ? obiekty : [obiekty]).forEach(o => s.put(o));
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
  });
}

function wyczyscStore(store) {
  return new Promise((res, rej) => {
    const t = baza.transaction(store, 'readwrite');
    t.objectStore(store).clear();
    t.oncomplete = res;
    t.onerror = () => rej(t.error);
  });
}

/* ---------- wczytanie do pamięci ---------- */
async function wczytaj() {
  const nazwy = ['produkty', 'lokalizacje', 'dokumenty', 'sprzet', 'ruchy', 'spisy',
                 'partie', 'zamowienia', 'przekazania', 'notatki'];
  const dane = await Promise.all(nazwy.map(wszystko));
  nazwy.forEach((n, i) => { D[n] = dane[i]; });
  const u = await wszystko('ustawienia');
  D.ust = Object.assign({}, USTAWIENIA_DOMYSLNE);
  u.forEach(x => { D.ust[x.k] = x.v; });
  return D;
}

/* ---------- zapis rekordu ---------- */
async function zapisz(store, rek, liczOperacje) {
  if (!rek.id) { rek.id = uuid(); rek.utw = teraz(); }
  rek.zm = teraz();
  const lista = D[store];
  const i = lista.findIndex(x => x.id === rek.id);
  if (i >= 0) lista[i] = rek; else lista.push(rek);
  await zapiszSurowo(store, rek);
  if (liczOperacje !== false) await licznikOperacji();
  return rek;
}

/* Zapis wielu rekordów w jednej transakcji. Przy 250 zamówieniach różnica
   między tym a zapisem po jednym to sekundy zamiast dziesiątek sekund. */
async function zapiszWiele(store, rekordy) {
  if (!rekordy || !rekordy.length) return [];
  const lista = D[store];
  const indeks = new Map(lista.map((x, i) => [x.id, i]));
  for (const rek of rekordy) {
    if (!rek.id) { rek.id = uuid(); rek.utw = teraz(); }
    rek.zm = teraz();
    const i = indeks.get(rek.id);
    if (i != null) lista[i] = rek; else { indeks.set(rek.id, lista.length); lista.push(rek); }
  }
  await zapiszSurowo(store, rekordy);
  return rekordy;
}

/* kasowanie miękkie — rekord zostaje, żeby dało się to zsynchronizować */
async function usun(store, id) {
  const rek = D[store].find(x => x.id === id);
  if (!rek) return;
  rek.usuniety = true;
  rek.zm = teraz();
  await zapiszSurowo(store, rek);
  await licznikOperacji();
}

async function ustaw(k, v) {
  D.ust[k] = v;
  await zapiszSurowo('ustawienia', { k, v });
}

async function licznikOperacji() {
  await ustaw('operacjiOdKopii', (D.ust.operacjiOdKopii || 0) + 1);
}

/* ---------- widoki na dane ---------- */
const zywe = lista => lista.filter(x => !x.usuniety);

const produkty    = () => zywe(D.produkty);
const lokalizacje = () => zywe(D.lokalizacje);
const sprzety     = () => zywe(D.sprzet);
const dokumenty   = () => zywe(D.dokumenty);
const partie      = () => zywe(D.partie);
const zamowienia  = () => zywe(D.zamowienia);
const przekazania = () => zywe(D.przekazania);
const notatki     = () => zywe(D.notatki);

/* stan magazynowy liczony z dokumentów — nigdy nie trzymany jako pole */
function stany() {
  const m = new Map();
  for (const dok of D.dokumenty) {
    if (dok.usuniety) continue;
    const znak = dok.typ === 'PZ' ? 1 : dok.typ === 'RW' ? -1 : 1;  // KOR ma ilości ze znakiem
    for (const p of (dok.pozycje || [])) {
      const il = Number(p.ilosc) || 0;
      m.set(p.produktId, (m.get(p.produktId) || 0) + il * znak);
    }
  }
  return m;
}

function ostatnieDostawy() {
  const m = new Map();
  for (const dok of D.dokumenty) {
    if (dok.usuniety || dok.typ !== 'PZ') continue;
    for (const p of (dok.pozycje || [])) {
      const b = m.get(p.produktId);
      if (!b || (dok.data || '') > b) m.set(p.produktId, dok.data);
    }
  }
  return m;
}

/* pozycje poniżej stanu minimalnego */
function braki() {
  const s = stany();
  return produkty()
    .map(p => ({ produkt: p, stan: s.get(p.id) || 0, min: Number(p.stanMin) || 0 }))
    .filter(x => x.min > 0 && x.stan < x.min)
    .map(x => Object.assign(x, { brakuje: x.min - x.stan }))
    .sort((a, b) => b.brakuje - a.brakuje);
}

/* ---------- numeracja ---------- */
function nastepnyNumer(typ) {
  const rok = new Date().getFullYear();
  const pas = typ + '/' + rok + '/';
  let max = 0;
  for (const d of D.dokumenty) {
    if (d.typ !== typ || !d.numer || !d.numer.startsWith(pas)) continue;
    const n = parseInt(d.numer.slice(pas.length), 10);
    if (n > max) max = n;
  }
  return pas + String(max + 1).padStart(4, '0');
}

function nastepnyNrInw() {
  const pref = (D.ust.prefiksInw || 'INW').toUpperCase();
  const rok = new Date().getFullYear();
  const pas = pref + '-' + rok + '-';
  let max = 0;
  for (const s of D.sprzet) {
    if (!s.nrInw || !s.nrInw.startsWith(pas)) continue;
    const n = parseInt(s.nrInw.slice(pas.length), 10);
    if (n > max) max = n;
  }
  return pas + String(max + 1).padStart(5, '0');
}

/* ---------- wyszukiwanie po kodzie kreskowym ---------- */
function poKodzie(kod) {
  const k = String(kod).trim();
  const lok = lokalizacje().find(l => l.kodKresk === k);
  if (lok) return { rodzaj: 'lokalizacja', obiekt: lok };
  const spr = sprzety().find(s => s.kodKresk === k || s.nrInw === k);
  if (spr) return { rodzaj: 'sprzet', obiekt: spr };
  const pro = produkty().find(p => p.ean === k) ||
              produkty().find(p => p.indeks && p.indeks.toUpperCase() === k.toUpperCase());
  if (pro) return { rodzaj: 'produkt', obiekt: pro };
  return { rodzaj: 'nieznany', kod: k };
}

/* ---------- przeniesienie sprzętu ---------- */
async function przenies(sprzetId, doLokId, kto, powod) {
  const s = D.sprzet.find(x => x.id === sprzetId);
  if (!s) return null;
  const zId = s.lokalizacjaId || null;
  if (zId === doLokId) return null;
  s.lokalizacjaId = doLokId;
  await zapisz('sprzet', s, false);
  const ruch = { id: uuid(), utw: teraz(), zm: teraz(), sprzetId, zId,
                 doId: doLokId, data: teraz(), kto: kto || '', powod: powod || '' };
  D.ruchy.push(ruch);
  await zapiszSurowo('ruchy', ruch);
  await licznikOperacji();
  return ruch;
}

/* ---------- kopia zapasowa ---------- */
function kopia() {
  return {
    format: 'magazyn-kopia',
    wersja: 1,
    data: teraz(),
    dane: {
      produkty: D.produkty, lokalizacje: D.lokalizacje, dokumenty: D.dokumenty,
      sprzet: D.sprzet, ruchy: D.ruchy, spisy: D.spisy,
      partie: D.partie, zamowienia: D.zamowienia, przekazania: D.przekazania,
      notatki: D.notatki,
      ustawienia: Object.entries(D.ust).map(([k, v]) => ({ k, v }))
    }
  };
}

async function przywroc(obj, scalaj) {
  if (!obj || obj.format !== 'magazyn-kopia') throw new Error('To nie jest plik kopii zapasowej.');
  const d = obj.dane || {};
  const nazwy = ['produkty', 'lokalizacje', 'dokumenty', 'sprzet', 'ruchy', 'spisy',
                 'partie', 'zamowienia', 'przekazania', 'notatki'];
  for (const n of nazwy) {
    const przych = d[n] || [];
    if (!scalaj) {
      await wyczyscStore(n);
      D[n] = przych.slice();
      if (D[n].length) await zapiszSurowo(n, D[n]);
    } else {
      const mapa = new Map(D[n].map(x => [x.id, x]));
      for (const rek of przych) {
        const stary = mapa.get(rek.id);
        if (!stary || (rek.zm || '') > (stary.zm || '')) mapa.set(rek.id, rek);
      }
      D[n] = [...mapa.values()];
      await wyczyscStore(n);
      if (D[n].length) await zapiszSurowo(n, D[n]);
    }
  }
  if (d.ustawienia && !scalaj) {
    await wyczyscStore('ustawienia');
    D.ust = Object.assign({}, USTAWIENIA_DOMYSLNE);
    for (const { k, v } of d.ustawienia) { D.ust[k] = v; }
    await zapiszSurowo('ustawienia', d.ustawienia);
  }
  await ustaw('operacjiOdKopii', 0);
}

function kopiaPotrzebna() {
  const ops = D.ust.operacjiOdKopii || 0;
  if (ops >= (D.ust.przypomnijPoOperacjach || 50)) return 'operacje';
  const ost = D.ust.ostatniaKopia;
  if (!ost) return ops > 0 ? 'nigdy' : null;
  const dni = (Date.now() - new Date(ost).getTime()) / 86400000;
  if (dni >= (D.ust.przypomnijPoDniach || 7) && ops > 0) return 'dni';
  return null;
}

/* ---------- start ---------- */
async function start() {
  await otworz();
  await wczytaj();
  if (navigator.storage && navigator.storage.persist) {
    try { if (!(await navigator.storage.persisted())) await navigator.storage.persist(); }
    catch (e) { /* nieistotne */ }
  }
  return D;
}

global.DB = {
  D, start, wczytaj, zapisz, zapiszWiele, usun, ustaw, uuid, teraz,
  produkty, lokalizacje, sprzety, dokumenty, partie, zamowienia, przekazania, notatki,
  stany, ostatnieDostawy, braki,
  nastepnyNumer, nastepnyNrInw, poKodzie, przenies,
  kopia, przywroc, kopiaPotrzebna
};

})(window);

</script>
<script>
/* ===== js/skaner.js ===== */
/* ------------------------------------------------------------------
   skaner.js — odczyt kodów kreskowych z aparatu.
   Silnik wbudowany w przeglądarkę (BarcodeDetector), a gdy go nie ma
   — zapasowy ZXing. Edge na Androidzie nie ma wbudowanego, więc
   zapasowy jest tam ścieżką podstawową.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

const FORMATY_WBUD = ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code', 'data_matrix'];

let detektor = null, zxing = null, silnik = null, gotowy = null;
let strumien = null, dziala = false, cbKod = null, ostatniKod = '', ostatniCzas = 0;
let elOverlay = null, elVideo = null, elTytul = null, elInfo = null, elLatarka = null;
const bufor = document.createElement('canvas');

/* ---------- przygotowanie silnika ---------- */
function przygotuj() {
  if (gotowy) return gotowy;
  gotowy = (async () => {
    if ('BarcodeDetector' in global) {
      try {
        const dost = await BarcodeDetector.getSupportedFormats();
        const ma = FORMATY_WBUD.filter(f => dost.includes(f));
        if (ma.length >= 2) {
          detektor = new BarcodeDetector({ formats: ma });
          silnik = 'wbudowany';
          return silnik;
        }
      } catch (e) { /* przechodzimy na zapasowy */ }
    }
    if (global.ZXing) {
      const h = new Map();
      h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX]);
      h.set(ZXing.DecodeHintType.TRY_HARDER, true);
      zxing = new ZXing.MultiFormatReader();
      zxing.setHints(h);
      silnik = 'zapasowy';
      return silnik;
    }
    silnik = null;
    throw new Error('Brak silnika odczytu kodów');
  })();
  return gotowy;
}

/* ---------- warstwa graficzna ---------- */
function zbudujOverlay() {
  if (elOverlay) return;
  elOverlay = document.createElement('div');
  elOverlay.className = 'skaner';
  elOverlay.innerHTML =
    '<div class="skaner-pasek">' +
      '<button class="skaner-zamknij" type="button" aria-label="Zamknij">✕</button>' +
      '<span class="skaner-tytul"></span>' +
      '<button class="skaner-latarka" type="button" aria-label="Latarka">🔦</button>' +
    '</div>' +
    '<div class="skaner-scena"><video playsinline muted></video><div class="skaner-ramka"></div></div>' +
    '<div class="skaner-info"></div>';
  document.body.appendChild(elOverlay);
  elVideo   = elOverlay.querySelector('video');
  elTytul   = elOverlay.querySelector('.skaner-tytul');
  elInfo    = elOverlay.querySelector('.skaner-info');
  elLatarka = elOverlay.querySelector('.skaner-latarka');
  elOverlay.querySelector('.skaner-zamknij').onclick = () => zamknij();
  elLatarka.onclick = przelaczLatarke;
}

async function przelaczLatarke() {
  if (!strumien) return;
  const t = strumien.getVideoTracks()[0];
  const mozliwosci = t.getCapabilities ? t.getCapabilities() : {};
  if (!mozliwosci.torch) { info('To urządzenie nie pozwala włączyć latarki.'); return; }
  const wl = !(t.getSettings().torch);
  try { await t.applyConstraints({ advanced: [{ torch: wl }] }); elLatarka.classList.toggle('wl', wl); }
  catch (e) { info('Nie udało się przełączyć latarki.'); }
}

function info(t) { if (elInfo) elInfo.textContent = t; }

/* ---------- odczyt ---------- */
function czytajZapasowym(v) {
  const MAX = 800;
  const skala = Math.min(1, MAX / Math.max(v.videoWidth || 1, 1));
  bufor.width  = Math.max(2, Math.round((v.videoWidth  || MAX) * skala));
  bufor.height = Math.max(2, Math.round((v.videoHeight || MAX) * skala));
  bufor.getContext('2d', { willReadFrequently: true })
       .drawImage(v, 0, 0, bufor.width, bufor.height);
  const zrodlo = new ZXing.HTMLCanvasElementLuminanceSource(bufor);
  const mapa = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(zrodlo));
  const w = zxing.decode(mapa);
  zxing.reset();
  return { kod: w.getText(), format: ZXing.BarcodeFormat[w.getBarcodeFormat()] };
}

function petla() {
  if (!dziala) return;
  /* Gdy nad skanerem jest otwarte okno dialogowe, wstrzymujemy odczyt.
     Przesuwamy przy tym znacznik ostatniego trafienia, żeby po zamknięciu okna
     ten sam kod nie wskoczył od razu drugi raz. */
  const m = document.getElementById('modal');
  if (m && !m.hidden) { petla._ost = performance.now(); requestAnimationFrame(petla); return; }
  const v = elVideo;
  const krok = detektor ? 100 : 220;
  const t = performance.now();
  if (t - ostatniCzas >= krok && v.videoWidth) {
    ostatniCzas = t;
    const obsluz = tr => {
      if (!tr) return;
      if (tr.kod === ostatniKod && t - (petla._ost || 0) < 2500) return;
      ostatniKod = tr.kod; petla._ost = t;
      if (navigator.vibrate) navigator.vibrate(50);
      info('Odczytano: ' + tr.kod);
      if (cbKod) cbKod(tr.kod, tr.format);
    };
    if (detektor) {
      detektor.detect(v)
        .then(k => { if (k && k.length) obsluz({ kod: k[0].rawValue, format: k[0].format }); })
        .catch(() => {});
    } else if (zxing) {
      try { obsluz(czytajZapasowym(v)); } catch (e) { /* brak kodu w kadrze */ }
    }
  }
  requestAnimationFrame(petla);
}

/* ---------- otwarcie / zamknięcie ---------- */
async function otworz(opcje) {
  opcje = opcje || {};
  zbudujOverlay();
  elTytul.textContent = opcje.tytul || 'Skanuj kod';
  info('Przygotowuję aparat…');
  elOverlay.classList.add('on');
  document.body.classList.add('bez-scrolla');
  cbKod = opcje.onKod || null;

  try { await przygotuj(); }
  catch (e) { info('Brak silnika odczytu kodów. Wpisz kod ręcznie.'); return; }

  try {
    strumien = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' },
               width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  } catch (e) {
    const powod = {
      NotAllowedError: 'Brak zgody na aparat. Kliknij kłódkę przy adresie strony i zezwól na aparat.',
      NotFoundError: 'Nie znaleziono aparatu w tym urządzeniu.',
      NotReadableError: 'Aparat jest zajęty przez inną aplikację.'
    }[e.name] || ('Błąd aparatu: ' + e.message);
    info(powod);
    return;
  }

  elVideo.srcObject = strumien;
  await elVideo.play().catch(() => {});
  const mozliwosci = strumien.getVideoTracks()[0].getCapabilities
    ? strumien.getVideoTracks()[0].getCapabilities() : {};
  elLatarka.style.display = mozliwosci.torch ? '' : 'none';
  info(opcje.podpowiedz || 'Przyłóż kod do ramki.');
  ostatniKod = ''; petla._ost = 0;
  dziala = true;
  requestAnimationFrame(petla);
}

function zamknij() {
  dziala = false;
  cbKod = null;
  if (strumien) { strumien.getTracks().forEach(t => t.stop()); strumien = null; }
  if (elVideo) elVideo.srcObject = null;
  if (elOverlay) elOverlay.classList.remove('on');
  document.body.classList.remove('bez-scrolla');
}

/* jednorazowy odczyt — zwraca kod albo null przy zamknięciu */
function jedenKod(opcje) {
  return new Promise(res => {
    let zwrocone = false;
    const o = Object.assign({}, opcje, {
      onKod: kod => { if (zwrocone) return; zwrocone = true; zamknij(); res(kod); }
    });
    otworz(o);
    const obs = new MutationObserver(() => {
      if (elOverlay && !elOverlay.classList.contains('on') && !zwrocone) {
        zwrocone = true; obs.disconnect(); res(null);
      }
    });
    obs.observe(elOverlay, { attributes: true, attributeFilter: ['class'] });
  });
}

function nazwaSilnika() { return silnik; }

global.Skaner = { otworz, zamknij, jedenKod, przygotuj, nazwaSilnika, info };
addEventListener('pagehide', zamknij);

})(window);

</script>
<script>
/* ===== js/wydruki.js ===== */
/* ------------------------------------------------------------------
   wydruki.js — protokoły i listy do druku albo do zapisania jako PDF.
   Drukujemy przez systemowe okno druku Androida, bez żadnej biblioteki PDF.

   Etykiet nie generujemy — kody na sprzęcie pochodzą z firmowego systemu
   ewidencji, aplikacja tylko je odczytuje.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

function escHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- ogólny wydruk ---------- */
function drukuj(tytul, styl, tresc, wskazowka) {
  const stary = document.getElementById('wydruk');
  if (stary) stary.remove();

  const d = document.createElement('div');
  d.id = 'wydruk';
  d.innerHTML =
    '<div class="wydruk-pasek no-print">' +
      '<button type="button" id="wydruk-zamknij">← Wróć</button>' +
      '<span>' + tytul + '</span>' +
      '<button type="button" id="wydruk-drukuj" class="glowny">Drukuj / PDF</button>' +
    '</div>' +
    '<div class="wydruk-uwaga no-print" hidden><span class="uw-skala">Podgląd pomniejszony ' +
      'do szerokości ekranu — wydruk wyjdzie w pełnym rozmiarze.</span>' +
      (wskazowka ? '<br>' + wskazowka : '') + '</div>' +
    '<style>' + styl + '</style>' +
    '<div class="wydruk-tresc"><div class="wydruk-skala">' + tresc + '</div></div>';
  document.body.appendChild(d);
  document.body.classList.add('tryb-wydruku');
  document.getElementById('wydruk-zamknij').onclick = () => {
    d.remove(); document.body.classList.remove('tryb-wydruku');
    removeEventListener('resize', dopasuj);
  };
  document.getElementById('wydruk-drukuj').onclick = () => global.print();

  /* Kartka A4 jest szersza niż telefon — na ekranie skalujemy ją do szerokości,
     a przy druku skalowanie znika (reguła @media print). */
  function dopasuj() {
    const poj = d.querySelector('.wydruk-tresc');
    const sk = d.querySelector('.wydruk-skala');
    if (!poj || !sk) return;
    sk.style.transform = 'none';
    poj.style.height = 'auto';
    const dostepne = poj.clientWidth;
    const potrzebne = Math.max(sk.scrollWidth, sk.offsetWidth) * 1.01;
    const pomniejszone = potrzebne > dostepne + 2;
    if (pomniejszone) {
      const s = dostepne / potrzebne;
      sk.style.transform = 'scale(' + s + ')';
      poj.style.height = Math.ceil(sk.scrollHeight * s) + 'px';
    }
    d.querySelector('.uw-skala').style.display = pomniejszone ? '' : 'none';
    d.querySelector('.wydruk-uwaga').hidden = !(pomniejszone || wskazowka);
  }
  requestAnimationFrame(dopasuj);
  addEventListener('resize', dopasuj);
  d.scrollIntoView();
}

/* ---------- protokół (przekazanie, inwentaryzacja, dokument) ---------- */
function protokol(tytul, naglowek, sekcje, podpisy) {
  let html = '<h1>' + escHtml(tytul) + '</h1><table class="meta">';
  for (const [k, v] of naglowek) html += '<tr><th>' + escHtml(k) + '</th><td>' + escHtml(v) + '</td></tr>';
  html += '</table>';

  for (const s of sekcje) {
    html += '<h2>' + escHtml(s.tytul) + '</h2>';
    if (!s.wiersze.length) { html += '<p class="brak">— brak pozycji —</p>'; continue; }
    html += '<table class="dane"><thead><tr>';
    s.kolumny.forEach(k => html += '<th>' + escHtml(k) + '</th>');
    html += '</tr></thead><tbody>';
    s.wiersze.forEach((w, i) => {
      html += '<tr><td class="lp">' + (i + 1) + '</td>';
      w.forEach(c => html += '<td>' + escHtml(c == null ? '' : c) + '</td>');
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  if (podpisy && podpisy.length) {
    html += '<div class="podpisy">';
    podpisy.forEach(p => html += '<div class="podpis"><div class="linia"></div>' +
      '<div class="opis">' + escHtml(p) + '</div></div>');
    html += '</div>';
  }

  const styl =
    '@page{size:A4;margin:15mm}' +
    '#wydruk .wydruk-skala{font-family:Arial,sans-serif;font-size:10pt;color:#000;width:180mm;margin:0 auto}' +
    '#wydruk h1{font-size:15pt;margin:0 0 5mm;text-align:center;text-transform:uppercase;letter-spacing:.5px}' +
    '#wydruk h2{font-size:11pt;margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:1px solid #000}' +
    '#wydruk table.meta{border-collapse:collapse;margin-bottom:4mm;font-size:9.5pt}' +
    '#wydruk table.meta th{text-align:left;padding:1mm 6mm 1mm 0;font-weight:normal;color:#444;vertical-align:top}' +
    '#wydruk table.meta td{padding:1mm 0;font-weight:bold}' +
    '#wydruk table.dane{border-collapse:collapse;width:100%;font-size:9pt}' +
    '#wydruk table.dane th,#wydruk table.dane td{border:0.4pt solid #666;padding:1.5mm 2mm;text-align:left}' +
    '#wydruk table.dane th{background:#eee;font-size:8.5pt}' +
    '#wydruk table.dane td.lp{width:8mm;text-align:right;color:#666}' +
    '#wydruk .brak{color:#666;font-style:italic;font-size:9pt}' +
    '#wydruk .podpisy{display:flex;gap:20mm;margin-top:20mm;page-break-inside:avoid}' +
    '#wydruk .podpis{flex:1;text-align:center}' +
    '#wydruk .podpis .linia{border-top:0.4pt solid #000;margin-bottom:1.5mm}' +
    '#wydruk .podpis .opis{font-size:8pt;color:#444}';

  drukuj(tytul, styl, html);
}

global.Wydruk = { protokol, drukuj };

})(window);

</script>
<script>
/* ===== js/eksport.js ===== */
/* ------------------------------------------------------------------
   eksport.js — budowa arkuszy Excela z danych aplikacji
   oraz oddanie pliku użytkownikowi (udostępnienie albo zapis).
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

const dt = s => s ? new Date(s) : null;
const dzis = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
};

const STATUSY = {
  uzywany: 'w użyciu', magazyn: 'w magazynie', naprawa: 'w naprawie',
  wypozyczony: 'wypożyczony', wycofany: 'wycofany', zlikwidowany: 'zlikwidowany'
};

function nazwaLok(id) {
  const l = DB.D.lokalizacje.find(x => x.id === id);
  if (!l) return '';
  return [l.budynek, l.pietro, l.nazwa].filter(Boolean).join(' / ');
}
function nazwaProd(id) {
  const p = DB.D.produkty.find(x => x.id === id);
  return p ? p.nazwa : '(usunięty produkt)';
}
function prod(id) { return DB.D.produkty.find(x => x.id === id) || {}; }

/* ---------- poszczególne arkusze ---------- */

function arkStany() {
  const s = DB.stany(), ost = DB.ostatnieDostawy();
  const wiersze = DB.produkty()
    .sort((a, b) => a.nazwa.localeCompare(b.nazwa, 'pl'))
    .map(p => {
      const stan = s.get(p.id) || 0;
      const min = Number(p.stanMin) || 0;
      return [p.nazwa, p.ean || '', p.indeks || '', p.kategoria || '', p.jm || 'szt',
              stan, min || null, min > stan ? min - stan : null,
              dt(ost.get(p.id)), p.dostawca || ''];
    });
  return {
    nazwa: 'Stany magazynowe',

/* tabela krzyżowa: produkty w wierszach, punkty w kolumnach */
function arkZuzycie() {
  /* punkt = pomieszczenie z ewidencji albo odbiorca wpisany tekstem
     (tak trafiają tu wydania powstałe z zamówień) */
  const kluczDok = d => d.lokalizacjaId ? 'L:' + d.lokalizacjaId
                      : (d.odbiorca ? 'T:' + d.odbiorca : null);
  const nazwaKlucza = k => k.startsWith('L:') ? nazwaLok(k.slice(2)) : k.slice(2);

  const uzyte = new Set();
  DB.dokumenty().filter(d => d.typ === 'RW').forEach(d => {
    const k = kluczDok(d);
    if (k) uzyte.add(k);
  });
  const punkty = [...uzyte].sort((a, b) => nazwaKlucza(a).localeCompare(nazwaKlucza(b), 'pl'));
  const idx = new Map(punkty.map((k, i) => [k, i]));

  const mapa = new Map();
  DB.dokumenty().filter(d => d.typ === 'RW').forEach(d => {
    const k = idx.get(kluczDok(d));
    if (k == null) return;
    (d.pozycje || []).forEach(p => {
      if (!mapa.has(p.produktId)) mapa.set(p.produktId, new Array(punkty.length).fill(0));
      mapa.get(p.produktId)[k] += Number(p.ilosc) || 0;
    });
  });

  const wiersze = [...mapa.entries()]
    .map(([pid, ile]) => {
      const p = prod(pid);
      const suma = ile.reduce((a, b) => a + b, 0);
      return [p.nazwa || nazwaProd(pid), p.jm || 'szt', ...ile.map(x => x || null), suma];
    })
    .sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'pl'));

  const kolumny = [
    { n: 'Produkt', t: 'txt', w: 36 }, { n: 'Jm', t: 'txt', w: 7 },
    ...punkty.map(k => ({ n: nazwaKlucza(k), t: 'int', w: 13 })),
    { n: 'RAZEM', t: 'int', w: 10 }
  ];
  return { nazwa: 'Zużycie wg punktów', kolumny, wiersze,
           sumy: kolumny.map((_, i) => i).filter(i => i >= 2) };
}

function nazwaPliku(prefiks) {
  const f = (DB.D.ust.firma || '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
  return [prefiks || 'magazyn', f, dzis()].filter(Boolean).join('_') + '.xlsx';
}

/* ---------- oddanie pliku użytkownikowi ----------
   Edge na Androidzie odrzuca navigator.share z plikiem (NotAllowedError),
   więc próbujemy udostępnić, a przy odmowie po cichu zapisujemy plik.  */
async function oddaj(blob, nazwa) {
  const f = new File([blob], nazwa, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try {
      await navigator.share({ files: [f], title: nazwa });
      return { sposob: 'udostepnione' };
    } catch (e) {
      if (e && e.name === 'AbortError') return { sposob: 'anulowane' };
      /* NotAllowedError i inne — schodzimy do zapisu pliku */
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nazwa;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return { sposob: 'zapisane' };
}

global.Eksport = {

             arkSprzetWgPomieszczen, arkRuchy, arkPomieszczenia, arkKatalog, arkSpisy }
};

<script>
/* ===== js/import.js ===== */
/* ------------------------------------------------------------------
   import.js — wczytywanie danych z plików .xlsx i .csv.
   Bez zewnętrznych bibliotek: ZIP rozpakowuje wbudowany
   DecompressionStream, XML czyta DOMParser.
   ------------------------------------------------------------------ */
(function (global) {
'use strict';

/* ================= ZIP (odczyt) ================= */
async function rozpakuj(bufor) {
  const dv = new DataView(bufor);
  const u8 = new Uint8Array(bufor);

  /* koniec katalogu centralnego szukamy od końca pliku */
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('To nie jest plik .xlsx (brak struktury ZIP).');

  const ile = dv.getUint16(eocd + 10, true);
  let poz = dv.getUint32(eocd + 16, true);
  const wynik = new Map();

  for (let n = 0; n < ile; n++) {
    if (dv.getUint32(poz, true) !== 0x02014b50) break;
    const metoda   = dv.getUint16(poz + 10, true);
    const rozmiarS = dv.getUint32(poz + 20, true);
    const dlNazwy  = dv.getUint16(poz + 28, true);
    const dlExtra  = dv.getUint16(poz + 30, true);
    const dlKom    = dv.getUint16(poz + 32, true);
    const offset   = dv.getUint32(poz + 42, true);
    const nazwa    = new TextDecoder().decode(u8.subarray(poz + 46, poz + 46 + dlNazwy));
    poz += 46 + dlNazwy + dlExtra + dlKom;

    /* nagłówek lokalny ma własne długości nazwy i pola dodatkowego */
    const lnDlNazwy = dv.getUint16(offset + 26, true);
    const lnDlExtra = dv.getUint16(offset + 28, true);
    const start = offset + 30 + lnDlNazwy + lnDlExtra;
    wynik.set(nazwa, { metoda, dane: u8.subarray(start, start + rozmiarS) });
  }
  return wynik;
}

async function tekstZWpisu(wpis) {
  if (!wpis) return null;
  if (wpis.metoda === 0) return new TextDecoder().decode(wpis.dane);
  if (wpis.metoda !== 8) throw new Error('Nieobsługiwana kompresja w pliku .xlsx.');
  if (typeof DecompressionStream === 'undefined')
    throw new Error('Ta przeglądarka nie potrafi rozpakować .xlsx. Zapisz plik jako CSV.');
  const strumien = new Blob([wpis.dane]).stream()
    .pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(strumien).text();
}

/* ================= XLSX ================= */
function kolNaIndeks(ref) {            // "BC12" -> 54
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

async function czytajXlsx(bufor) {
  const pliki = await rozpakuj(bufor);
  const parser = new DOMParser();
  const xml = async n => {
    const t = await tekstZWpisu(pliki.get(n));
    return t ? parser.parseFromString(t, 'application/xml') : null;
  };

  /* nazwy arkuszy w kolejności z workbook.xml, powiązane przez rels */
  const wb = await xml('xl/workbook.xml');
  const rels = await xml('xl/_rels/workbook.xml.rels');
  const mapaRel = new Map();
  if (rels) [...rels.getElementsByTagName('Relationship')].forEach(r =>
    mapaRel.set(r.getAttribute('Id'), r.getAttribute('Target').replace(/^\/?xl\//, '')));

  const arkusze = [];
  if (wb) [...wb.getElementsByTagName('sheet')].forEach(s => {
    const rid = s.getAttribute('r:id') || s.getAttributeNS(
      'http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    arkusze.push({ nazwa: s.getAttribute('name'), plik: mapaRel.get(rid) });
  });
  if (!arkusze.length) arkusze.push({ nazwa: 'Arkusz1', plik: 'worksheets/sheet1.xml' });

  /* wspólna tablica tekstów */
  const ss = await xml('xl/sharedStrings.xml');
  const teksty = ss ? [...ss.getElementsByTagName('si')].map(si =>
    [...si.getElementsByTagName('t')]
      .filter(t => t.parentNode.nodeName !== 'rPh')
      .map(t => t.textContent).join('')) : [];

  const czytajArkusz = async plik => {
    let d = await xml('xl/' + plik);
    if (!d) d = await xml('xl/worksheets/sheet1.xml');
    if (!d) return [];
    const wiersze = [];
    for (const row of d.getElementsByTagName('row')) {
      const w = [];
      for (const c of row.getElementsByTagName('c')) {
        const ref = c.getAttribute('r') || '';
        const i = ref ? kolNaIndeks(ref) : w.length;
        const typ = c.getAttribute('t');
        let v = '';
        if (typ === 'inlineStr') {
          v = [...c.getElementsByTagName('t')].map(t => t.textContent).join('');
        } else {
          const el = c.getElementsByTagName('v')[0];
          const s = el ? el.textContent : '';
          if (typ === 's') v = teksty[+s] != null ? teksty[+s] : '';
          else if (typ === 'b') v = s === '1' ? 'tak' : 'nie';
          else v = s;
        }
        while (w.length < i) w.push('');
        w[i] = v;
      }
      const nrWiersza = +(row.getAttribute('r') || wiersze.length + 1);
      while (wiersze.length < nrWiersza - 1) wiersze.push([]);
      wiersze[nrWiersza - 1] = w;
    }
    return wiersze;
  };

  const dane = [];
  for (const a of arkusze) dane.push({ nazwa: a.nazwa, wiersze: await czytajArkusz(a.plik) });
  return dane;
}

/* ================= CSV ================= */
function dekoduj(bufor) {
  const utf = new TextDecoder('utf-8', { fatal: false }).decode(bufor);
  /* znak zastępczy = to nie było UTF-8; polski Excel zapisuje w Windows-1250 */
  if (utf.includes('�')) {
    try { return new TextDecoder('windows-1250').decode(bufor); } catch (e) { return utf; }
  }
  return utf.replace(/^﻿/, '');
}

function wykryjSeparator(linia) {
  const kandydaci = [';', ',', '\t', '|'];
  let najlepszy = ';', ile = -1;
  for (const k of kandydaci) {
    const n = linia.split(k).length - 1;
    if (n > ile) { ile = n; najlepszy = k; }
  }
  return ile > 0 ? najlepszy : ';';
}

function czytajCsv(tekst) {
  const pierwsza = tekst.split(/\r?\n/, 1)[0] || '';
  const sep = wykryjSeparator(pierwsza);
  const wiersze = [];
  let w = [], pole = '', wCudzyslowie = false;

  for (let i = 0; i < tekst.length; i++) {
    const z = tekst[i];
    if (wCudzyslowie) {
      if (z === '"') {
        if (tekst[i + 1] === '"') { pole += '"'; i++; }
        else wCudzyslowie = false;
      } else pole += z;
      continue;
    }
    /* cudzysłów otwiera pole tylko na jego początku — inaczej cal w opisie
       („Monitor 24"") połknąłby resztę wiersza */
    if (z === '"' && pole === '') { wCudzyslowie = true; continue; }
    if (z === sep) { w.push(pole); pole = ''; continue; }
    if (z === '\n') { w.push(pole); wiersze.push(w); w = []; pole = ''; continue; }
    if (z === '\r') continue;
    pole += z;
  }
  if (pole !== '' || w.length) { w.push(pole); wiersze.push(w); }
  return wiersze.filter(r => r.some(c => String(c).trim() !== ''));
}

/* Nagłówki rzadko są w pierwszym wierszu — arkusze zaczynają się od tytułu
   albo pustych linii. Bierzemy pierwszy wiersz z co najmniej dwiema
   wypełnionymi komórkami. */
function zgadnijWierszNaglowka(wiersze) {
  for (let i = 0; i < Math.min(wiersze.length, 15); i++) {
    const ile = (wiersze[i] || []).filter(c => String(c || '').trim() !== '').length;
    if (ile >= 2) return i;
  }
  return 0;
}

/* ================= wejście ================= */
async function czytajPlik(plik) {
  const nazwa = (plik.name || '').toLowerCase();
  if (nazwa.endsWith('.xlsx') || nazwa.endsWith('.xlsm')) {
    const arkusze = await czytajXlsx(await plik.arrayBuffer());
    return { rodzaj: 'xlsx', arkusze: arkusze.filter(a => a.wiersze.length) };
  }
  const tekst = dekoduj(await plik.arrayBuffer());
  return { rodzaj: 'csv', arkusze: [{ nazwa: plik.name, wiersze: czytajCsv(tekst) }] };
}

function uprosc(s) {
  return String(s || '').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ł/g, 'l').replace(/[^a-z0-9]+/g, ' ').trim();
}

function zgadnijMapowanie(naglowki, encja) {
  const def = POLA[encja];
  const m = {};
  const zajete = new Set();
  for (const p of def.pola) {
    let naj = -1, najPkt = 0;
    naglowki.forEach((nag, i) => {
      if (zajete.has(i)) return;
      const u = uprosc(nag);
      if (!u) return;
      for (const h of p.hasla) {
        const hu = uprosc(h);
        let pkt = 0;
        if (u === hu) pkt = 100;
        else if (u.startsWith(hu) || hu.startsWith(u)) pkt = 60;
        else if (u.includes(hu)) pkt = 40;
        if (pkt > najPkt) { najPkt = pkt; naj = i; }
      }
    });
    if (naj >= 0 && najPkt >= 40) { m[p.k] = naj; zajete.add(naj); }
  }
  return m;
}

/* ---------- konwersje wartości ---------- */
function naLiczbe(v) {
  if (v == null || v === '') return null;
  const s = String(v).replace(/\s| /g, '').replace(/zł|PLN/gi, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function naDate(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  /* liczba = numer seryjny Excela */
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    if (n > 20000 && n < 80000) {
      const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
      return d.toISOString().slice(0, 10);
    }
  }
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return '';
}
function wartosc(pole, surowa) {
  if (pole.typ === 'liczba') return naLiczbe(surowa);
  if (pole.typ === 'data') return naDate(surowa);
  return String(surowa == null ? '' : surowa).trim();
}

/* ---------- podgląd: co się stanie ---------- */
function przygotuj(encja, wiersze, mapowanie) {
  const def = POLA[encja];
  const out = { nowe: [], aktualizacje: [], bledy: [] };

  wiersze.forEach((w, nr) => {
    const rek = {};
    for (const p of def.pola) {
      const i = mapowanie[p.k];
      if (i == null) continue;
      rek[p.k] = wartosc(p, w[i]);
    }
    const brak = def.pola.filter(p => p.wym && !rek[p.k]);
    if (brak.length) {
      if (Object.values(rek).some(v => v !== '' && v != null))
        out.bledy.push({ nr: nr + 1, powod: 'brak: ' + brak.map(p => p.n).join(', '),
                         podglad: w.slice(0, 3).join(' | ') });
      return;
    }

    if (encja === 'produkty') {
      const ist = (rek.ean && DB.produkty().find(p => p.ean && p.ean === rek.ean)) ||
                  (rek.indeks && DB.produkty().find(p => p.indeks && p.indeks === rek.indeks)) ||
                  DB.produkty().find(p => uprosc(p.nazwa) === uprosc(rek.nazwa));
      (ist ? out.aktualizacje : out.nowe).push({ rek, ist });
    } else if (encja === 'sprzet') {
      const ist = rek.nrInw ? DB.sprzety().find(s => s.nrInw === rek.nrInw) : null;
      (ist ? out.aktualizacje : out.nowe).push({ rek, ist });
    } else if (encja === 'lokalizacje') {
      const ist = DB.lokalizacje().find(l => uprosc(l.kod) === uprosc(rek.kod));
      (ist ? out.aktualizacje : out.nowe).push({ rek, ist });
    } else {
      if (rek.ilosc == null) {
        out.bledy.push({ nr: nr + 1, powod: 'ilość nie jest liczbą',
                         podglad: w.slice(0, 3).join(' | ') });
        return;
      }
      out.nowe.push({ rek, ist: null });
    }
  });
  return out;
}

/* ---------- właściwy zapis ---------- */
async function wykonaj(encja, plan, opcje) {
  opcje = opcje || {};
  let dodane = 0, zmienione = 0;

  const zapiszRek = async (store, rek, ist, dodatki) => {
    const cel = ist ? Object.assign({}, ist) : {};
    for (const [k, v] of Object.entries(rek)) {
      if (k.startsWith('_')) continue;
      if (v === '' || v == null) continue;          // puste komórki nie kasują danych
      cel[k] = v;
    }
    Object.assign(cel, dodatki || {});
    await DB.zapisz(store, cel, false);
    if (ist) zmienione++; else dodane++;
    return cel;
  };

  if (encja === 'produkty') {
    for (const { rek, ist } of plan.nowe) await zapiszRek('produkty', rek, null, { jm: rek.jm || 'szt' });
    if (opcje.aktualizuj) for (const { rek, ist } of plan.aktualizacje) await zapiszRek('produkty', rek, ist);
  }

  else if (encja === 'lokalizacje') {
    for (const { rek, ist } of plan.nowe)
      await zapiszRek('lokalizacje', rek, null,
        /* budynek albo piętro w pliku = to pomieszczenie w oddziale, nie punkt */
        { punkt: !(rek.budynek || rek.pietro), nazwa: rek.nazwa || rek.kod,
          kodKresk: rek.kodKresk || rek.kod });
    if (opcje.aktualizuj) for (const { rek, ist } of plan.aktualizacje)
      await zapiszRek('lokalizacje', rek, ist);
  }

  else if (encja === 'sprzet') {
    /* nazwa pomieszczenia z pliku -> istniejąca lokalizacja albo nowa */
    const znajdzLok = async nazwa => {
      const u = uprosc(nazwa);
      if (!u) return null;
      const l = DB.lokalizacje().find(x =>
        uprosc(x.kod) === u || uprosc(x.nazwa) === u ||
        uprosc(Eksport.nazwaLok(x.id)) === u);
      if (l) return l.id;
      if (!opcje.tworzLokalizacje) return null;
      const nowa = await DB.zapisz('lokalizacje',
        { kod: String(nazwa).trim(), nazwa: String(nazwa).trim(), punkt: true,
          kodKresk: String(nazwa).trim() }, false);
      return nowa.id;
    };
    for (const { rek, ist } of plan.nowe) {
      const lokId = await znajdzLok(rek._lok);
      await zapiszRek('sprzet', rek, null, {
        nrInw: rek.nrInw || DB.nastepnyNrInw(),
        kodKresk: rek.kodKresk || rek.nrInw || DB.nastepnyNrInw(),
        status: rek.status || 'uzywany',
        lokalizacjaId: lokId || null
      });
    }
    if (opcje.aktualizuj) for (const { rek, ist } of plan.aktualizacje) {
      const lokId = rek._lok ? await znajdzLok(rek._lok) : ist.lokalizacjaId;
      await zapiszRek('sprzet', rek, ist, { lokalizacjaId: lokId || ist.lokalizacjaId || null });
    }
  }

  else if (encja === 'dostawa') {
    const pozycje = [];
    for (const { rek } of plan.nowe) {
      let p = (rek.ean && DB.produkty().find(x => x.ean && x.ean === rek.ean)) ||
              (rek.indeks && DB.produkty().find(x => x.indeks && x.indeks === rek.indeks)) ||
              DB.produkty().find(x => uprosc(x.nazwa) === uprosc(rek.nazwa));
      if (!p) {
        p = await DB.zapisz('produkty', {
          nazwa: rek.nazwa, ean: rek.ean || '', indeks: rek.indeks || '', jm: rek.jm || 'szt'
        }, false);
        dodane++;
      }
      pozycje.push({ produktId: p.id, ilosc: rek.ilosc });
    }
    if (pozycje.length) {
      await DB.zapisz('dokumenty', {
        typ: 'PZ', numer: DB.nastepnyNumer('PZ'),
        data: (opcje.data || new Date().toISOString().slice(0, 10)),
        dostawca: opcje.dostawca || '',
        nrFaktury: opcje.nrFaktury || '',
        uwagi: opcje.uwagi || 'wczytane z pliku',
        pozycje
      }, false);
      zmienione = pozycje.length;
    }
  }

  await DB.ustaw('operacjiOdKopii', (DB.D.ust.operacjiOdKopii || 0) + dodane + zmienione);
  return { dodane, zmienione };
}

global.Importer = { czytajPlik, czytajCsv, czytajXlsx, POLA, zgadnijMapowanie,
                    zgadnijWierszNaglowka, przygotuj, wykonaj, uprosc, naLiczbe, naDate };

})(window);
