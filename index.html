      '<label class="ptak"><input type="checkbox" id="f-punkt"' + (l.punkt ? ' checked' : '') +
        '><span class="et">To punkt, na który wydaje się materiały</span></label>' +
      '</div>' +
      '<button class="b glowny" id="zapisz">Zapisz</button>' +
      (nowa ? '' :
        '<button class="b" id="wydaj">→ Wydaj tu sprzęt</button>' +
        '<button class="b" id="spis">☑ Zrób spis tego pomieszczenia</button>' +
        '<button class="b zly" id="usun">Usuń pomieszczenie</button>') +
      (sprzetTu.length ? '<div class="naglowek-sekcji">Sprzęt tutaj (' + sprzetTu.length + ')</div>' +
        '<div class="lista">' + wierszeSprzetu(sprzetTu) + '</div>' : ''),
    po: () => {
      $('#skan').onclick = async () => {
        const k = await Skaner.jedenKod({ tytul: 'Zeskanuj etykietę pomieszczenia' });
        if (k) { $('#f-kodKresk').value = k; toast('Kod: ' + k); }
      };
      const przelaczPola = () => {
        const p = $('#f-punkt').checked;
        $('#pola-punkt').hidden = !p;
        $('#pola-pokoj').hidden = p;
      };
      $('#f-punkt').onchange = przelaczPola;
      $('#zapisz').onclick = async () => {
        const dane = zbierz(['kod', 'nazwa', 'budynek', 'pietro', 'miasto', 'ulica',
                             'kierowca', 'osoba', 'email', 'kodKresk']);
        dane.punkt = $('#f-punkt').checked;
        /* nie zostawiamy danych z drugiego rodzaju — myliłyby filtry i eksport */
        (dane.punkt ? ['budynek', 'pietro'] : ['miasto', 'ulica', 'kierowca'])
          .forEach(k => { dane[k] = ''; });
        if (!dane.kod && !dane.nazwa) { toast('Podaj kod albo nazwę'); return; }
        if (!dane.kodKresk) dane.kodKresk = dane.kod;
        const kol = DB.lokalizacje().find(x => x.id !== l.id && x.kodKresk &&
          x.kodKresk === dane.kodKresk);
        if (kol) { toast('Ten kod ma już: ' + (kol.nazwa || kol.kod), 4000); return; }
        await DB.zapisz('lokalizacje', Object.assign(l, dane));
        toast('Zapisano');
        history.back();
      };
      const wy = $('#wydaj');
      if (wy) wy.onclick = () => { nowePrz = null; location.hash = '#/przekazanie/nowe?lok=' + l.id; };
      const sp = $('#spis');
      if (sp) sp.onclick = () => location.hash = '#/spis?lok=' + l.id;
      const u = $('#usun');
      if (u) u.onclick = async () => {
        if (sprzetTu.length) {
          toast('Najpierw przenieś stąd sprzęt (' + sprzetTu.length + ' szt.)', 3500);
          return;
        }
        if (!(await potwierdz('Usunąć pomieszczenie?', 'Dokumenty wydań zostaną nienaruszone.', 'Usuń'))) return;
        await DB.usun('lokalizacje', l.id);
        toast('Usunięto');
        location.hash = '#/lokalizacje';
      };
    }
  };
}

/* ==================================================================
   INWENTARYZACJA
   ================================================================== */
let spisStan = null;

function spis(param) {
  const lok = param.lok ? DB.lokalizacje().find(l => l.id === param.lok) : null;

  if (!lok) {
    const lista = DB.lokalizacje().sort((a, b) =>
      Eksport.nazwaLok(a.id).localeCompare(Eksport.nazwaLok(b.id), 'pl'));
    return {
      tytul: 'Inwentaryzacja', wstecz: true,
      html:
        '<div class="karta"><h2>Jak to działa</h2><p>Zeskanuj etykietę na drzwiach albo wybierz ' +
        'pomieszczenie z listy. Potem skanuj po kolei sprzęt, który widzisz. Na koniec ' +
        'dostaniesz listę zgodnych, brakujących i nadmiarowych pozycji.</p></div>' +
        '<button class="b glowny" id="skanuj-pokoj">⌗ Zeskanuj pomieszczenie</button>' +
        (lista.length ? '<div class="naglowek-sekcji">Albo wybierz z listy</div><div class="lista">' +
          lista.map(l => '<a class="poz" href="#/spis?lok=' + l.id + '"><div class="tre">' +
            '<div class="tyt">' + h(l.nazwa || l.kod) + '</div><div class="pod">' +
            h([l.budynek, l.pietro].filter(Boolean).join(' / ') || 'bez lokalizacji') +
            '</div></div><div class="licz">' +
            DB.sprzety().filter(s => s.lokalizacjaId === l.id).length + '<small>szt.</small></div></a>')
            .join('') + '</div>'
          : pusto('▢', 'Najpierw dodaj pomieszczenia.')),
      po: () => {
        $('#skanuj-pokoj').onclick = async () => {
          const k = await Skaner.jedenKod({ tytul: 'Zeskanuj etykietę pomieszczenia' });
          if (!k) return;
          const t = DB.poKodzie(k);
          if (t.rodzaj === 'lokalizacja') location.hash = '#/spis?lok=' + t.obiekt.id;
          else toast('To nie jest kod pomieszczenia: ' + k, 3500);
        };
      }
    };
  }

  if (!spisStan || spisStan.lokId !== lok.id) {
    spisStan = { lokId: lok.id, znalezione: new Set(), nadmiarowe: new Set(), nieznane: [] };
  }

  const oczekiwane = DB.sprzety().filter(s => s.lokalizacjaId === lok.id);
  const brakujace = oczekiwane.filter(s => !spisStan.znalezione.has(s.id));
  const nadmiar = [...spisStan.nadmiarowe].map(id => DB.sprzety().find(s => s.id === id)).filter(Boolean);

  const sekcja = (tyt, lista, klasa, opis) =>
    '<div class="naglowek-sekcji">' + tyt + ' (' + lista.length + ')</div>' +
    (lista.length
      ? '<div class="lista">' + lista.map(s => '<a class="poz" href="#/sprzet/' + s.id + '">' +
          '<div class="tre"><div class="tyt">' + h(s.nazwa || s.nrInw) + '</div>' +
          '<div class="pod">' + h(s.nrInw || '') +
          (klasa === 'nadmiar' ? ' · przypisany do: ' +
            h(Eksport.nazwaLok(s.lokalizacjaId) || 'brak') : '') +
          '</div></div><div class="licz"><span class="znacz ' +
          (klasa === 'ok' ? 'ok' : klasa === 'brak' ? 'zle' : 'uw') + '">' +
          (klasa === 'ok' ? '✓' : klasa === 'brak' ? 'brak' : 'obcy') + '</span></div></a>').join('') +
        '</div>'
      : '<p style="color:var(--tx2);font-size:13.5px;margin:0 2px 8px">' + h(opis) + '</p>');

  return {
    tytul: 'Spis: ' + (lok.nazwa || lok.kod),
    wstecz: true,
    html:
      '<div class="stat">' +
        '<div><b style="color:var(--ok)">' + spisStan.znalezione.size + '</b><span>znalezione</span></div>' +
        '<div><b style="color:var(--zle)">' + brakujace.length + '</b><span>brakujące</span></div>' +
        '<div><b style="color:var(--uw)">' + nadmiar.length + '</b><span>nadmiarowe</span></div>' +
      '</div>' +
      '<button class="b glowny" id="skanuj">⌗ Skanuj sprzęt w pomieszczeniu</button>' +
      sekcja('Zgodne', oczekiwane.filter(s => spisStan.znalezione.has(s.id)), 'ok',
             'Nic jeszcze nie zeskanowano.') +
      sekcja('Brakujące', brakujace, 'brak', 'Wszystko na miejscu.') +
      sekcja('Nadmiarowe', nadmiar, 'nadmiar', 'Brak sprzętu z innych pomieszczeń.') +
      (spisStan.nieznane.length ? '<div class="alert uw"><div><b>Dopisane podczas spisu (' +
        spisStan.nieznane.length + ')</b>Tych sztuk nie było w ewidencji — zostały ' +
        'dodane i przypisane do tego pomieszczenia. Uzupełnij im nazwy: ' +
        h(spisStan.nieznane.join(', ')) + '</div></div>' : '') +
      '<button class="b" id="przenies" ' + (nadmiar.length ? '' : 'disabled') +
        '>Przypisz nadmiarowe do tego pomieszczenia</button>' +
      '<button class="b glowny" id="zakoncz">Zakończ i zapisz protokół</button>' +
      '<button class="b" id="wyczysc">Zacznij spis od nowa</button>',
    po: () => {
      $('#skanuj').onclick = () => Skaner.otworz({
        tytul: 'Spis: ' + (lok.nazwa || lok.kod),
        podpowiedz: 'Skanuj kolejne etykiety sprzętu.',
        onKod: async kod => {
          const w = await Przen.sprzetZKodu(kod);
          if (w.blad) { Skaner.info(w.blad); return; }
          if (w.nowy) {
            /* spis wykrył sztukę, której nie było w ewidencji — dopisujemy ją tutaj */
            w.sprzet.lokalizacjaId = lok.id;
            await DB.zapisz('sprzet', w.sprzet, false);
            spisStan.znalezione.add(w.sprzet.id);
            if (!spisStan.nieznane.includes(kod)) spisStan.nieznane.push(kod);
            Skaner.info('+ dopisany do ewidencji: ' + kod);
            return;
          }
          const s = w.sprzet;
          if (s.lokalizacjaId === lok.id) {
            spisStan.znalezione.add(s.id);
            Skaner.info('✓ ' + (s.nazwa || s.nrInw));
          } else {
            spisStan.nadmiarowe.add(s.id);
            Skaner.info('Obcy: ' + (s.nazwa || s.nrInw) + ' (z: ' +
              (Eksport.nazwaLok(s.lokalizacjaId) || 'brak') + ')');
          }
        }
      });
      $('#przenies').onclick = async () => {
        if (!(await potwierdz('Przypisać nadmiarowe?',
          nadmiar.length + ' szt. zostanie przypisane do tego pomieszczenia. ' +
          'Poprzednie przypisanie zapisze się w historii.', 'Przypisz'))) return;
        for (const s of nadmiar) {
          await DB.przenies(s.id, lok.id, '', 'inwentaryzacja');
          spisStan.znalezione.add(s.id);
        }
        spisStan.nadmiarowe.clear();
        toast('Przypisano ' + nadmiar.length + ' szt.');
        odswiez();
      };
      $('#zakoncz').onclick = async () => {
        const zapis = {
          lokalizacjaId: lok.id, data: DB.teraz(), kto: DB.D.ust.osoba || '',
          znalezione: [...spisStan.znalezione],
          brakujace: brakujace.map(s => s.id),
          nadmiarowe: [...spisStan.nadmiarowe],
          nieznane: spisStan.nieznane.slice()
        };
        await DB.zapisz('spisy', zapis);
        const wiersz = s => [s.nrInw || '', s.nazwa || '',
                             [s.producent, s.model].filter(Boolean).join(' '), s.nrSer || ''];
        Wydruk.protokol('Protokół inwentaryzacji',
          [['Pomieszczenie', Eksport.nazwaLok(lok.id)],
           ['Data', new Date().toLocaleString('pl-PL')],
           ['Firma', DB.D.ust.firma || '—'],
           ['Wynik', spisStan.znalezione.size + ' zgodnych, ' + brakujace.length +
            ' brakujących, ' + nadmiar.length + ' nadmiarowych']],
          [{ tytul: 'Zgodne', kolumny: ['Lp', 'Nr inw.', 'Nazwa', 'Producent / model', 'Nr seryjny'],
             wiersze: oczekiwane.filter(s => spisStan.znalezione.has(s.id)).map(wiersz) },
           { tytul: 'Brakujące', kolumny: ['Lp', 'Nr inw.', 'Nazwa', 'Producent / model', 'Nr seryjny'],
             wiersze: brakujace.map(wiersz) },
           { tytul: 'Nadmiarowe', kolumny: ['Lp', 'Nr inw.', 'Nazwa', 'Producent / model', 'Nr seryjny'],
             wiersze: nadmiar.map(wiersz) }],
          ['Spisujący', 'Osoba odpowiedzialna']);
        spisStan = null;
        toast('Protokół zapisany');
      };
      $('#wyczysc').onclick = () => { spisStan = null; odswiez(); };
    }
  };
}

/* ==================================================================
   SKANUJ (rozpoznanie dowolnego kodu)
   ================================================================== */
function skanuj() {
  return {
    tytul: 'Skanowanie', wstecz: true,
    html: '<div class="karta"><h2>Co to za kod?</h2><p>Aplikacja rozpozna, czy to produkt ' +
      'z katalogu, sprzęt czy pomieszczenie, i przeniesie Cię na właściwy ekran.</p></div>' +
      '<button class="b glowny" id="start">⌗ Otwórz skaner</button>' +
      '<label><span class="et">Albo wpisz kod ręcznie</span>' +
      '<input id="reczny" type="text" inputmode="numeric" placeholder="np. 5901234567890"></label>' +
      '<button class="b" id="szukaj">Szukaj</button>' +
      '<div id="wynik"></div>',
    po: () => {
      const obsluz = kod => {
        if (!kod) return;
        const t = DB.poKodzie(kod);
        if (t.rodzaj === 'produkt') location.hash = '#/produkt/' + t.obiekt.id;
        else if (t.rodzaj === 'sprzet') location.hash = '#/sprzet/' + t.obiekt.id;
        else if (t.rodzaj === 'lokalizacja') location.hash = '#/lokalizacja/' + t.obiekt.id;
        else {
          $('#wynik').innerHTML = '<div class="alert uw"><div><b>Kod ' + h(kod) +
            ' nie jest w ewidencji</b>Możesz założyć nową pozycję.</div></div>' +
            '<a class="b" href="#/produkt/nowy">Nowy produkt</a>' +
            '<a class="b" href="#/sprzet/nowy?kod=' + encodeURIComponent(kod) + '">Nowy sprzęt</a>';
        }
      };
      $('#start').onclick = async () => obsluz(await Skaner.jedenKod({ tytul: 'Skanuj dowolny kod' }));
      $('#szukaj').onclick = () => obsluz($('#reczny').value.trim());
      $('#reczny').onkeydown = e => { if (e.key === 'Enter') obsluz(e.target.value.trim()); };
    }
  };
}

   ================================================================== */
function eksport() {
  const k = DB.kopiaPotrzebna();
  return {
    tytul: 'Excel i kopia zapasowa', wstecz: true,
    html:
      (k ? '<div class="alert zle"><div><b>Kopia zapasowa jest zaległa</b>' +
        'Dane aplikacji siedzą wyłącznie w tym telefonie. Wyczyszczenie danych ' +
        'przeglądarki albo zmiana telefonu oznacza ich utratę.</div></div>' : '') +
      '<div class="karta"><h2>Raport Excel</h2><p>Wszystkie dane w jednym pliku .xlsx: ' +
      'stany, zapotrzebowanie, dostawy, wydania, zużycie wg punktów, sprzęt, ' +
      'pomieszczenia i historia.</p></div>' +
      '<button class="b glowny" id="xlsx">⤓ Wygeneruj raport Excel</button>' +
      '<div class="karta"><h2>Kopia zapasowa</h2><p>Plik .json z całą bazą. ' +
      'Trzymaj go poza telefonem — na dysku firmowym albo we własnej skrzynce. ' +
      (DB.D.ust.ostatniaKopia ? 'Ostatnia kopia: <b>' + h(dataGodzPL(DB.D.ust.ostatniaKopia)) +
        '</b>, od tego czasu ' + (DB.D.ust.operacjiOdKopii || 0) + ' zmian.'
        : 'Nie zrobiono jeszcze żadnej kopii.') + '</p></div>' +
      '<button class="b glowny" id="kopia">⤓ Zrób kopię zapasową</button>' +
      '<button class="b" id="wczytaj">⤒ Wczytaj kopię z pliku</button>' +
      '<input type="file" id="plik-kopia" accept=".json,application/json" hidden>' +
      '<div class="karta"><h2>Jak wysłać plik mailem</h2><p>Edge na Androidzie nie pozwala ' +
      'wysłać pliku prosto ze strony, więc plik zapisuje się w Pobranych. Otwórz aplikację ' +
      '<b>Pliki</b> → przytrzymaj plik → <b>Udostępnij</b> → Outlook. Dwa dodatkowe kliknięcia.</p></div>',
    po: () => {
      $('#xlsx').onclick = async () => {
        const b = $('#xlsx');
        b.disabled = true; b.textContent = 'Generuję…';
        try {
          const blob = Eksport.plik();
          const wynik = await Eksport.oddaj(blob, Eksport.nazwaPliku('magazyn'));
          toast(wynik.sposob === 'zapisane'
            ? 'Plik zapisany w Pobranych' : 'Gotowe', 3600);
        } catch (e) {
          toast('Błąd generowania: ' + e.message, 5000);
        }
        b.disabled = false; b.textContent = '⤓ Wygeneruj raport Excel';
      };
      $('#kopia').onclick = async () => {
        const dane = JSON.stringify(DB.kopia());
        const blob = new Blob([dane], { type: 'application/json' });
        await Eksport.oddaj(blob, Eksport.nazwaPliku('kopia').replace('.xlsx', '.json'));
        await DB.ustaw('ostatniaKopia', DB.teraz());
        await DB.ustaw('operacjiOdKopii', 0);
        toast('Kopia zapisana w Pobranych', 3600);
        odswiez();
      };
      $('#wczytaj').onclick = () => $('#plik-kopia').click();
      $('#plik-kopia').onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        let obj;
        try { obj = JSON.parse(await f.text()); }
        catch (err) { toast('To nie jest poprawny plik kopii'); return; }
        const ile = Object.values(obj.dane || {}).reduce((s, x) => s + (x.length || 0), 0);
        modal('Wczytać kopię?',
          '<p>Plik z ' + h(dataGodzPL(obj.data)) + ', ' + ile + ' rekordów.</p>' +
          '<p style="margin-top:8px;font-size:13.5px;color:var(--tx2)">' +
          '<b>Zastąp</b> — usuwa obecne dane i wstawia te z pliku.<br>' +
          '<b>Scal</b> — łączy oba zestawy, przy konflikcie wygrywa nowszy wpis.</p>',
          [{ tekst: 'Anuluj' },
           { tekst: 'Scal', akcja: async () => { await wczytajKopie(obj, true); } },
           { tekst: 'Zastąp', klasa: 'zly', akcja: async () => { await wczytajKopie(obj, false); } }]);
      };
    }
  };
}
async function wczytajKopie(obj, scalaj) {
  try {
    await DB.przywroc(obj, scalaj);
    toast(scalaj ? 'Dane scalone' : 'Dane wczytane', 3200);
    location.hash = '#/pulpit';
    odswiez();
  } catch (e) { toast('Błąd: ' + e.message, 5000); }
}

      '<div class="karta"><h2>Wersja aplikacji</h2><p><b>' + h(window.WERSJA_APP || '?') +
        '</b><br>Aktualizacja to podmiana samego <b>index.html</b> na hostingu. ' +
        'Plik <b>sw.js</b> jest stały — wgrywa się go raz.</p></div>' +
      '<button class="b" id="sprawdz-akt">Sprawdź, czy jest nowsza wersja</button>' +
      '<div class="karta"><h2>Zajęte miejsce</h2><p id="miejsce">liczę…</p></div>' +
      '<div class="karta"><h2>Dane w tym urządzeniu</h2><p>' +
        DB.D.produkty.length + ' produktów · ' + DB.D.dokumenty.length + ' dokumentów · ' +
        DB.D.sprzet.length + ' sztuk sprzętu · ' + DB.D.ruchy.length + ' ruchów · ' +
        DB.D.spisy.length + ' spisów</p></div>' +
      '<button class="b zly" id="kasuj">Skasuj wszystkie dane</button>',
    po: async () => {
      $('#zapisz').onclick = async () => {
        const d = zbierz(['firma', 'osoba', 'emailEwidencja', 'prefiksInw',
                          'przypomnijPoDniach', 'przypomnijPoOperacjach']);
        for (const [k, v] of Object.entries(d)) await DB.ustaw(k, v);
        toast('Zapisano');
        odswiez();
      };
      $('#sprawdz-akt').onclick = async () => {
        const b = $('#sprawdz-akt');
        b.disabled = true; b.textContent = 'Sprawdzam…';
        const jest = await window.sprawdzAktualizacje();
        toast(jest ? 'Jest nowsza wersja — kliknij pasek na dole'
                   : 'Masz najnowszą wersję (' + (window.WERSJA_APP || '') + ')', 4000);
        b.disabled = false; b.textContent = 'Sprawdź, czy jest nowsza wersja';
      };
      $('#kasuj').onclick = async () => {
        if (!(await potwierdz('Skasować wszystko?',
          'Wszystkie dane znikną bezpowrotnie. Jeśli nie masz kopii zapasowej — nie rób tego.',
          'Kasuj'))) return;
        if (!(await potwierdz('Na pewno?', 'To już naprawdę ostatnie pytanie.', 'Tak, kasuj'))) return;
        indexedDB.deleteDatabase('magazyn');
        toast('Skasowano. Odśwież stronę.', 6000);
      };
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        const trw = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        $('#miejsce').innerHTML = (e.usage / 1048576).toFixed(1) + ' MB z ' +
          (e.quota / 1073741824).toFixed(1) + ' GB · trwały magazyn: <b>' +
          (trw ? 'tak' : 'nie') + '</b>';
      }
    }
  };
}

/* ------------------------------------------------------------------
   Wspólne okno „nie ma tego na stanie”. Blokuje wydanie, ale pozwala
   jednym kliknięciem dopisać przyjęcie — bo najczęstsza przyczyna to
   towar, który fizycznie leży w magazynie, tylko dostawy nikt nie wpisał.
   ------------------------------------------------------------------ */
function pokazBraki(braki, opisDokumentu, poUzupelnieniu) {
  const scalone = new Map();
  braki.forEach(b => {
    const x = scalone.get(b.produktId);
    if (!x || b.brakuje > x.brakuje) scalone.set(b.produktId, b);
  });
  const lista = [...scalone.values()];
  const suma = lista.reduce((a, b) => a + b.brakuje, 0);

  modal('Nie ma tego na stanie',
    '<p style="margin-bottom:10px">Nie da się wydać towaru, którego nie ma w magazynie. ' +
    'Brakuje <b>' + liczba(suma) + ' szt.</b> w ' + lista.length + ' pozycjach:</p>' +
    '<div class="lista" style="max-height:40dvh;overflow:auto">' +
    lista.slice(0, 30).map(b =>
      '<div class="poz"><div class="tre"><div class="tyt">' + h(b.nazwa) + '</div>' +
      '<div class="pod">potrzeba ' + liczba(b.potrzeba) + ', na stanie ' + liczba(b.masz) +
      '</div></div><div class="licz" style="color:var(--zle)">−' + liczba(b.brakuje) +
      '</div></div>').join('') +
    (lista.length > 30 ? '<div class="poz"><div class="pod">…i jeszcze ' +
      (lista.length - 30) + '</div></div>' : '') + '</div>' +
    '<p style="margin-top:10px;font-size:13.5px;color:var(--tx2)">' +
    'Jeśli towar fizycznie jest, a brakuje tylko wpisu — dopisz przyjęcie ' +
    'poniższym przyciskiem i spróbuj ponownie.</p>',
    [{ tekst: 'Anuluj' },
     { tekst: 'Przyjmij brakujące', klasa: 'glowny', akcja: async () => {
        await Zam.przyjmijBrakujace(lista, opisDokumentu);
        toast('Dopisano przyjęcie ' + liczba(suma) + ' szt.', 3500);
        if (poUzupelnieniu) poUzupelnieniu();
        else odswiez();
      } }]);
}

/* ==================================================================
   ZAMÓWIENIA — wczytanie partii
   ================================================================== */
let impZ = null;
function resetZam() {
  impZ = { krok: 1, nazwaPliku: '', arkusze: [], arkuszIdx: 0, wierszNagl: 0,
           role: {}, opcje: { zdejmujStan: true, tworzProdukty: true, nazwa: '' } };
}

function zamImport() {
  if (!impZ) resetZam();

  if (impZ.krok === 1) {
    return {
      tytul: 'Wczytaj zamówienia', wstecz: true,
      html:
        '<div class="karta"><h2>Jak ma wyglądać plik</h2><p>Jedno zamówienie w wierszu, ' +
        'artykuły w kolumnach, w komórkach ilości. Kolumny opisowe — miasto, ulica, punkt, ' +
        'kierowca, uwagi — aplikacja rozpozna po nagłówkach, a Ty potwierdzisz. ' +
        'Przy kolejnym pliku o tych samych nagłówkach ustawienia same się podstawią.</p></div>' +
        '<button class="b glowny" id="wybierz">Wybierz plik .xlsx lub .csv</button>' +
        '<input type="file" id="plik-z" accept=".xlsx,.xlsm,.csv,.txt" hidden>',
      po: () => {
        $('#wybierz').onclick = () => $('#plik-z').click();
        $('#plik-z').onchange = async e => {
          const f = e.target.files[0];
          if (!f) return;
          toast('Czytam plik…');
          try {
            const w = await Importer.czytajPlik(f);
            if (!w.arkusze.length) throw new Error('Plik nie zawiera danych.');
            impZ.nazwaPliku = f.name;
            impZ.arkusze = w.arkusze;
            impZ.arkuszIdx = 0;
            impZ.wierszNagl = Importer.zgadnijWierszNaglowka(w.arkusze[0].wiersze);
            const nag = naglowkiZ();
            impZ.role = Zam.zapamietanyUklad(nag) || Zam.zgadnijRole(nag);
            impZ.opcje.nazwa = f.name.replace(/\.(xlsx|xlsm|csv|txt)$/i, '');
            impZ.krok = 2;
            odswiez();
          } catch (err) {
            modal('Nie udało się wczytać', '<p>' + h(err.message) + '</p>', [{ tekst: 'Rozumiem' }]);
          }
        };
      }
    };
  }

  const ark = impZ.arkusze[impZ.arkuszIdx] || { wiersze: [] };
  const nag = naglowkiZ();
  const przyklad = ark.wiersze[impZ.wierszNagl + 1] || [];

  if (impZ.krok === 2) {
    const ile = r => nag.filter((_, i) => impZ.role[i] === r).length;
    return {
      tytul: 'Co jest w kolumnach', wstecz: true,
      html:
        '<div class="karta"><h2>' + h(impZ.nazwaPliku) + '</h2><p>' +
        h(ark.wiersze.length - impZ.wierszNagl - 1) + ' wierszy, ' + nag.length + ' kolumn. ' +
        'Rozpoznano <b>' + ile('artykul') + '</b> kolumn z artykułami.</p></div>' +
        (impZ.arkusze.length > 1
          ? polSelectId('arkZ', 'Arkusz', String(impZ.arkuszIdx),
              impZ.arkusze.map((a, i) => [String(i), a.nazwa + ' (' + a.wiersze.length + ' w.)']))
          : '') +
        pole('naglRowZ', 'Który wiersz zawiera nagłówki', impZ.wierszNagl + 1, 'number') +
        pole('nazwaP', 'Nazwa partii', impZ.opcje.nazwa) +
        '<label class="ptak"><input type="checkbox" id="z-stan"' +
          (impZ.opcje.zdejmujStan ? ' checked' : '') +
          '><span class="et">Odhaczone zamówienia zdejmują stan z magazynu</span></label>' +
        '<label class="ptak" style="margin-top:9px"><input type="checkbox" id="z-prod"' +
          (impZ.opcje.tworzProdukty ? ' checked' : '') +
          '><span class="et">Dopisz brakujące artykuły do katalogu</span></label>' +
        '<div class="naglowek-sekcji">Rola każdej kolumny</div>' +
        '<div class="lista">' + nag.map((n, i) =>
          '<div class="poz" style="align-items:flex-start;flex-direction:column;gap:6px">' +
          '<div class="tre" style="width:100%"><div class="tyt">' + h(n) + '</div>' +
          '<div class="pod">' + (przyklad[i] !== undefined && przyklad[i] !== ''
            ? 'przykład: ' + h(String(przyklad[i]).slice(0, 30)) : 'pusto w pierwszym wierszu') +
          '</div></div>' +
          '<select data-kol="' + i + '" style="font-size:14px;padding:8px 10px">' +
          Zam.ROLE.map(r => '<option value="' + r.k + '"' +
            (impZ.role[i] === r.k ? ' selected' : '') + '>' + h(r.n) + '</option>').join('') +
          '</select></div>').join('') + '</div>' +
        '<button class="b glowny" id="dalej-z">Sprawdź, co się wczyta</button>' +
        '<button class="b" id="wroc-z1">← Inny plik</button>',
      po: () => {
        const a = $('#f-arkZ');
        if (a) a.onchange = () => {
          impZ.arkuszIdx = +a.value;
          impZ.wierszNagl = Importer.zgadnijWierszNaglowka(impZ.arkusze[impZ.arkuszIdx].wiersze);
          impZ.role = Zam.zgadnijRole(naglowkiZ());
          odswiez();
        };
        $('#f-naglRowZ').onchange = e => {
          impZ.wierszNagl = Math.max(0, (parseInt(e.target.value, 10) || 1) - 1);
          const n2 = naglowkiZ();
          impZ.role = Zam.zapamietanyUklad(n2) || Zam.zgadnijRole(n2);
          odswiez();
        };
        widok().querySelectorAll('select[data-kol]').forEach(s => {
          s.onchange = () => { impZ.role[+s.dataset.kol] = s.value; };
        });
        $('#wroc-z1').onclick = () => { impZ.krok = 1; odswiez(); };
        $('#dalej-z').onclick = () => {
          impZ.opcje.nazwa = $('#f-nazwaP').value.trim();
          impZ.opcje.zdejmujStan = $('#z-stan').checked;
          impZ.opcje.tworzProdukty = $('#z-prod').checked;
          const art = nag.filter((_, i) => impZ.role[i] === 'artykul').length;
          if (!art) { toast('Żadna kolumna nie jest oznaczona jako artykuł'); return; }
          impZ.krok = 3;
          odswiez();
        };
      }
    };
  }

  /* krok 3 — podgląd */
  const dane = Zam.przygotuj(ark.wiersze, impZ.wierszNagl, impZ.role);
  const art = Zam.dopasujArtykuly(dane.artykuly);
  const nowych = art.filter(a => !a.produktId).length;
  const sztuk = dane.zamowienia.reduce((s, z) =>
    s + z.pozycje.reduce((x, p) => x + p.ilosc, 0), 0);
  const kierowcy = Zam.wartosciFiltra(dane.zamowienia, 'kierowca');
  const miasta = Zam.wartosciFiltra(dane.zamowienia, 'miasto');

  return {
    tytul: 'Podgląd partii', wstecz: true,
    html:
      '<div class="stat">' +
        '<div><b>' + dane.zamowienia.length + '</b><span>zamówień</span></div>' +
        '<div><b>' + dane.artykuly.length + '</b><span>artykułów</span></div>' +
        '<div><b>' + liczba(sztuk) + '</b><span>sztuk łącznie</span></div>' +
      '</div>' +
      '<div class="karta"><h2>Podział</h2><p>' +
        'Kierowcy: <b>' + (kierowcy.length ? h(kierowcy.join(', ')) : 'brak w pliku') + '</b><br>' +
        'Miasta: <b>' + (miasta.length ? h(miasta.slice(0, 8).join(', ')) +
          (miasta.length > 8 ? ' i ' + (miasta.length - 8) + ' więcej' : '') : 'brak w pliku') +
        '</b>' +
        (dane.informacje.length ? '<br>Kolumny informacyjne: <b>' +
          h(dane.informacje.map(i => i.nazwa).join(', ')) + '</b>' : '') +
      '</p></div>' +
      (DB.lokalizacje().length
        ? '<div class="alert ' + (dane.obcePunkty.length ? 'uw' : 'ok') + '"><div><b>' +
          dane.dopasowanych + ' z ' + dane.zamowienia.length +
          ' wierszy trafiło w punkt z listy</b>' +
          'Miasto, ulica i kierowca biorą się wtedy z karty punktu — dzięki temu ' +
          'filtry się nie powielają.' +
          (dane.obcePunkty.length ? '<br>Nierozpoznane: ' +
            h(dane.obcePunkty.slice(0, 10).map(p => p.nazwa + ' (' + p.ile + ')').join(', ')) +
            (dane.obcePunkty.length > 10 ? ' i ' + (dane.obcePunkty.length - 10) + ' więcej' : '') +
            '. Dopisz je w <i>Więcej → Pomieszczenia i punkty</i>, a przy kolejnym pliku ' +
            'same się podepną.' : '') +
          '</div></div>'
        : '<div class="alert uw"><div><b>Nie masz jeszcze listy punktów</b>' +
          'Miasta pójdą do filtrów tak, jak są napisane w pliku — a tam potrafią się ' +
          'powielać. Listę punktów dodasz w <i>Więcej → Pomieszczenia i punkty</i>.</div></div>') +
      (nowych && impZ.opcje.tworzProdukty
        ? '<div class="alert uw"><div><b>' + nowych + ' artykułów nie ma w katalogu</b>' +
          'Zostaną dopisane, żeby dało się zdejmować stan.</div></div>' : '') +
      (nowych && !impZ.opcje.tworzProdukty
        ? '<div class="alert uw"><div><b>' + nowych + ' artykułów nie ma w katalogu</b>' +
          'Będzie je można odhaczać, ale nie zdejmą stanu magazynowego.</div></div>' : '') +
      (dane.bezPozycji.length
        ? '<div class="alert uw"><div><b>' + dane.bezPozycji.length +
          ' zamówień bez żadnej pozycji</b>Nr: ' +
          h(dane.bezPozycji.slice(0, 8).join(', ')) + '</div></div>' : '') +
      '<div class="naglowek-sekcji">Pierwsze zamówienia</div><div class="lista">' +
      dane.zamowienia.slice(0, 6).map(z =>
        '<div class="poz"><div class="tre"><div class="tyt">' + h(z.nr) + ' · ' +
        h(z.punkt || z.miasto || '—') + '</div><div class="pod">' +
        h([z.miasto, z.ulica, z.kierowca].filter(Boolean).join(' · ')) +
        '</div></div><div class="licz">' + z.pozycje.length + '<small>poz.</small></div></div>')
        .join('') + '</div>' +
      '<button class="b glowny" id="zapisz-z">Wczytaj ' + dane.zamowienia.length + ' zamówień</button>' +
      '<button class="b" id="wroc-z2">← Popraw kolumny</button>',
    po: () => {
      $('#wroc-z2').onclick = () => { impZ.krok = 2; odswiez(); };
      $('#zapisz-z').onclick = async () => {
        const b = $('#zapisz-z');
        b.disabled = true; b.textContent = 'Wczytuję…';
        try {
          await Zam.zapamietajUklad(dane.naglowki, impZ.role);
          const partia = await Zam.zapiszPartie(dane, Object.assign({}, impZ.opcje,
            { plik: impZ.nazwaPliku }));
          resetZam();
          toast('Wczytano ' + partia.ileZamowien + ' zamówień', 3500);
          location.hash = '#/partia/' + partia.id;
        } catch (e) {
          toast('Błąd: ' + e.message, 5000);
          b.disabled = false; b.textContent = 'Spróbuj ponownie';
        }
      };
    }
  };
}

function naglowkiZ() {
  const ark = impZ.arkusze[impZ.arkuszIdx];
  if (!ark) return [];
  return (ark.wiersze[impZ.wierszNagl] || []).map((x, i) =>
    String(x || '').trim() || ('kolumna ' + (i + 1)));
}

/* ---------- lista partii ---------- */
function partie() {
  const lista = DB.partie().sort((a, b) => (b.utw || '').localeCompare(a.utw || ''));
  return {
    tytul: 'Zamówienia', tab: 'zam',
    html:
      '<button class="b glowny" id="nowa-partia">+ Wczytaj plik z zamówieniami</button>' +
      (lista.length ? '<div class="lista">' + lista.map(p => {
        const zam = Zam.zamowieniaPartii(p.id);
        const s = Zam.podsumowanie(zam);
        const proc = s.zamowien ? Math.round(100 * s.gotowe / s.zamowien) : 0;
        return '<a class="poz" href="#/partia/' + p.id + '"><div class="tre">' +
          '<div class="tyt">' + h(p.nazwa) +
          (proc === 100 ? ' <span class="znacz ok">zakończona</span>' : '') + '</div>' +
          '<div class="pod">' + h(dataPL(p.data)) + ' · ' + s.zamowien + ' zamówień · ' +
          liczba(s.sztuk) + ' szt.</div></div>' +
          '<div class="licz">' + proc + '%<small>' + s.gotowe + '/' + s.zamowien + '</small></div></a>';
      }).join('') + '</div>'
        : pusto('▤', 'Brak wczytanych partii. Zacznij od pliku z zamówieniami.')),
    po: () => {
      $('#nowa-partia').onclick = () => { resetZam(); location.hash = '#/zamowienia/import'; };
    }
  };
}

/* ---------- lista zamówień w partii ---------- */
let filtrZ = { kierowca: '', miasto: '', status: '', szukaj: '' };

function partia(param) {
  const p = DB.partie().find(x => x.id === param.id);
  if (!p) return { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiej partii.') };

  const wszystkie = Zam.zamowieniaPartii(p.id);
  const kierowcy = Zam.wartosciFiltra(wszystkie, 'kierowca');
  const miasta = Zam.wartosciFiltra(wszystkie, 'miasto');
  const lista = Zam.filtruj(wszystkie, filtrZ);
  const s = Zam.podsumowanie(lista);
  const sc = Zam.podsumowanie(wszystkie);

  const chip = (k, n, akt) => '<button type="button" data-st="' + k + '"' +
    (akt ? ' class="akt"' : '') + '>' + n + '</button>';

  return {
    tytul: p.nazwa, tab: 'zam', wstecz: true,
    html:
      '<div class="stat">' +
        '<div><b>' + sc.gotowe + ' / ' + sc.zamowien + '</b><span>zamówień gotowych</span></div>' +
        '<div><b>' + liczba(sc.sztukOk) + '</b><span>sztuk wydanych</span></div>' +
        '<div><b style="color:' + (sc.sztuk - sc.sztukOk ? 'var(--uw)' : 'var(--ok)') + '">' +
          liczba(sc.sztuk - sc.sztukOk) + '</b><span>sztuk zostało</span></div>' +
      '</div>' +
      '<div class="filtry">' +
        chip('', 'Wszystkie (' + sc.zamowien + ')', !filtrZ.status) +
        chip('niegotowe', 'Do zrobienia (' + (sc.zamowien - sc.gotowe) + ')', filtrZ.status === 'niegotowe') +
        chip('czesciowo', 'W toku', filtrZ.status === 'czesciowo') +
        chip('gotowe', 'Gotowe (' + sc.gotowe + ')', filtrZ.status === 'gotowe') +
      '</div>' +
      '<div class="rzad">' +
        polSelectId('fKierowca', 'Kierowca', filtrZ.kierowca,
          [['', 'wszyscy']].concat(kierowcy.map(k => [k, k]))) +
        polSelectId('fMiasto', 'Miasto', filtrZ.miasto,
          [['', 'wszystkie']].concat(miasta.map(m => [m, m]))) +
      '</div>' +
      '<div class="szukaj"><input id="qz" type="search" placeholder="Szukaj: nr, punkt, ulica" ' +
        'value="' + h(filtrZ.szukaj) + '" autocomplete="off"></div>' +
      (lista.length !== wszystkie.length || filtrZ.status
        ? '<div class="karta"><p>Widocznych: <b>' + s.zamowien + '</b> zamówień, ' +
          liczba(s.sztuk) + ' szt., gotowych ' + s.gotowe + '.</p></div>' : '') +
      (lista.some(z => z.status !== 'gotowe')
        ? '<button class="b" id="odhacz-widoczne">✓ Odhacz wszystkie widoczne (' +
          lista.filter(z => z.status !== 'gotowe').length + ')</button>' : '') +
      (lista.length
        ? '<div class="lista">' + lista.map(z => wierszZam(z)).join('') + '</div>'
        : pusto('⌕', 'Nic nie pasuje do filtrów.')) +
      '<div class="naglowek-sekcji">Eksport</div>' +
      '<button class="b glowny" id="eksp-gotowe">⤓ Zrobione zamówienia</button>' +
      '<button class="b" id="eksp-wszystko">⤓ Cała partia</button>' +
      '<button class="b" id="eksp-widoczne">⤓ To, co widać po filtrach</button>' +
      '<button class="b zly" id="usun-partie">Usuń partię</button>',
    po: () => {
      widok().querySelectorAll('.filtry button[data-st]').forEach(b =>
        b.onclick = () => { filtrZ.status = b.dataset.st; odswiez(); });
      $('#f-fKierowca').onchange = e => { filtrZ.kierowca = e.target.value; odswiez(); };
      $('#f-fMiasto').onchange = e => { filtrZ.miasto = e.target.value; odswiez(); };
      let t;
      $('#qz').oninput = e => {
        clearTimeout(t);
        const v = e.target.value;
        t = setTimeout(() => { filtrZ.szukaj = v; odswiez();
          const q = $('#qz'); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); } }, 300);
      };
      widok().querySelectorAll('[data-zam]').forEach(b => b.onclick = async e => {
        e.preventDefault();
        const z = DB.zamowienia().find(x => x.id === b.dataset.zam);
        if (!z) return;
        await Zam.odhaczWszystko(z, z.status !== 'gotowe');
        odswiez();
      });
      const ow = $('#odhacz-widoczne');
      if (ow) ow.onclick = async () => {
        const doZrobienia = lista.filter(z => z.status !== 'gotowe');
        if (!(await potwierdz('Odhaczyć zbiorczo?',
          doZrobienia.length + ' zamówień zostanie oznaczonych jako gotowe' +
          (p.zdejmujStan !== false ? ', a stan magazynowy zmniejszy się o ich zawartość.' : '.'),
          'Odhacz'))) return;
        toast('Pracuję…');
        const w = await Zam.odhaczWiele(doZrobienia, true);
        odswiez();
        if (w.braki.length)
          pokazBraki(w.braki, 'uzupełnienie stanu — ' + p.nazwa);
        else
          toast('Odhaczono ' + w.zamowien + ' zamówień, wydań: ' + w.dokumentow, 3500);
      };
      const eks = async (zbior, prefiks) => {
        toast('Generuję plik…');
        const blob = XLS.zbuduj(Zam.arkusze(p, zbior),
          { tytul: p.nazwa, autor: DB.D.ust.firma || 'Magazyn' });
        const w = await Eksport.oddaj(blob, Eksport.nazwaPliku(prefiks));
        toast(w.sposob === 'zapisane' ? 'Plik zapisany w Pobranych' : 'Gotowe', 3600);
      };
      $('#eksp-gotowe').onclick = () => {
        const g = wszystkie.filter(z => z.status === 'gotowe');
        if (!g.length) { toast('Żadne zamówienie nie jest jeszcze gotowe'); return; }
        eks(g, 'zamowienia-zrobione');
      };
      $('#eksp-wszystko').onclick = () => eks(wszystkie, 'zamowienia');
      $('#eksp-widoczne').onclick = () => {
        if (!lista.length) { toast('Nic nie widać'); return; }
        eks(lista, 'zamowienia-wybrane');
      };
      $('#usun-partie').onclick = async () => {
        if (!(await potwierdz('Usunąć partię?',
          'Zniknie ' + wszystkie.length + ' zamówień. Dokumenty wydania, które już powstały, ' +
          'zostaną nienaruszone — jeśli chcesz cofnąć stany, najpierw odznacz zamówienia.',
          'Usuń'))) return;
        wszystkie.forEach(z => { z.usuniety = true; });
        await DB.zapiszWiele('zamowienia', wszystkie);
        await DB.usun('partie', p.id);
        toast('Usunięto');
        location.hash = '#/zamowienia';
      };
    }
  };
}

function wierszZam(z) {
  const ok = z.pozycje.filter(p => p.ok).length;
  const kl = z.status === 'gotowe' ? 'ok' : z.status === 'czesciowo' ? 'uw' : '';
  return '<div class="poz" style="gap:8px">' +
    '<a href="#/zamowienie/' + z.id + '" class="tre" style="text-decoration:none;color:inherit">' +
      '<div class="tyt">' + h(z.nr) + ' · ' + h(z.punkt || z.miasto || '—') +
      (z.status !== 'nowe' ? ' <span class="znacz ' + kl + '">' +
        h(Zam.ETYKIETY_STATUSU[z.status]) + '</span>' : '') + '</div>' +
      '<div class="pod">' + h([z.miasto, z.ulica, z.kierowca].filter(Boolean).join(' · ') || '—') +
      '</div></a>' +
    '<div class="licz" style="min-width:44px">' + ok + '/' + z.pozycje.length + '</div>' +
    '<button type="button" data-zam="' + z.id + '" class="b maly" style="min-width:44px;' +
      (z.status === 'gotowe' ? 'background:var(--ok-tlo);border-color:var(--ok);color:var(--ok)' : '') +
      '">' + (z.status === 'gotowe' ? '✓' : '○') + '</button></div>';
}

/* ---------- pojedyncze zamówienie ---------- */
function zamowienie(param) {
  const z = DB.zamowienia().find(x => x.id === param.id);
  if (!z) return { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiego zamówienia.') };
  const p = Zam.partiaZam(z);
  const ok = z.pozycje.filter(x => x.ok).length;

  return {
    tytul: 'Zamówienie ' + z.nr, wstecz: true,
    html:
      '<div class="karta"><h2>' + h(z.punkt || z.miasto || 'Zamówienie ' + z.nr) + '</h2><p>' +
        h([z.miasto, z.ulica].filter(Boolean).join(', ') || '—') +
        (z.kierowca ? '<br>Kierowca: <b>' + h(z.kierowca) + '</b>' : '') +
        (p ? '<br>Partia: ' + h(p.nazwa) : '') +
      '</p></div>' +
      (z.info && z.info.length
        ? '<div class="karta"><h2>Informacje</h2><p>' +
          z.info.map(i => '<b>' + h(i.n) + ':</b> ' + h(i.v)).join('<br>') + '</p></div>' : '') +
      '<div class="przyciski">' +
        '<button class="b glowny" id="wszystko">✓ Odhacz wszystko</button>' +
        '<button class="b" id="cofnij">Cofnij wszystko</button>' +
      '</div>' +
      '<div class="naglowek-sekcji"><span>Pozycje</span><span>' + ok + ' / ' +
        z.pozycje.length + '</span></div>' +
      (z.pozycje.length
        ? '<div class="lista">' + (() => { const dost = Zam.dostepne(); return z.pozycje.map((poz, i) =>
            '<button class="poz" type="button" data-i="' + i + '"' +
            (poz.ok ? ' style="background:var(--ok-tlo)"' : '') + '>' +
            '<div style="font-size:22px;flex:none;width:26px;text-align:center;color:' +
              (poz.ok ? 'var(--ok)' : 'var(--tx2)') + '">' + (poz.ok ? '☑' : '☐') + '</div>' +
            '<div class="tre"><div class="tyt"' +
              (poz.ok ? ' style="text-decoration:line-through;opacity:.65"' : '') + '>' +
              h(poz.nazwa) + '</div>' +
            '<div class="pod">' + (() => {
              if (!poz.produktId) return 'spoza katalogu — bez kontroli stanu';
              if (poz.ok) return 'wydane' + (poz.kiedy ? ' · ' + dataGodzPL(poz.kiedy) : '');
              const d = dost.get(poz.produktId) || 0;
              return d < poz.ilosc
                ? '<span style="color:var(--zle);font-weight:600">brakuje ' +
                  liczba(poz.ilosc - d) + ' szt. — dostępne ' + liczba(d) + '</span>'
                : 'dostępne ' + liczba(d) + ' szt.';
            })() + '</div></div>' +
            '<div class="licz">' + liczba(poz.ilosc) + '<small>szt.</small></div></button>').join('');
          })() + '</div>'
        : pusto('—', 'To zamówienie nie ma żadnej pozycji.')) +
      (z.dokumentId
        ? '<div class="alert ok"><div><b>Stan zdjęty z magazynu</b>' +
          'Powstał dokument wydania. <a href="#/dokument/' + z.dokumentId + '">Zobacz →</a> ' +
          'Odznaczenie pozycji cofnie ten dokument.</div></div>'
        : (p && p.zdejmujStan === false
          ? '<div class="karta"><p>Ta partia nie zdejmuje stanu magazynowego.</p></div>' : '')),
    po: () => {
      widok().querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
        const w = await Zam.przelacz(z, +b.dataset.i);
        odswiez();
        if (!w.ok && w.braki) pokazBraki(w.braki, 'uzupełnienie przed zamówieniem ' + z.nr);
      });
      $('#wszystko').onclick = async () => {
        const w = await Zam.odhaczWszystko(z, true);
        odswiez();
        if (w.braki.length) pokazBraki(w.braki, 'uzupełnienie przed zamówieniem ' + z.nr);
      };
      $('#cofnij').onclick = async () => { await Zam.odhaczWszystko(z, false); odswiez(); };
    }
  };
}

/* ==================================================================
   SZYBKIE NOTATKI — złapać teraz, rozliczyć później
   ================================================================== */
function notatki() {
  const otwarte = DB.notatki().filter(n => !n.zrobiona)
    .sort((a, b) => (b.utw || '').localeCompare(a.utw || ''));
  const zrobione = DB.notatki().filter(n => n.zrobiona)
    .sort((a, b) => (b.zrobiona || '').localeCompare(a.zrobiona || '')).slice(0, 10);

  const wiersz = n =>
    '<div class="poz"' + (n.zrobiona ? ' style="opacity:.55"' : '') + '>' +
    '<button type="button" data-ptak="' + n.id + '" ' +
      'style="background:none;border:0;font-size:22px;width:28px;flex:none;padding:0;' +
      'color:' + (n.zrobiona ? 'var(--ok)' : 'var(--tx2)') + '">' +
      (n.zrobiona ? '☑' : '☐') + '</button>' +
    '<div class="tre"><div class="tyt" style="white-space:normal"' +
      (n.zrobiona ? ' style="text-decoration:line-through"' : '') + '>' +
      h(n.tekst) + '</div>' +
    '<div class="pod">' + h(dataGodzPL(n.utw)) + '</div></div>' +
    '<button type="button" class="b maly" data-usun-n="' + n.id + '" ' +
      'style="min-width:40px">✕</button></div>';

  return {
    tytul: 'Notatki', tab: 'pulpit', wstecz: true,
    html:
      '<div class="karta"><h2>Po co to jest</h2><p>Miejsce na „wziąłem 3 ryzy papieru ' +
      'do księgowości" wtedy, gdy nie ma czasu wpisywać tego porządnie. ' +
      'Zapisujesz jednym zdaniem, a dokument robisz później.<br><br>' +
      '<b>Dyktowanie:</b> dotknij pola poniżej i naciśnij ikonę mikrofonu ' +
      'na swojej klawiaturze — Android zamieni mowę na tekst.</p></div>' +
      '<label><span class="et">Treść notatki</span>' +
      '<textarea id="tresc-n" placeholder="np. wydałem 3 ryzy papieru A4 do księgowości" ' +
      'style="min-height:96px"></textarea></label>' +
      '<button class="b glowny" id="zapisz-n">Zapisz notatkę</button>' +
      (otwarte.length
        ? '<div class="naglowek-sekcji"><span>Do rozliczenia</span><span>' +
            otwarte.length + '</span></div><div class="lista">' +
          otwarte.map(wiersz).join('') + '</div>' +
          '<div class="przyciski">' +
            '<a class="b" href="#/dokument/nowy/RW" id="do-rw">→ Zrób wydanie</a>' +
            '<a class="b" href="#/dokument/nowy/PZ" id="do-pz">→ Zrób dostawę</a>' +
          '</div>' +
          '<p style="font-size:13px;color:var(--tx2);margin:0 2px 12px">' +
          'Przyciski otwierają nowy dokument z treścią pierwszej notatki w uwagach. ' +
          'Po zapisaniu dokumentu notatka odhaczy się sama.</p>'
        : pusto('✎', 'Nic nie czeka na rozliczenie.')) +
      (zrobione.length
        ? '<div class="naglowek-sekcji">Rozliczone</div><div class="lista">' +
          zrobione.map(wiersz).join('') + '</div>' : ''),
    po: () => {
      const pole = $('#tresc-n');
      $('#zapisz-n').onclick = async () => {
        const t = pole.value.trim();
        if (!t) { toast('Notatka jest pusta'); return; }
        await DB.zapisz('notatki', { tekst: t, kto: DB.D.ust.osoba || '' });
        pole.value = '';
        toast('Zapisano');
        odswiez();
      };
      widok().querySelectorAll('[data-ptak]').forEach(b => b.onclick = async () => {
        const n = DB.notatki().find(x => x.id === b.dataset.ptak);
        if (!n) return;
        if (n.zrobiona) delete n.zrobiona; else n.zrobiona = DB.teraz();
        await DB.zapisz('notatki', n);
        odswiez();
      });
      widok().querySelectorAll('[data-usun-n]').forEach(b => b.onclick = async () => {
        if (!(await potwierdz('Usunąć notatkę?', 'Zniknie bez śladu.', 'Usuń'))) return;
        await DB.usun('notatki', b.dataset['usunN']);
        odswiez();
      });
      ['#do-rw', '#do-pz'].forEach(sel => {
        const a = $(sel);
        if (!a) return;
        a.onclick = e => {
          e.preventDefault();
          const typ = sel === '#do-rw' ? 'RW' : 'PZ';
          const n = otwarte[0];
          roboczy = { typ, numer: DB.nastepnyNumer(typ), data: dzisISO(),
                      pozycje: [], uwagi: n.tekst, zNotatki: n.id };
          location.hash = '#/dokument/nowy/' + typ;
        };
      });
    }
  };
}

/* ==================================================================
   PRZENOSZENIE SPRZĘTU — zapis w chwili zabierania
   ================================================================== */
function przenoszenie() {
  const wdr = Przen.wDrodze();
  const lok = DB.lokalizacje().sort((a, b) =>
    Eksport.nazwaLok(a.id).localeCompare(Eksport.nazwaLok(b.id), 'pl'));
  const ostatnie = Przen.ostatnieCele(4)
    .map(id => lok.find(l => l.id === id)).filter(Boolean);

  return {
    tytul: 'Przenoszenie sprzętu', tab: 'sprzet', wstecz: true,
    html:
      (wdr.length
        ? ''
        : '<div class="karta"><h2>Jak to działa</h2><p>Gdy bierzesz coś do ręki — ' +
          'zeskanuj etykietę i tyle. Nie musisz od razu wiedzieć, gdzie to trafi. ' +
          'Sprzęt zostaje „w drodze”, a miejsce docelowe podajesz, kiedy będzie ' +
          'wygodnie: za pięć minut albo pod koniec dnia.</p></div>') +
      '<button class="b glowny" id="zabierz" style="padding:18px;font-size:17px">' +
        '⇄ Zabieram — skanuj</button>' +
      (wdr.length
        ? '<div class="naglowek-sekcji"><span>W drodze</span><span>' +
            zOdmiana(wdr.length, SZT) + '</span></div>' +
          '<div class="lista">' + wdr.map(s =>
            '<div class="poz"><div class="tre"><div class="tyt">' +
            h(s.nazwa || s.nrInw) + '</div><div class="pod">' +
            h(s.nrInw || '') + ' · zabrane z: ' +
            h(Eksport.nazwaLok(s.wDrodze.zId) || 'brak przypisania') + ' · ' +
            h(dataGodzPL(s.wDrodze.kiedy)) + '</div></div>' +
            '<button type="button" class="b maly" data-cofnij="' + s.id +
            '" style="min-width:44px">✕</button></div>').join('') + '</div>' +
          '<div class="naglowek-sekcji">Dokąd trafiły?</div>' +
          (ostatnie.length
            ? '<div class="filtry">' + ostatnie.map(l =>
                '<button type="button" data-cel="' + l.id + '">' +
                h(l.nazwa || l.kod) + '</button>').join('') + '</div>'
            : '') +
          '<button class="b glowny" id="skanCel">⌗ Zeskanuj pomieszczenie</button>' +
          (lok.length
            ? polSelectId('celLok', 'Albo wybierz z listy', '',
                [['', '— wybierz —']].concat(lok.map(l => [l.id, Eksport.nazwaLok(l.id)])))
            : '<div class="alert uw"><div>Nie masz jeszcze pomieszczeń. ' +
              '<a href="#/lokalizacja/nowa">Dodaj pierwsze →</a></div></div>')
        : pusto('⇄', 'Nic nie jest w drodze.')),
    po: () => {
      $('#zabierz').onclick = () => Skaner.otworz({
        tytul: 'Zabieram sprzęt',
        podpowiedz: 'Skanuj etykiety — okno zostaje otwarte.',
        onKod: async kod => {
          const w = await Przen.zabierzKod(kod);
          if (w.blad) { Skaner.info(w.blad); return; }
          const nazwa = w.sprzet.nazwa || w.sprzet.nrInw || kod;
          if (w.juz) { Skaner.info('Już w drodze: ' + nazwa); return; }
          Skaner.info((w.nowy ? '+ nowy: ' : '✓ zabrane: ') + nazwa +
                      ' (' + Przen.wDrodze().length + ')');
        }
      });
      widok().querySelectorAll('[data-cofnij]').forEach(b => b.onclick = async () => {
        await Przen.anuluj(b.dataset.cofnij);
        toast('Cofnięto');
        odswiez();
      });
      const odloz = async celId => {
        const l = lok.find(x => x.id === celId);
        if (!l) return;
        const w = await Przen.odloz(celId);
        toast(zOdmiana(w.przeniesione, SZT) + ' → ' + (l.nazwa || l.kod), 3500);
        odswiez();
        if (w.ruchy.length) zapytajOZgloszenie(w.ruchy);
      };
      widok().querySelectorAll('[data-cel]').forEach(b =>
        b.onclick = () => odloz(b.dataset.cel));
      const sel = $('#f-celLok');
      if (sel) sel.onchange = () => { if (sel.value) odloz(sel.value); };
      const sc = $('#skanCel');
      if (sc) sc.onclick = async () => {
        const k = await Skaner.jedenKod({ tytul: 'Zeskanuj pomieszczenie docelowe' });
        if (!k) return;
        const t = DB.poKodzie(k);
        if (t.rodzaj === 'lokalizacja') odloz(t.obiekt.id);
        else toast('To nie jest kod pomieszczenia: ' + k, 3500);
      };
    }
  };
}

function zapytajOZgloszenie(ruchy) {

    'czy zostawić do zbiorczego podsumowania?</p>',
    [{ tekst: 'Później', akcja: () => {} },
     { tekst: 'Zgłoś teraz', klasa: 'glowny', akcja: () => {
        location.hash = '#/zgloszenia';
      } }]);
}

/* ---------- zgłoszenia do ewidencji ---------- */
function zgloszenia() {
  const niezg = Przen.niezgloszone();
  const opisy = niezg.map(r => Przen.opisRuchu(r));
  const ost = DB.D.ust.ostatnieZgloszenie;

  return {
    tytul: 'Zgłoszenia do ewidencji', tab: 'sprzet', wstecz: true,
    html:
      '<div class="karta"><h2>Po co to jest</h2><p>Przenosisz rzeczy fizycznie, ' +
      'a ktoś inny wprowadza to do firmowego systemu. Tu zbiera się wszystko, ' +
      'czego jeszcze nie zgłosiłeś — jedną wiadomością, zamiast pisać za każdym razem.' +
      (ost ? '<br><br>Ostatnie zgłoszenie: <b>' + h(dataGodzPL(ost)) + '</b>' : '') +
      '</p></div>' +
      (niezg.length
        ? '<div class="naglowek-sekcji"><span>Do zgłoszenia</span><span>' +
            niezg.length + '</span></div>' +
          '<div class="lista">' + opisy.map((o, i) =>
            '<div class="poz"><div class="tre"><div class="tyt">' + h(o.sprzet) + '</div>' +
            '<div class="pod">' + h(o.skad) + ' → ' + h(o.dokad) + ' · ' +
            h(dataPL(o.kiedy)) + '</div></div></div>').join('') + '</div>' +
          '<button class="b glowny" id="zglos">✉ Zgłoś wszystkie (' + niezg.length + ')</button>' +
          '<button class="b" id="podglad">Pokaż treść wiadomości</button>'
        : pusto('✓', 'Wszystko zgłoszone. Nie ma nic do wysłania.')) +
      (DB.D.ust.emailEwidencja
        ? ''
        : '<div class="alert uw"><div><b>Nie masz adresu do zgłoszeń</b>' +
          'Wpisz go w Ustawieniach, a będzie się podstawiał sam. ' +
          '<a href="#/ustawienia">Ustawienia →</a></div></div>'),
    po: () => {
      if (!niezg.length) return;
      const tresc = () => Przen.trescPodsumowania(niezg);
      $('#podglad').onclick = () => modal('Treść wiadomości',
        '<pre style="white-space:pre-wrap;font-size:12px;background:var(--pow2);' +
        'border:1px solid var(--linia);border-radius:10px;padding:11px;max-height:52dvh;' +
        'overflow:auto;margin:0;font-family:ui-monospace,monospace">' + h(tresc()) + '</pre>',
        [{ tekst: 'Zamknij' }]);
      $('#zglos').onclick = () => {
        const t = tresc();
        modal('Zgłoś przemieszczenia',
          '<label><span class="et">Adres e-mail</span>' +
          '<input id="m-adres" type="email" inputmode="email" value="' +
          h(DB.D.ust.emailEwidencja || '') + '"></label>' +
          '<p style="font-size:13.5px;color:var(--tx2)">Po wysłaniu ' +
          zOdmiana(niezg.length, PRZEM) + ' zostanie oznaczonych jako zgłoszone ' +
          'i zniknie z tej listy.</p>',
          [{ tekst: 'Anuluj' },
           { tekst: 'Kopiuj treść', zamknij: false, akcja: async () => {
              const ok = await Przek.doSchowka(t);
              toast(ok ? 'Skopiowano' : 'Nie udało się skopiować', 3000);
            } },
           { tekst: 'Otwórz w mailu', klasa: 'glowny', akcja: async () => {
              const adres = $('#m-adres').value.trim();
              if (adres && adres !== DB.D.ust.emailEwidencja)
                await DB.ustaw('emailEwidencja', adres);
              const skrocone = Przek.wyslij(adres,
                'Przemieszczenia sprzętu do wprowadzenia' +
                (DB.D.ust.firma ? ' — ' + DB.D.ust.firma : ''), t);
              await Przen.oznaczZgloszone(niezg);
              toast(skrocone
                ? 'Lista długa — w mailu jest skrót. Pełna treść pod „Kopiuj treść”.'
                : 'Oznaczono jako zgłoszone', 4500);
              odswiez();
            } }]);
      };
    }
  };
}

let nowePrz = null;

function przekazania() {
  const lista = DB.przekazania().sort((a, b) =>
    (b.data || '').localeCompare(a.data || '') || (b.utw || '').localeCompare(a.utw || ''));
  return {
    tytul: 'Wydawanie na punkty', tab: 'sprzet', wstecz: true,
    html:
      '<div class="karta"><h2>Jak to działa</h2><p>Wybierasz punkt, dorzucasz środki ' +
      '(skanerem albo z listy) i zapisujesz. Sprzęt zmienia lokalizację, a Ty dostajesz ' +
      'gotowe potwierdzenie do wysłania mailem albo do wydruku.</p></div>' +
      '<button class="b glowny" id="nowe">+ Nowe przekazanie</button>' +
      (lista.length
        ? '<div class="lista">' + lista.map(p => {
            const n = (p.pozycje || []).length;
            return '<a class="poz" href="#/przekazanie/' + p.id + '"><div class="tre">' +
              '<div class="tyt">' + h(p.nr) + ' · ' + h(Eksport.nazwaLok(p.lokalizacjaId) || '—') +
              '</div><div class="pod">' + h(dataPL(p.data)) +
              (p.osoba ? ' · ' + h(p.osoba) : '') + '</div></div>' +
              '<div class="licz">' + n + '<small>szt.</small></div></a>';
          }).join('') + '</div>'
        : pusto('→', 'Brak przekazań. Zacznij od pierwszego.')),
    po: () => {
      $('#nowe').onclick = () => { nowePrz = null; location.hash = '#/przekazanie/nowe'; };
    }
  };
}

function przekazanieNowe(param) {
  const punkty = DB.lokalizacje().sort((a, b) =>
    Eksport.nazwaLok(a.id).localeCompare(Eksport.nazwaLok(b.id), 'pl'));
  if (!nowePrz) {
    const lok = param.lok && punkty.find(l => l.id === param.lok);
    nowePrz = { lokalizacjaId: lok ? lok.id : '', osoba: lok ? (lok.osoba || '') : '',
                email: lok ? (lok.email || '') : '', uwagi: '', pozycje: [] };
  }
  if (!punkty.length)
    return { tytul: 'Nowe przekazanie', wstecz: true,
      html: '<div class="alert uw"><div><b>Najpierw dodaj punkty</b>' +
            'Wydawać można tylko na zdefiniowane pomieszczenia i punkty. ' +
            '<a href="#/lokalizacja/nowa">Dodaj pierwszy →</a></div></div>' };

  const wybrane = nowePrz.pozycje
    .map(id => DB.sprzety().find(s => s.id === id)).filter(Boolean);

  return {
    tytul: 'Nowe przekazanie', wstecz: true,
    html:
      '<div class="karta">' +
      polSelectId('lokP', 'Punkt docelowy *', nowePrz.lokalizacjaId,
        [['', '— wybierz —']].concat(punkty.map(l => [l.id, Eksport.nazwaLok(l.id)]))) +
      pole('osobaP', 'Osoba odbierająca', nowePrz.osoba) +
      pole('emailP', 'E-mail do potwierdzenia', nowePrz.email, 'email') +
      poleObszar('uwagiP', 'Uwagi', nowePrz.uwagi) +
      '</div>' +
      '<div class="naglowek-sekcji"><span>Środki do wydania</span><span>' +
        wybrane.length + ' szt.</span></div>' +
      (wybrane.length
        ? '<div class="lista">' + wybrane.map(s =>
            '<button class="poz" type="button" data-usun="' + s.id + '"><div class="tre">' +
            '<div class="tyt">' + h(s.nazwa || s.nrInw) + '</div><div class="pod">' +
            h(s.nrInw || '') + ' · teraz: ' +
            h(Eksport.nazwaLok(s.lokalizacjaId) || 'bez przypisania') +
            '</div></div><div class="licz" style="color:var(--zle)">✕</div></button>').join('') +
          '</div>'
        : pusto('＋', 'Dodaj środki skanerem albo z listy.')) +
      '<div class="przyciski">' +
        '<button class="b glowny" id="skanP">⌗ Skanuj</button>' +
        '<button class="b" id="listaP">+ Z listy</button>' +
      '</div>' +
      '<button class="b glowny" id="zapiszP" style="margin-top:6px">Zapisz przekazanie</button>' +
      '<button class="b zly" id="porzucP">Porzuć</button>',
    po: () => {
      const zbierzNaglowek = () => {
        nowePrz.lokalizacjaId = $('#f-lokP').value;
        nowePrz.osoba = $('#f-osobaP').value.trim();
        nowePrz.email = $('#f-emailP').value.trim();
        nowePrz.uwagi = $('#f-uwagiP').value.trim();
      };
      widok().querySelectorAll('.karta input,.karta select,.karta textarea')
        .forEach(i => i.onchange = zbierzNaglowek);
      /* wybór punktu podpowiada osobę i adres z jego karty */
      $('#f-lokP').onchange = () => {
        const l = punkty.find(x => x.id === $('#f-lokP').value);
        if (l) {
          if (!$('#f-osobaP').value && l.osoba) $('#f-osobaP').value = l.osoba;
          if (!$('#f-emailP').value && l.email) $('#f-emailP').value = l.email;
        }
        zbierzNaglowek();
      };
      widok().querySelectorAll('[data-usun]').forEach(b => b.onclick = () => {
        zbierzNaglowek();
        nowePrz.pozycje = nowePrz.pozycje.filter(x => x !== b.dataset.usun);
        odswiez();
      });
      $('#skanP').onclick = () => {
        zbierzNaglowek();
        Skaner.otworz({
          tytul: 'Skanuj środki do wydania',
          podpowiedz: 'Skanuj kolejne etykiety — okno zostaje otwarte.',
          onKod: async kod => {
            const w = await Przen.sprzetZKodu(kod);
            if (w.blad) { Skaner.info(w.blad); return; }
            const nazwa = w.sprzet.nazwa || w.sprzet.nrInw || kod;
            if (nowePrz.pozycje.includes(w.sprzet.id)) {
              Skaner.info('Już na liście: ' + nazwa);
              return;
            }
            nowePrz.pozycje.push(w.sprzet.id);
            Skaner.info((w.nowy ? '+ nowy: ' : '✓ ') + nazwa +
                        ' (' + nowePrz.pozycje.length + ')');
          }
        });
      };
      $('#listaP').onclick = () => { zbierzNaglowek(); wybierzSprzet(); };
      $('#zapiszP').onclick = async () => {
        zbierzNaglowek();
        if (!nowePrz.lokalizacjaId) { toast('Wybierz punkt docelowy'); return; }
        if (!nowePrz.pozycje.length) { toast('Dodaj przynajmniej jeden środek'); return; }
        const p = await Przek.zapisz(nowePrz);
        nowePrz = null;
        toast('Zapisano ' + p.nr, 3000);
        location.hash = '#/przekazanie/' + p.id;
      };
      $('#porzucP').onclick = async () => {
        if (nowePrz.pozycje.length && !(await potwierdz('Porzucić przekazanie?',
          'Wybrane pozycje przepadną.', 'Porzuć'))) return;
        nowePrz = null;
        location.hash = '#/przekazania';
      };
    }
  };
}

function wybierzSprzet() {
  const cel = nowePrz.lokalizacjaId;
  /* Sprzętu stojącego już w punkcie docelowym nie ukrywamy — tylko zsuwamy
     na koniec i opisujemy, żeby pusta lista nie wyglądała na awarię. */
  const lista = DB.sprzety()
    .filter(s => !nowePrz.pozycje.includes(s.id))
    .sort((a, b) => (a.lokalizacjaId === cel) - (b.lokalizacjaId === cel) ||
                    (a.nazwa || '').localeCompare(b.nazwa || '', 'pl'));
  const zazn = new Set();

  const rysuj = f => {
    const w = f ? lista.filter(s => pasuje(s.nazwa, f) || pasuje(s.nrInw, f) ||
                                    pasuje(s.nrSer, f) || pasuje(s.model, f)) : lista;
    document.getElementById('m-lista2').innerHTML = w.length
      ? w.map(s => '<button class="poz" type="button" data-id="' + s.id + '"' +
          (zazn.has(s.id) ? ' style="background:var(--ok-tlo)"' : '') + '>' +
          '<div style="font-size:20px;width:24px;flex:none;text-align:center;color:' +
            (zazn.has(s.id) ? 'var(--ok)' : 'var(--tx2)') + '">' +
            (zazn.has(s.id) ? '☑' : '☐') + '</div>' +
          '<div class="tre"><div class="tyt">' + h(s.nazwa || s.nrInw) +
          (s.lokalizacjaId === cel ? ' <span class="znacz">już tutaj</span>' : '') + '</div>' +
          '<div class="pod">' + h(s.nrInw || '') + ' · ' +
          h(Eksport.nazwaLok(s.lokalizacjaId) || 'bez przypisania') + '</div></div></button>').join('')
      : '<div class="poz"><div class="pod">Nic nie pasuje.</div></div>';
    document.querySelectorAll('#m-lista2 .poz[data-id]').forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      if (zazn.has(id)) zazn.delete(id); else zazn.add(id);
      rysuj(document.getElementById('m-q2').value.trim());
      const btn = [...document.querySelectorAll('#modal-przyciski button')]
        .find(x => x.textContent.startsWith('Dodaj'));
      if (btn) btn.textContent = 'Dodaj (' + zazn.size + ')';
    });
  };

  modal('Wybierz środki',
    '<div class="szukaj"><input id="m-q2" type="search" placeholder="Nazwa, nr inwentarzowy, seryjny" autocomplete="off"></div>' +
    '<div class="lista" id="m-lista2" style="max-height:46dvh;overflow:auto"></div>',
    [{ tekst: 'Anuluj' },
     { tekst: 'Dodaj (0)', klasa: 'glowny', akcja: () => {
        nowePrz.pozycje.push(...zazn);
        odswiez();
      } }]);
  document.getElementById('m-q2').oninput = e => rysuj(e.target.value.trim());
  rysuj('');
}

function przekazanie(param) {
  const p = DB.przekazania().find(x => x.id === param.id);
  if (!p) return { tytul: 'Nie znaleziono', html: pusto('?', 'Nie ma takiego przekazania.') };
  const lista = Przek.sprzetyPrzekazania(p);

  return {
    tytul: p.nr, wstecz: true,

        h(dataPL(p.data)) +
        (p.osoba ? '<br>Odbierający: <b>' + h(p.osoba) + '</b>' : '') +
        (p.kto ? '<br>Przekazał: ' + h(p.kto) : '') +
        (p.email ? '<br>' + h(p.email) : '') +
        (p.uwagi ? '<br>' + h(p.uwagi) : '') +
      '</p></div>' +
      '<button class="b glowny" id="mailP">✉ Wyślij potwierdzenie mailem</button>' +
      '<button class="b" id="drukP">Wydruk / PDF</button>' +
      '<div class="naglowek-sekcji"><span>Przekazane środki</span><span>' +
        lista.length + ' szt.</span></div>' +
      '<div class="lista">' + lista.map(s =>
        '<a class="poz" href="#/sprzet/' + s.id + '"><div class="tre">' +
        '<div class="tyt">' + h(s.nazwa || s.nrInw) + '</div><div class="pod">' +
        h(s.nrInw || '') + (s.nrSer ? ' · ' + h(s.nrSer) : '') + '</div></div>' +
        '<div class="licz">1<small>szt.</small></div></a>').join('') + '</div>' +
      '<button class="b zly" id="usunP">Usuń przekazanie</button>',
    po: () => {
      $('#mailP').onclick = () => wyslijPotwierdzenie(p.email,
        'Potwierdzenie przekazania ' + p.nr + (DB.D.ust.firma ? ' — ' + DB.D.ust.firma : ''),
        Przek.trescMaila(p));
      $('#drukP').onclick = () => Przek.drukuj(p);
      $('#usunP').onclick = async () => {
        if (!(await potwierdz('Usunąć przekazanie?',
          'Zniknie wpis przekazania. Sprzęt zostanie tam, gdzie jest teraz — ' +
          'jeśli trzeba go cofnąć, przenieś go ręcznie.', 'Usuń'))) return;
        await DB.usun('przekazania', p.id);
        toast('Usunięto');
        location.hash = '#/przekazania';
      };
    }
  };
}
